<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ply">
  <title>Ply</title>
  <!-- Full-bleed on purpose: this is a maskable icon, so the platform is allowed
       to crop it to a circle, a squircle or a rounded square. Everything that
       has to survive that crop sits inside the central 80% safe zone. -->
  <defs>
    <linearGradient id="ply" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ec9a0"/>
      <stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#ply)"/>
  <!-- three strands twisted into one thread: the whole app in one mark -->
  <g fill="none" stroke="#0e1014" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
    <path d="M146 134 C146 232 256 220 256 302"/>
    <path d="M256 134 C256 232 256 220 256 302"/>
    <path d="M366 134 C366 232 256 220 256 302"/>
    <path d="M256 302 L256 386"/>
  </g>
</svg>
