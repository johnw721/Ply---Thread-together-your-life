  CK={q, i:resume?resume.i:0, touched:resume?resume.touched:0, deferred};
  if(resume) toast('Picking up where you left off — card '+(resume.i+1)+' of '+q.length+'.');
  renderCheckin();
}
function ckSaveProgress(){
  if(!CK) return;
  DB.meta.checkinProgress = CK.i>0 && CK.i<CK.q.length-1
    ? {dateKey:today(), i:CK.i, touched:CK.touched} : null;
  save();
}
function ckNext(){ CKROW=null; CK.i++; if(CK.i>=CK.q.length) CK.i=CK.q.length-1; ckSaveProgress(); renderCheckin(); }
function ckBack(){ CKROW=null; CK.i=Math.max(0,CK.i-1); ckSaveProgress(); renderCheckin(); }

function subjHead(g,t){
  const bits=[TYPE[g.type].label];
  if(t && t.name!=='Main') bits.push(t.name);
  if(t) bits.push(({sequential:'sequential',parallel:'parallel',conditional:'branching',cyclical:'recurring'})[t.rel]||t.rel);
  return `<div class="subject"><div class="sh">
      <span class="dot" style="background:${QUAD[bestQuadrant(g)].c}"></span>
      <span class="g">${bits.map(esc).join(' · ')}</span></div>
    <div class="sn">${esc(g.title)}</div>
    ${g.why?`<div class="tiny muted" style="margin-top:5px">why: ${esc(g.why)}</div>`:''}</div>`;
}

function renderCheckin(){
  const c=CK.q[CK.i];
  const prog=CK.q.map((_,n)=>`<div class="s ${n<CK.i?'done':n===CK.i?'on':''}"></div>`).join('');
  let body='', foot='', title='Weekly check-in';

  if(c.t==='intro'){
    const a=c.ag; const n=a.gates.length+a.quiet.length+a.blocked.length+a.nostep.length+a.branch.length;
    const ft=followThrough(null,14);
    body=`<p class="wizq">Since ${a.since===today()?'today':fmtDate(a.since)}</p>
      <p class="wizsub">${n===0?'Nothing is drifting. Quick pass and you’re out.'
        : c.deferred>0 ? `${CK_MAX} of ${c.total} to answer — that's enough for one sitting. The rest stay in the ribbon,
            where you can fix any of them without coming back here.`
        :'These threads need an answer before they can be considered live.'}</p>
      ${a.hush.length?`<div class="sec tiny muted" style="border-color:#333a47">
        ${a.hush.length} thread${a.hush.length>1?'s have':' has'} gone quiet past ${HUSH_AT}&times; its cadence and stopped
        nagging. They're off this list — revive or drop them from the ribbon when you want to.</div>`:''}
      <div class="sec"><div class="stat">
        <div><div class="k">${a.quiet.length}</div><div class="kl">no movement</div></div>
        <div><div class="k">${a.blocked.length}</div><div class="kl">blocked</div></div>
        <div><div class="k">${a.nostep.length+a.branch.length}</div><div class="kl">no next step</div></div>
        <div><div class="k">${a.unsched.length}</div><div class="kl">unscheduled</div></div>
        <div><div class="k">${a.gates.length}</div><div class="kl">questions queued</div></div>
      </div></div>
      <div class="sec"><h4>Follow-through, last 14 days</h4>
        <div class="stat"><div><div class="k">${ft.done}<span class="muted" style="font-size:15px">/${ft.planned}</span></div>
          <div class="kl">steps done vs planned</div></div></div>
        <div class="barmini"><i style="width:${ft.rate}%"></i></div></div>`;
    foot=`<span class="spacer"></span><button class="btn primary" data-ck="next">Start &rarr;</button>`;
  }

  else if(c.t==='gate'){
    const g=c.goal, k=c.gate.kind;
    title='Queued question';
    body=subjHead(g,null)+`<p class="wizq">${esc(c.gate.q)}</p>`;
    if(k==='deadline'){
      body+=`<p class="wizsub">Deadline-type goals need a real date &mdash; the metric climbs toward it.</p>
        <label class="fld"><span>Hard date</span><input type="date" id="ckDate" value="${g.smart.deadline||''}"></label>
        <label class="fld"><span>What proves it’s done (metric)</span><input type="text" id="ckMetric" value="${esc(g.smart.metricName||'')}" placeholder="e.g. passing exam score"></label>`;
      foot=`<button class="btn" data-ck="skip">Ask me next week</button><span class="spacer"></span>
            <button class="btn" data-ck="gate-retype">Not a deadline goal</button>
            <button class="btn primary" data-ck="gate-deadline">Set date</button>`;
    } else if(k==='trigger'){
      body+=`<p class="wizsub">Until this fires the goal stays dormant and will not appear anywhere or nag you.</p>
        <label class="fld"><span>Trigger condition</span><input type="text" id="ckTrig" value="${esc(g.trigger||'')}" placeholder="e.g. offer accepted on the house"></label>`;
      foot=`<button class="btn" data-ck="skip">Ask me next week</button><span class="spacer"></span>
            <button class="btn" data-ck="gate-fire">It already fired &mdash; activate</button>
            <button class="btn primary" data-ck="gate-trigger">Save trigger</button>`;
    } else if(k==='decision'){
      body+=`<p class="wizsub">A decision resolves once and then either closes or converts. A goal gets executed on a cadence.</p>`;
      foot=`<button class="btn" data-ck="skip">Ask me next week</button><span class="spacer"></span>
            <button class="btn" data-ck="gate-isgoal">It’s a goal</button>
            <button class="btn primary" data-ck="gate-isdecision">It’s a decision</button>`;
    } else if(k==='confirm-type'){
      body+=`<p class="wizsub">${esc(TYPE[g.type].hint)}</p>
        <label class="fld"><span>Type</span><select id="ckType">${Object.keys(TYPE).map(t=>
          `<option value="${t}" ${t===g.type?'selected':''}>${TYPE[t].label}</option>`).join('')}</select></label>`;
      foot=`<button class="btn" data-ck="skip">Ask me next week</button><span class="spacer"></span>
            <button class="btn primary" data-ck="gate-type">Confirm</button>`;
    } else if(k==='resolve-decision'){
      body+=`<p class="wizsub">Carry over only the why and your notes &mdash; not the whole decision history.</p>`;
      foot=`<button class="btn" data-ck="skip">Still deciding</button><span class="spacer"></span>
            <button class="btn" data-ck="dec-close">Close it out</button>
            <button class="btn primary" data-ck="dec-convert">Convert to a goal</button>`;
    }
  }

  else if(c.t==='branch'){
    const g=c.goal,t=c.thread; const last=lastDoneStep(t);
    title='Which way did it go?';
    body=subjHead(g,t)+`<p class="wizq">${esc(last?last.title:'The last step')} &mdash; how did it resolve?</p>
      <p class="wizsub">This thread branches. The next step depends on the answer.</p>
      <div class="choices">${t.branches.map((b,i)=>
        `<button class="btn" data-ck="branch" data-i="${i}">${esc(b.condition)} &rarr; ${esc(b.next)}</button>`).join('')}</div>`;
    foot=`<button class="btn" data-ck="skip">Not resolved yet</button><span class="spacer"></span>`;
  }

  else if(c.t==='nostep'){
    const g=c.goal,t=c.thread;
    const sug=autoNextTitle(g,t,null);
    title='Define the next step';
    body=subjHead(g,t)+`<p class="wizq">What is the next concrete move?</p>
      <p class="wizsub">A thread with no next step is exactly how things go quiet.</p>
      <label class="fld"><span>Next step</span><input type="text" id="ckStep" value="${esc(sug||'')}" placeholder="one specific action"></label>
      <label class="fld"><span>Quadrant</span><select id="ckQuad">${Object.keys(QUAD).map(q=>
        `<option value="${q}" ${q==='q2'?'selected':''}>${QUAD[q].n} &mdash; ${QUAD[q].ax}</option>`).join('')}</select></label>`;
    foot=`<button class="btn" data-ck="block">Actually it’s blocked</button>
          <button class="btn ghost" data-ck="skip">Skip for now</button><span class="spacer"></span>
          <button class="btn primary" data-ck="addstep">Add step</button>`;
  }

  else if(c.t==='blocked'){
    const g=c.goal,t=c.thread;
    const bd=t.blockedSince?daysBetween(dkey(new Date(t.blockedSince)),today()):daysQuiet(t);
    title='Still waiting';
    body=subjHead(g,t)+`<p class="wizq">Waiting on ${esc(t.blockedOn||'someone')} &mdash; ${bd} day${bd===1?'':'s'}</p>
      <p class="wizsub">Blocked threads stay visible. They don’t go dormant.</p>
      ${bd>=10?`<div class="sec" style="border-color:#5a4a24"><b>That is a long time.</b> Consider a nudge step you control &mdash; a follow-up message is itself a next step.</div>`:''}`;
    foot=`<button class="btn" data-ck="unblock-nudge">Add a nudge step</button>
          <span class="spacer"></span>
          <button class="btn" data-ck="unblock">Unblocked &mdash; define next</button>
          <button class="btn primary" data-ck="next">Still waiting</button>`;
  }

  else if(c.t==='quiet'){
    const g=c.goal,t=c.thread,s=c.step;
    title='No logged movement';
    body=subjHead(g,t)+`<p class="wizq">${esc(s.title)}</p>
      <p class="wizsub">Quiet for ${c.days} day${c.days===1?'':'s'}. Expected cadence: every ${cadenceOf(g)} days.</p>
      ${ CKROW==='cadence' ? `<div class="sec"><label class="fld"><span>Days between touches</span>
          <input type="number" id="ckCad" min="1" value="${cadenceOf(g)}"></label>
          <div class="tiny muted">How often this should move before silence means something.</div></div>` : '' }
      ${ CKROW==='blocked' ? `<div class="sec"><label class="fld"><span>Waiting on</span>
          <input type="text" id="ckWho" placeholder="who or what"></label></div>` : '' }
      ${ CKROW==='next' ? `<div class="sec"><label class="fld"><span>Done. What's the next step?</span>
          <input type="text" id="ckNextStep" placeholder="the next move"></label></div>` : '' }`;
    foot = CKROW==='cadence'
      ? `<button class="btn" data-ck="row-cancel">Back</button><span class="spacer"></span>
         <button class="btn primary" data-ck="cadence-save">Save cadence</button>`
      : CKROW==='blocked'
      ? `<button class="btn" data-ck="row-cancel">Back</button><span class="spacer"></span>
         <button class="btn primary" data-ck="block-save">Mark blocked</button>`
      : CKROW==='next'
      ? `<button class="btn" data-ck="row-cancel">Back</button><span class="spacer"></span>
         <button class="btn primary" data-ck="next-save">Save next step</button>`
      : `<button class="btn" data-ck="quiet-slip">Didn’t happen</button>
         <button class="btn" data-ck="block">Blocked</button>
         <span class="spacer"></span>
         <button class="btn" data-ck="quiet-cadence">Cadence is wrong</button>
         <button class="btn primary" data-ck="quiet-done">Done &mdash; next step</button>`;
  }

  else if(c.t==='schedule'){
    const list=unscheduledItems();
    title='Get them on the calendar';
    body=`<p class="wizq">${list.length?'Give each next step a slot':'Everything has a slot'}</p>
      <p class="wizsub">If it isn’t scheduled, it isn’t real yet.</p>
      ${ list.length? list.map(i=>`<div class="sec" data-sched="${i.step.id}">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
            <span class="dot" style="background:${QUAD[i.quadrant].c}"></span>
            <div><div style="font-size:13px">${esc(i.step.title)}</div>
              <div class="tiny muted">${esc(shortName(i.goal))}</div></div></div>
          <div class="row">
            <input type="date" class="sd" value="${suggestDay(i,45)}">
            <input type="time" class="stm" value="${suggestTime(i)}">
            <select class="sdur"><option value="30">30m</option><option value="45" selected>45m</option>
              <option value="60">1h</option><option value="90">1.5h</option><option value="120">2h</option>
              <option value="0">no time</option></select>
            <button class="btn primary" data-ck="sched-one" data-step="${i.step.id}" style="flex:none">Schedule</button>
          </div>
          <div class="tiny muted" style="margin-top:6px">${(()=>{const L=loadState(suggestDay(i,45));
            return L.over ? '<span class="overtxt">that day is already '+hrs(L.mins)+'</span> against a '+hrs(L.budget)+' day'
                          : hrs(L.free)+' free that day';})()}</div></div>`).join('')
        : '<div class="sec muted">Nothing loose.</div>' }`;
    foot=`${list.length?'<button class="btn" data-ck="sched-all">Schedule all as suggested</button>':''}
          <span class="spacer"></span><button class="btn primary" data-ck="next">Continue &rarr;</button>`;
  }

  /* The summary used to be a report card: how many you answered, what percentage you
     hit, what's still wrong. Grading someone at the end of a chore is a poor reason
     to come back next week. What earns the five minutes is walking out with the week
     already laid out — so that's what this shows now, and the score is a footnote. */
  else if(c.t==='done'){
    const ft=followThrough(null,7), sig=signals();
    const week=[];
    for(let i=0;i<7;i++){
      const k=addDays(today(),i);
      const its=itemsOn(k).filter(x=>!x.step.done)
        .sort((a,b)=>(a.start==null?1e9:a.start)-(b.start==null?1e9:b.start));
      if(its.length) week.push({k, its});
    }
    const booked=week.reduce((n,d)=>n+d.its.length,0);
    // the handful that carry the week — urgent-important first, soonest first
    const RANK={q1:0,q2:1,q3:2,q4:3};
    const three=week.flatMap(d=>d.its.map(i=>({...i,k:d.k})))
      .sort((a,b)=>RANK[a.quadrant]-RANK[b.quadrant] || a.k.localeCompare(b.k)).slice(0,3);
    const loose=unscheduledItems().length;

    title='The week ahead';
    body=`<p class="wizq">${booked?booked+' thing'+(booked===1?'':'s')+' on the calendar':'Nothing booked yet'}</p>
      <p class="wizsub">${CK.touched?CK.touched+' thread'+(CK.touched===1?'':'s')+' settled. ':''}${
        loose?loose+' next step'+(loose===1?'':'s')+' still without a slot.':'Everything live has a slot.'}</p>

      ${three.length?`<div class="sec"><h4>If you only do three things</h4>
        ${three.map(i=>`<div class="stepline">
          <span class="dot" style="background:${QUAD[i.quadrant].c}"></span>
          <span style="flex:1">${esc(i.step.title)}</span>
          <span class="st">${i.k===today()?'today':fmtDay(i.k)}${i.start!=null?' '+fmtTime(i.start):''}</span>
        </div>`).join('')}</div>`:''}

      <div class="sec"><h4>Next seven days</h4>
        ${ week.length ? week.map(d=>`<div class="wkday">
            <div class="wkd">${d.k===today()?'Today':fmtDay(d.k)+' '+fmtDate(d.k)}
              <span class="tiny muted">${hrs(loadState(d.k).mins)}</span></div>
            ${d.its.map(i=>`<div class="stepline">
              <span class="dot" style="background:${QUAD[i.quadrant].c}"></span>
              <span style="flex:1">${esc(i.step.title)}</span>
              <span class="st">${i.start!=null?fmtTime(i.start):'all day'}</span></div>`).join('')}
          </div>`).join('')
        : '<div class="muted tiny">Nothing scheduled in the next seven days. That is the thing to fix.</div>' }</div>

      ${ sig.length? `<div class="sec"><h4>Still surfacing &mdash; ${sig.length}</h4>
        <div class="tiny muted">In the ribbon, fixable there without another check-in.</div></div>`:'' }

      <div class="tiny muted" style="text-align:center;margin-top:4px">
        Last 7 days: ${ft.done} step${ft.done===1?'':'s'} done${ft.planned?' of '+ft.planned+' planned ('+ft.rate+'%)':''}</div>`;
    foot=`<span class="spacer"></span><button class="btn primary" data-ck="finish">Done</button>`;
  }

  openModal(`<h3>${title}<span class="pill">${CK.i+1}/${CK.q.length}</span>
      <button class="btn ghost x" data-close>&times;</button></h3>
    <div class="wizsteps">${prog}</div>
    <div class="mbody">${body}</div>
    <div class="mfoot">${CK.i>0&&CK.i<CK.q.length-1?'<button class="btn ghost" data-ck="back">&larr;</button>':''}${foot}</div>`,
    {wide:c.t==='schedule'});
}

function suggestDay(i,mins){
  const g=i.goal; const cad=cadenceOf(g)||3;
  let k=addDays(today(), Math.min(3,Math.max(1,Math.round(cad/2))));
  if(g.smart.deadline && g.smart.deadline<k) k=g.smart.deadline;
  const need=mins||45, budget=dayBudget();
  // first day in the window that still has room for this; failing that, the lightest
  let best=k, bl=CAL.loadOn(k);
  for(let d=0; d<5; d++){
    const c=addDays(k,d), load=CAL.loadOn(c);
    if(load+need<=budget) return c;
    if(load<bl){ best=c; bl=load; }
  }
  return best;
}
function suggestTime(i){
  const q=i.quadrant; const base = q==='q1'?9:q==='q2'?19:q==='q3'?12:17;
  return String(base).padStart(2,'0')+':00';
}

function ckAct(act,btn){
  checkpoint('that check-in answer');
  const c=CK.q[CK.i], g=c.goal, t=c.thread;
  const bump=()=>{CK.touched++;};
  switch(act){
    case 'next': ckNext(); return;
    case 'back': ckBack(); return;
    case 'skip': ckNext(); return;
    case 'finish':
      DB.meta.lastCheckin=today(); DB.meta.checkinProgress=null;
      logIt('checkin',{text:CK.touched+' answered'}); save();
      closeModal(); CK=null; render(); toast('Check-in logged.'); return;

    case 'gate-deadline':{
      const d=$('#ckDate').value; if(!d){toast('Pick a date.');return;}
      g.smart.deadline=d; g.smart.deadlineSoft=false;
      const mn=$('#ckMetric').value.trim(); if(mn)g.smart.metricName=mn;
      clearGate(g,c.gate.id); bump(); toast('Date set.'); break; }
    case 'gate-retype': clearGate(g,c.gate.id); g.type='milestone'; learnType(g.title,'milestone');
      g.gates.push({id:uid(),kind:'confirm-type',q:'Refiled "'+g.title+'" as milestone-type. Right call?'}); bump(); break;
    case 'gate-trigger':{
      const v=$('#ckTrig').value.trim(); if(!v){toast('Describe the trigger.');return;}
      g.trigger=v; g.threads.forEach(x=>x.status='dormant'); clearGate(g,c.gate.id); bump(); break; }
    case 'gate-fire':{
      g.threads.forEach(x=>{ if(x.status==='dormant'){x.status='active'; touchThread(x);} });
      const th=g.threads[0]; if(th&&!currentStep(th)) th.steps.push(newStep('First move on '+shortName(g),{auto:true}));
      clearGate(g,c.gate.id); bump(); toast('Activated.'); break; }
    case 'gate-isdecision': g.type='decision'; clearGate(g,c.gate.id); learnType(g.title,'decision');
      { const th=g.threads[0]; if(th&&!currentStep(th)) th.steps.push(newStep('Research / decide: '+shortName(g),{auto:true})); }
      bump(); break;
    case 'gate-isgoal': clearGate(g,c.gate.id); g.type='milestone';
      g.gates.push({id:uid(),kind:'confirm-type',q:'What kind of goal is "'+g.title+'"?'}); bump(); break;
    case 'gate-type':{ const v=$('#ckType').value; const changed=v!==g.type; g.type=v;
      learnType(g.title,v);                     // confirming counts too — that's reinforcement, not noise
      if(TYPE[v].gate==='deadline'&&!g.smart.deadline) g.gates.push({id:uid(),kind:'deadline',q:'What is the hard date for "'+g.title+'"?'});
      g.threads.forEach(x=>{ if(!x.steps.length){const s=firstStepFor(g,x,null); if(s)x.steps.push(s);} });
      clearGate(g,c.gate.id); bump();
      toast(changed?'Filed as '+TYPE[v].label.toLowerCase()+' — I\'ll read phrases like that the same way.'
                   :'Noted — that reading is reinforced.');
      break; }
    case 'dec-close': clearGate(g,c.gate.id); finishGoal(g,'decision closed'); bump(); break;
    case 'dec-convert': clearGate(g,c.gate.id); save(); closeModal(); openConvert(g); return;

    case 'branch':{
      const b=t.branches[+btn.dataset.i]; const last=lastDoneStep(t);
      t.needsBranch=false;
      const ns=newStep(b.next,{auto:true}); t.steps.push(ns); touchThread(t);
      logIt('branch',{goalId:g.id,threadId:t.id,text:b.condition}); bump(); break; }

    case 'addstep':{
      const v=$('#ckStep').value.trim(); if(!v){toast('Name the step.');return;}
      t.steps.push(newStep(v,{quadrant:$('#ckQuad').value})); touchThread(t); bump(); break; }

    // these three used to be browser prompts stacked on top of the wizard modal
    case 'block':         CKROW='blocked'; renderCheckin(); return;
    case 'quiet-cadence': CKROW='cadence'; renderCheckin(); return;
    case 'row-cancel':    CKROW=null; renderCheckin(); return;
    case 'block-save':{
      const who=($('#ckWho')||{value:''}).value.trim();
      t.status='blocked'; t.blockedOn=who||'someone'; t.blockedSince=new Date().toISOString();
      logIt('blocked',{goalId:g.id,threadId:t.id,text:t.blockedOn}); CKROW=null; bump(); break; }
    case 'cadence-save':{
      const v=+($('#ckCad')||{value:''}).value;
      if(!v||v<1){ toast('Give it a number of days.'); return; }
      g.cadenceDays=v; touchThread(t); CKROW=null; bump(); break; }
    case 'next-save':{
      const v=($('#ckNextStep')||{value:''}).value.trim();
      if(!v){ toast('Name the step.'); return; }
      t.steps.push(newStep(v,{quadrant:(c.step&&c.step.quadrant)||'q2'})); touchThread(t);
      CKROW=null; bump(); break; }
    case 'unblock':{
      t.status='active'; t.blockedOn=''; t.blockedSince=null; touchThread(t);
      if(!currentStep(t)){ CKROW='next'; save(); renderCheckin(); return; }
      bump(); break; }
    case 'unblock-nudge':{
      t.steps.push(newStep('Follow up with '+(t.blockedOn||'them'),{quadrant:'q3'}));
      t.status='active'; touchThread(t); bump(); toast('Nudge step added.'); break; }

    case 'quiet-done':{
      const s=currentStep(t);
      if(s){ const r=completeStep(g,t,s);
        // no auto-successor exists for this type — ask for it on the card, not in a dialog
        if(r.needsDefine && r.reason!=='branch'){ CKROW='next'; bump(); save(); renderCheckin(); return; } }
      bump(); break; }
    case 'quiet-slip':{
      const s=currentStep(t); if(s&&s.eventId) CAL.unanchor(s);
      logIt('slipped',{goalId:g.id,threadId:t.id,text:s?s.title:''}); bump(); break; }

    case 'sched-one': case 'sched-all':{
      const rows = act==='sched-all' ? $$('[data-sched]') : [btn.closest('[data-sched]')];
      for(const row of rows){
        const sid=row.dataset.sched; const f=findStep(sid); if(!f) continue;
        const d=$('.sd',row).value, tm=$('.stm',row).value, du=+$('.sdur',row).value;
        if(!d) continue;
        const mins = du===0?null:(+tm.split(':')[0]*60 + +tm.split(':')[1]);
        const ev=CAL.anchor(f.goal,f.thread,f.step,d, mins===null?0:mins, du||1440);
        if(du===0) ev.allDay=true;
        touchThread(f.thread);
      }
      save(); bump(); renderCheckin(); render();
      // saying yes to everything is how a week gets overbooked; say so at the moment it happens
      const hot=[...new Set(rows.map(r=>$('.sd',r)&&$('.sd',r).value).filter(Boolean))]
        .map(k=>({k,L:loadState(k)})).filter(x=>x.L.over);
      toast(hot.length
        ? hot.length+' day'+(hot.length>1?'s are':' is')+' now over a '+hrs(dayBudget())+' day — '+hot.map(x=>fmtDate(x.k)).join(', ')
        : 'Scheduled.');
      return; }
  }
  save(); render(); ckNext();
}
function findStep(sid){
  for(const g of DB.goals) for(const t of g.threads){ const s=t.steps.find(s=>s.id===sid); if(s) return {goal:g,thread:t,step:s}; }
  return null;
}

/* ===================== [SECTION: UI] ===================== */
const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
let RETURN_FOCUS=null;

function openModal(html,opts={}){
  const root=$('#modalRoot');
  // remember what opened this, so closing puts the keyboard back where it was
  if(!root.innerHTML) RETURN_FOCUS = (document.activeElement && document.activeElement!==document.body)
    ? document.activeElement : null;
  root.innerHTML=`<div class="scrim"><div class="modal ${opts.wide?'wide':''}" role="dialog" aria-modal="true" tabindex="-1">${html}</div></div>`;
  const m=$('.modal',root);
  const inp=root.querySelector('input,select,textarea');
  if(inp&&!opts.nofocus) setTimeout(()=>inp.focus(),30);
  // only claim focus if nothing inside has it — otherwise this steals the caret from
  // an inline field the moment after someone starts typing in it
  else if(m) setTimeout(()=>{ if(!m.contains(document.activeElement)) m.focus(); },30);
  return root.firstElementChild;
}

/* Tab used to walk straight out of an open dialog and into the page behind it,
   where every control still worked. Keep it inside until the dialog is closed. */
$('#modalRoot').addEventListener('keydown',e=>{
  if(e.key!=='Tab') return;
  const m=$('.modal'); if(!m) return;
  const items=[...m.querySelectorAll(FOCUSABLE)].filter(el=>el.offsetParent!==null||el===document.activeElement);
  if(!items.length){ e.preventDefault(); m.focus(); return; }
  const first=items[0], last=items[items.length-1];
  if(e.shiftKey && (document.activeElement===first||document.activeElement===m)){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});
function closeModal(){
  $('#modalRoot').innerHTML='';
  disarm(); GEROW=null; CONFIRM_CB=null;
  if(RETURN_FOCUS){ const el=RETURN_FOCUS; RETURN_FOCUS=null;
    if(document.body.contains(el)) try{ el.focus(); }catch(_){} }
  // another tab wrote while this modal was open — take it now that nothing is mid-edit
  if(EXTERNAL){ const d=EXTERNAL; EXTERNAL=null; adoptExternal(d); }
}

/* ===================== [SECTION: DIALOGS] =====================
   Native prompt() and confirm() block the whole page, can't be styled, can't carry
   context, land outside the app's own modal on mobile, and give the keyboard nowhere
   sensible to go. Everything below replaces them with the app's own furniture.

   Two shapes, chosen by what's already on screen:
   · nothing open  -> a real dialog (openConfirm), because there's room for one
   · a modal open  -> arm-to-confirm on the button itself, because stacking a second
                      modal over the first is exactly the jarring thing being fixed
   ------------------------------------------------------------------ */
let ARMED=null, ARMED_T=null;
function armConfirm(key){
  if(ARMED===key){ clearTimeout(ARMED_T); ARMED=null; return true; }   // second click: do it
  clearTimeout(ARMED_T);
  ARMED=key;
  ARMED_T=setTimeout(()=>{ ARMED=null; repaintArmed(); }, 4000);       // forget it if you walk away
  repaintArmed();
  return false;
}
function disarm(){ clearTimeout(ARMED_T); ARMED=null; }
function repaintArmed(){
  const m=$('.mbody[data-goal]');
  if(m){ refreshGoal(m.dataset.goal); return; }
  if($('[data-ui="pf-forget"]')) openPrefs();
}
const armLabel=(key,normal,armed)=> ARMED===key ? armed : normal;

let CONFIRM_CB=null;
function openConfirm({title, body, yes='Confirm', danger=false, onYes}){
  CONFIRM_CB=onYes;
  openModal(`<h3>${esc(title)}<button class="btn ghost x" data-close>&times;</button></h3>
    <div class="mbody"><p class="wizsub" style="margin:0">${body}</p></div>
    <div class="mfoot"><span class="spacer"></span>
      <button class="btn" data-close>Cancel</button>
      <button class="btn ${danger?'danger':'primary'}" data-ui="confirm-yes">${esc(yes)}</button></div>`,
    {nofocus:true});
  setTimeout(()=>{ const b=$('[data-ui="confirm-yes"]'); if(b) b.focus(); },30);
}

/* ---- inline "add another" inputs ----
   An always-present field at the end of each list. Enter creates and clears, so you
   can add several in a row without a dialog opening and closing between each. */
const NEW_LABEL={sub:'that subtask', backlog:'that backlog item', step:'that new step', entry:'that pipeline entry'};
function newInHTML(kind, ph, attrs=''){
  return `<input class="newin" data-new="${kind}" ${attrs} placeholder="${esc(ph)}" aria-label="${esc(ph)}">`;
}
function newInAct(el){
  const kind=el.dataset.new, v=el.value.trim();
  if(!v){ return; }
  const m=$('.mbody[data-goal]'); if(!m) return;
  const g=goalById(m.dataset.goal); if(!g) return;
  checkpoint(NEW_LABEL[kind]||'that addition');
  if(kind==='sub'){
    const f=findStep(el.dataset.s); if(f) addSub(g,f.thread,f.step,v);
  } else if(kind==='backlog'){
    g.backlog.push(v);
  } else if(kind==='step'){
    const t=threadById(g.id, el.dataset.t);
    if(t){ t.steps.push(newStep(v)); touchThread(t); }
  } else if(kind==='entry'){
    const th=newThread({name:v, rel:'parallel'});
    th.stage=(g.stages||PIPELINE_STAGES)[0];
    th.steps.push(newStep('Advance to '+(g.stages||PIPELINE_STAGES)[1]+': '+v,{auto:true,quadrant:'q2'}));
    g.threads.push(th);
  }
  save(); refreshGoal(g.id); render();
  // put the caret back so the next one can be typed straight away
  const sel=`.newin[data-new="${kind}"]`+(el.dataset.s?`[data-s="${el.dataset.s}"]`:'')+(el.dataset.t?`[data-t="${el.dataset.t}"]`:'');
  const again=$(sel); if(again) again.focus();
}

/* ---------------- capture ---------------- */
function doCapture(text){
  checkpoint('that capture');
  const cls=classify(text);
  const g=buildGoalFrom(text,cls);
  addGoal(g);
  // if the phrase carried a date, anchor the first step straight away
  const t=g.threads[0], s=t&&currentStep(t);
  if(s && cls.when){
    const mins = cls.clock ? cls.clock.min : null;
    const ev=CAL.anchor(g,t,s,cls.when.key, mins===null?0:mins, mins===null?1440:60);
    if(mins===null) ev.allDay=true;
  }
  save(); render();
  const bits=[TYPE[cls.type].label+'-type'];
  if(cls.gates.length) bits.push(cls.gates.length+' question'+(cls.gates.length>1?'s':'')+' queued for check-in');
  if(!s && cls.type!=='contingent') bits.push('needs a first step');
  toast(bits.join(' · '));
}
function captureHint(text){
  const h=$('#captureHint');
  if(!text.trim()){h.textContent='';return;}
  const c=classify(text);
  const spec=TYPE[c.type];
  h.innerHTML=`<span class="pill" title="${c.learned?'matches a correction you made before':'from the phrasing'}">${
    c.learned?'&#9679; ':''}${spec.label}${c.gates.length?' <span style="color:var(--warn)">?</span>':''}</span>`;
}

/* ---------------- view wiring ---------------- */
function wireView(){
  const v=$('#view');
  v.onclick=e=>{
    if(swallowClick){ swallowClick=false; return; }   // the click that ends a drag isn't a click
    const bud=e.target.closest('[data-bud]');
    if(bud){ budAct(bud.dataset.bud,bud); return; }
    const seg=e.target.closest('.bbar i[data-cat]');
    if(seg){ const inp=$(`.brow[data-cat="${seg.dataset.cat}"] .bamt`,v); if(inp){inp.focus();inp.select();} return; }
    if(e.target.closest('.budget')) return;           // the panel's own inputs are not goal cards
    const nav=e.target.closest('[data-nav]');
    if(nav){ const n=+nav.dataset.nav;
      DB.meta.cursor = n===0 ? today() : addDays(DB.meta.cursor,n); save(); render(); return; }
    const jump=e.target.closest('[data-jump]');
    if(jump){ DB.meta.cursor=jump.dataset.jump; DB.meta.zoom='week'; save(); render(); return; }
    if(e.target.closest('[data-act="newEvent"]')){ openEvent(null); return; }
    const chk=e.target.closest('[data-act="toggle"]');
    if(chk){ const c=chk.closest('[data-step]'); toggleStep(c.dataset.goal,c.dataset.thread,c.dataset.step); return; }
    const sx=e.target.closest('[data-act="subs"]');
    if(sx){ const id=sx.dataset.step; CARDSUBS.has(id)?CARDSUBS.delete(id):CARDSUBS.add(id); render(); return; }
    const ld=e.target.closest('[data-listdone]');
    if(ld){ checkpoint('that view switch'); DB.meta.listDone=!DB.meta.listDone; save(); render(); return; }
    const ro=e.target.closest('[data-reopen]');
    if(ro){ const g=goalById(ro.dataset.reopen); if(g){ checkpoint('reopening that goal');
      reopenGoal(g); save(); render(); toast('Back in rotation — '+shortName(g)); } return; }
    const lt=e.target.closest('[data-ltype]');
    if(lt){
      checkpoint('that type filter');
      const k=lt.dataset.ltype;
      const set=listHidden();
      if(k==='*') set.clear(); else set.has(k)?set.delete(k):set.add(k);
      DB.meta.listHidden=[...set]; save(); render(); return;
    }
    const sb=e.target.closest('[data-act="sub"]');
    if(sb){
      // the card carries the ids in Day view; the list row carries them on the box itself
      const c=sb.closest('.card[data-step]') || sb;
      const r=toggleSub(c.dataset.goal,c.dataset.thread,sb.dataset.step,sb.dataset.sub);
      render();
      if(r.completed){
        if(r.needsDefine && r.reason!=='branch') openDefineNext(goalById(c.dataset.goal), threadById(c.dataset.goal,c.dataset.thread));
        else toast('Last one — step closed.'+(r.next?' Next: '+r.next.title:''));
      }
      return; }
    const ev=e.target.closest('[data-ev]');
    if(ev){ const E=eventById(ev.dataset.ev);
      if(E&&E.goalId) openGoal(E.goalId); else openEvent(ev.dataset.ev); return; }
    const st=e.target.closest('[data-step]');
    if(st){ openGoal(st.dataset.goal); return; }
    const gg=e.target.closest('[data-goal]');
    if(gg){ openGoal(gg.dataset.goal); return; }
  };
  // budget panel: repaint live while typing, write to the DB on commit
  v.oninput  = e=>{ if(e.target.closest('.budget')) paintBudget(); };
  v.onchange = e=>{
    if(!e.target.closest('.budget')) return;
    checkpoint('that budget edit');
    commitBudget(); save();
    // linking a goal changes the row's projection and its Log button, so redraw it
    if(e.target.classList.contains('bgoal')) render(); else paintBudget();
  };
}

/* ---------- dragging cards between quadrants ----------
   HTML5 drag-and-drop never fires on touch, so on a phone the matrix was read-only
   despite having a mobile layout. Pointer events cover mouse, touch and pen in one
   path. The catch on touch is that the browser owns the gesture until it knows you
   aren't scrolling — so touch drags start from the grip, which sets touch-action:none
   and takes that ambiguity away. Mouse can drag from anywhere on the card.
   Wired once, at boot: #view survives every render, and the old listeners were being
   re-added on each one. */
function wireDrag(){
  const v=$('#view');
  let drag=null, ghost=null, lastQ=null, moved=false;

  /* two kinds of target: a quadrant (re-prioritise) and the calendar strip (schedule) */
  const targetAt=(x,y)=>{
    const el=document.elementFromPoint(x,y);
    if(!el||!el.closest) return null;
    return el.closest('.quad[data-quad]') || el.closest('.track[data-caldrop]')
        || el.closest('.daycol[data-daydrop]');
  };
  const isTrack = t => !!(t && t.dataset && t.dataset.caldrop);
  const isDay   = t => !!(t && t.dataset && t.dataset.daydrop);
  const clear=()=>{
    if(lastQ){ lastQ.classList.remove('drop'); lastQ.classList.remove('armed'); }
    lastQ=null;
  };
  function end(){
    if(ghost){ ghost.remove(); ghost=null; }
    if(drag&&drag.card) drag.card.classList.remove('dragging');
    clear(); drag=null;
    document.body.classList.remove('dragging-on');
  }

  v.addEventListener('pointerdown', e=>{
    if(e.button!==undefined && e.button!==0) return;
    // a matrix card or a list row — both carry a step id, which is all the drop needs
    // anything that knows which step it belongs to can be dragged: a matrix card, a
    // list row, a week chip, or a single subtask line
    const card=e.target.closest('.card[data-step], .lrow[data-step], .tchip[data-step], .subline[data-sub]');
    if(!card) return;
    // checkboxes, the subtask list and the expand pill are controls, not drag handles
    // controls are not handles. A subtask line is draggable itself, so only its
    // checkbox is excluded there — the containing lists are not.
    if(e.target.closest('[data-act="toggle"],[data-act="sub"],[data-act="subs"],input,select,button')) return;
    if(!card.dataset.sub && e.target.closest('.cardsubs,.lsubs')) return;
    const viaGrip=!!e.target.closest('.grip');
    if(e.pointerType!=='mouse' && !viaGrip) return;                  // touch drags start at the grip
    drag={card, step:card.dataset.step, sub:card.dataset.sub||null, x:e.clientX, y:e.clientY, id:e.pointerId};
    moved=false;
    try{ card.setPointerCapture(e.pointerId); }catch(_){}
  });

  v.addEventListener('pointermove', e=>{
    if(!drag || e.pointerId!==drag.id) return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(!ghost){
      if(Math.hypot(dx,dy)<6) return;                                // a tap is not a drag
      const r=drag.card.getBoundingClientRect();
      ghost=drag.card.cloneNode(true);
      ghost.id='dragGhost'; ghost.style.width=r.width+'px';
      document.body.appendChild(ghost);
      drag.card.classList.add('dragging');
      document.body.classList.add('dragging-on');
    }
    moved=true;
    e.preventDefault();
    ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
    const q=targetAt(e.clientX,e.clientY);
    if(q!==lastQ){ clear(); lastQ=q; if(q) q.classList.add(isTrack(q)?'armed':'drop'); }
    // on the strip, show where in the day this would land as you move
    if(isTrack(q)){
      const r=q.getBoundingClientRect();
      const mins=calMinAt(r.width?(e.clientX-r.left)/r.width:0);
      const line=$('.dropline',q);
      if(line){ line.style.left=calPos(mins)+'%'; line.dataset.t=fmtTime(mins); }
    }
  });

  const drop = e=>{
    if(!drag || e.pointerId!==drag.id) return;
    const q = ghost ? targetAt(e.clientX,e.clientY) : null;
    const sid=drag.step, subId=drag.sub;
    const wasDrag=!!ghost;
    const x=e.clientX;
    const rect = isTrack(q) ? q.getBoundingClientRect() : null;
    const dayKey = isDay(q) ? q.dataset.day : null;
    end();
    if(!q) return;
    const f=findStep(sid);
    if(!f) return;

    /* A subtask can't hold a slot, so dragging one schedules the step it belongs to
       and floats it to the head of the checklist. Say so plainly — the thing that
       moved is not the thing that was dragged. */
    const sub = subId ? subs(f.step).find(x=>x.id===subId) : null;
    const say = (what) => toast(sub
      ? what+' — "'+sub.title+'" is up first'
      : what);

    if(rect || dayKey){
      const k = dayKey || DB.meta.cursor;
      const mins = rect ? calMinAt(rect.width?(x-rect.left)/rect.width:0)
                        : (+suggestTime({goal:f.goal,quadrant:f.step.quadrant}).split(':')[0])*60;
      checkpoint(sub?'that subtask drop':'that scheduling');
      if(sub) floatSub(f.step,subId);
      CAL.anchor(f.goal,f.thread,f.step,k,mins,45);
      touchThread(f.thread); save(); render();
      const L=loadState(k);
      say('Scheduled '+(k===today()?'':fmtDate(k)+' ')+'for '+fmtTime(mins)
          +(L.over?' · that day is now '+hrs(L.mins):''));
    } else if(q.dataset.quad && f.step.quadrant!==q.dataset.quad){
      checkpoint(sub?'that subtask drop':'that move to '+QUAD[q.dataset.quad].n);
      if(sub) floatSub(f.step,subId);
      f.step.quadrant=q.dataset.quad; save(); render();
      say('Moved to '+QUAD[q.dataset.quad].n);
    }
    // don't open the goal we just dropped. Self-clears: if no click follows the drop,
    // a stale flag would silently eat the next unrelated click instead.
    if(wasDrag && moved){ swallowClick=true; setTimeout(()=>{ swallowClick=false; },350); }
  };
  v.addEventListener('pointerup', drop);
  v.addEventListener('pointercancel', ()=>end());
  window.addEventListener('blur', ()=>end());
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'&&drag) end(); });
}
let swallowClick=false;
$('#signals').onclick=e=>{
  const zz=e.target.closest('[data-snooze]');
  if(zz){ e.stopPropagation(); snoozeSignals(zz.dataset.snooze.split('|')); return; }
  const fx=e.target.closest('[data-fix]');
  if(fx){ sigFixAct(fx.dataset.fix,fx); return; }
  if(e.target.closest('.sigfix')) return;                  // clicks inside the form are the form's
  const more=e.target.closest('[data-sigmore]');
  if(more){ SIGALL=!SIGALL; renderSignals(); return; }
  const grp=e.target.closest('[data-grp]');
  if(grp){ SIGOPEN = SIGOPEN===grp.dataset.grp ? null : grp.dataset.grp; SIGFIX=null; renderSignals(); return; }
  // a resolvable signal opens its resolver rather than the whole goal editor
  const sg=e.target.closest('[data-sig]');
  if(sg){
    const key=sg.dataset.sig, s=signals().find(x=>x.key===key);
    if(s && FIXABLE.has(s.kind)){ SIGFIX = SIGFIX===key ? null : key; renderSignals(); return; }
  }
  const s=e.target.closest('[data-goal]'); if(s) openGoal(s.dataset.goal);
};
$('#signals').onkeydown=e=>{
  if(e.key==='Enter' && e.target.closest('.sigfix')){
    const btn=$('.sigfix .btn.primary'); if(btn) sigFixAct(btn.dataset.fix,btn);
  }
  if(e.key==='Escape' && SIGFIX){ SIGFIX=null; renderSignals(); }
};
/* live feedback on the scheduling resolver: say what that day already holds */
$('#signals').oninput=e=>{
  if(e.target.id!=='fxWhen') return;
  const el=$('#fxLoad'); if(!el) return;
  const L=loadState(e.target.value||today());
  el.innerHTML = L.over ? `<span class="overtxt">that day is already ${hrs(L.mins)}</span> against a ${hrs(L.budget)} day`
                        : `${hrs(L.free)} free that day`;
};

function toggleStep(gid,tid,sid){
  const f=findStep(sid); if(!f) return;
  const {goal,thread,step}=f;
  checkpoint(step.done?'reopening that step':'completing that step');
  if(step.done){ step.done=false; step.doneAt=null; save(); render(); return; }
  const r=completeStep(goal,thread,step);
  render();
  if(r.needsDefine && r.reason==='branch'){ toast('Branching thread — resolve it in the check-in.'); openGoal(goal.id); }
  else if(r.needsDefine){ openDefineNext(goal,thread); }
  else if(r.next){ toast('Next: '+r.next.title + (r.carried?' — '+r.carried+' unfinished subtask'+(r.carried>1?'s':'')+' carried over':'')); }
}
/* the governing rule: a thread cannot close a step without producing the next one */

      <label class="fld"><span>Quadrant</span><select id="dnQuad">${Object.keys(QUAD).map(q=>

      <label class="fld"><span>Slot it (optional)</span><div class="row">

  openModal(`<h3>${id?'Event':'New event'}<button class="btn ghost x" data-close>&times;</button></h3>
    <div class="mbody">

          <label class="fld"><span>Every</span><select id="evR">
            ${[0,1,2,3,7,14,28].map(n=>`<option value="${n}" ${rec&&rec.every===n?'selected':(!rec&&n===0?'selected':'')}>${

      ${ t.rel==='conditional' ? `<div class="tiny muted" style="margin-bottom:6px">Branches

      <div class="steplist">

        ${ cur ? `<div class="stepline cur">

function saveGoalFields(g){
  const q=s=>$(s);
  if(q('#geTitle')) g.title=q('#geTitle').value.trim()||g.title;
  if(q('#geType')){ const nt=q('#geType').value;
    if(nt!==g.type){ g.type=nt; learnType(g.title,nt);   // a manual retype is a correction like any other
      if(TYPE[nt].gate==='deadline' && !q('#geDL').value)
        g.gates.push({id:uid(),kind:'deadline',q:'What is the hard date for "'+g.title+'"?'}); } }
  if(q('#geCad')) g.cadenceDays = q('#geCad').value===''?null:+q('#geCad').value;
  if(q('#geDL'))  g.smart.deadline=q('#geDL').value||null;
  if(q('#geOut')) g.smart.outcome=q('#geOut').value;
  if(q('#geMet')) g.smart.metricName=q('#geMet').value;
  if(q('#geCur')) g.smart.current=+q('#geCur').value||0;
  if(q('#geTgt')) g.smart.target=q('#geTgt').value===''?null:+q('#geTgt').value;
  if(q('#geWhy')) g.why=q('#geWhy').value;
  if(q('#geNotes')) g.notes=q('#geNotes').value;
  if(q('#geTrig')) g.trigger=q('#geTrig').value;
  // titles are live inputs now rather than read-only text — read them all back
  $$('.steptitle').forEach(el=>{
    const f=findStep(el.dataset.s); if(f && el.value.trim()) f.step.title=el.value.trim();
  });
  $$('.subtitle').forEach(el=>{
    const f=findStep(el.dataset.s); if(!f) return;
    const sub=subs(f.step).find(x=>x.id===el.dataset.sub);
    if(sub && el.value.trim()) sub.title=el.value.trim();
  });
  $$('.backtitle').forEach(el=>{
    const i=+el.dataset.i;
    if(el.value.trim() && g.backlog[i]!==undefined) g.backlog[i]=el.value.trim();
  });
  $$('.thread').forEach(el=>{
    const t=g.threads.find(x=>x.id===el.dataset.thread); if(!t)return;
    const n=$('.tname',el), r=$('.trel',el), b=$('.tblock',el);
    if(n) t.name=n.value.trim()||t.name;
    if(r) t.rel=r.value;
    if(b) t.blockedOn=b.value;
  });
  save();
}

/* Renames commit on blur and deliberately do NOT refreshGoal() — rewriting the modal
   would take the caret with it. render() updates the views behind; the modal keeps
   its own DOM, which is already correct because the user just typed it. */
$('#modalRoot').addEventListener('change',e=>{
  if(!e.target.classList||!e.target.classList.contains('edit')) return;
  const m=$('.mbody[data-goal]'); if(!m) return;
  const g=goalById(m.dataset.goal); if(!g) return;
  checkpoint('that rename');
  saveGoalFields(g);
  render();
});
$('#modalRoot').addEventListener('keydown',e=>{
  const cl=e.target.classList;
  if(e.key==='Enter' && cl && cl.contains('newin')){ e.preventDefault(); newInAct(e.target); return; }
  if(e.key==='Escape' && cl && cl.contains('newin') && e.target.value){ e.preventDefault(); e.target.value=''; return; }
  // Enter anywhere in an inline row commits that row rather than doing nothing
  if(e.key==='Enter' && e.target.closest && e.target.closest('.addrow')){
    const b=$('.btn.primary',e.target.closest('.addrow')) || $('[data-ge$="-add"]',e.target.closest('.addrow'));
    if(b){ e.preventDefault(); geAct(b.dataset.ge,b); return; }
  }
  if(e.key==='Enter' && cl && cl.contains('edit')){ e.preventDefault(); e.target.blur(); }
  // space or enter on a subtask checkbox, for keyboard users
  if((e.key===' '||e.key==='Enter') && e.target.classList && e.target.classList.contains('subchk')){
    e.preventDefault(); geAct('sub-toggle',e.target);
  }
});

/* what each action is called when it shows up in the undo tooltip */
const ACT_LABEL={
  'dn-save':'that new step', 'ev-save':'that event', 'ev-del':'deleting that event',
  'pf-save':'those settings', 'cv-save':'that conversion',
  save:'those goal edits', del:'deleting that goal', 'thread-add':'that new thread',
  'thread-del':'removing that thread', addstep:'that new step', complete:'completing that step',
  sched:'that scheduling', block:'blocking that thread', unblock:'unblocking that thread',
  fire:'activating that goal', 'branch-add':'that branch', 'branch-del':'removing that branch',
  'backlog-add':'that backlog item', 'backlog-del':'removing that backlog item',
  'backlog-up':'that reorder', 'backlog-down':'that reorder',
  'sub-add':'that subtask', 'sub-del':'removing that subtask',
  'sub-up':'that reorder', 'sub-down':'that reorder', 'rename':'that rename',
  'entry-add':'that pipeline entry', 'ev-skip':'skipping that occurrence',
  'pf-forget':'forgetting the learned types', finish:'completing that goal'
};

function uiAct(a,btn){
  // the dialog's own callback owns the checkpoint, so don't take a vague one here
  if(a==='confirm-yes'){ const cb=CONFIRM_CB; CONFIRM_CB=null; closeModal(); if(cb) cb(); return; }
  checkpoint(ACT_LABEL[a]);
  if(a==='dn-save'){
    const g=goalById(btn.dataset.g), t=threadById(btn.dataset.g,btn.dataset.t);
    const v=$('#dnStep').value.trim(); if(!v){toast('Name the step.');return;}
    const s=newStep(v,{quadrant:$('#dnQuad').value}); t.steps.push(s); touchThread(t);
    const d=$('#dnDate').value;
    if(d){ const tm=$('#dnTime').value.split(':'); CAL.anchor(g,t,s,d,+tm[0]*60+ +tm[1],60); }
    save(); closeModal(); render(); toast('Thread stays live.');
  }
  if(a==='dn-block'){ closeModal(); toast('Mark it blocked from the goal card.'); }
  if(a==='ev-save'){
    const id=btn.dataset.id;
    const e = id?masterEvent(id):newEvent();     // edits always land on the stored master
    if(!e){ closeModal(); return; }
    const wasKey=e.dateKey;
    e.title=$('#evT').value.trim()||'Untitled';
    e.dateKey=$('#evD').value||today();
    e.allDay=$('#evA').checked;
    if(!e.allDay){ const t=$('#evS').value.split(':'); e.start=+t[0]*60+ +t[1]; e.dur=+$('#evL').value||60; }
    else { e.start=0; e.dur=1440; }
    if($('#evR')){
      const every=+$('#evR').value||0, until=$('#evU').value||null;
      e.recur = every ? {every, until} : null;
      if(!e.recur) e.skips=[];
      if(e.dateKey!==wasKey) e.skips=[];          // series moved; old exceptions no longer mean anything
    }
    if(!id) addEvent(e);
    save(); closeModal(); render();
    const L=loadState(e.dateKey);
    if(L.over) toast(fmtDate(e.dateKey)+' is now '+hrs(L.mins)+' against a '+hrs(L.budget)+' day.');
  }
  if(a==='ev-del'){ removeEvent(btn.dataset.id); closeModal(); render(); }
  if(a==='ev-skip'){ skipOccurrence(btn.dataset.id); closeModal(); render(); toast('Occurrence skipped.'); }
  if(a==='pf-save'){
    const m=DB.meta;
    m.checkinMode=$('#pfMode').value; m.checkinDow=+$('#pfDow').value; m.checkinEveryDays=+$('#pfN').value||7;
    m.projects=$('#pfProj').value.split(',').map(s=>s.trim()).filter(Boolean);
    if($('#pfBudget')) m.dayBudgetMins=+$('#pfBudget').value||240;
    save(); closeModal(); render(); toast('Settings saved.');
  }
  if(a==='pf-forget'){
    if(!armConfirm('pf-forget')) return;      // Settings is open, so arm the button rather than stack a dialog
    DB.meta.learned=[]; save(); openPrefs(); toast('Forgotten — back to the rules alone.');
  }
  if(a==='cv-save'){
    const src=goalById(btn.dataset.id);
    const title=$('#cvT').value.trim(); if(!title){toast('Phrase the goal.');return;}
    const forced=$('#cvType').value||undefined;
    if(forced) learnType(title,forced);
    const cls=classify(title,{force:forced});
    const g=buildGoalFrom(title,cls);
    g.why=$('#cvWhy').value; g.notes=$('#cvNotes').value;
    g.origin={fromGoalId:src.id,kind:'decision'};
    addGoal(g);
    finishGoal(src,'converted into a goal'); src.gates=[];
    logIt('converted',{goalId:g.id,text:'from decision: '+src.title});
    save(); closeModal(); render(); openGoal(g.id);
  }
}

function geAct(a,btn){
  checkpoint(ACT_LABEL[a]);
  const gid=$('.mbody[data-goal]').dataset.goal, g=goalById(gid);
  const t=btn.dataset.t?threadById(gid,btn.dataset.t):null;
  switch(a){
    case 'save': saveGoalFields(g); disarm(); closeModal(); render(); toast('Saved.'); return;
    case 'del':
      if(!armConfirm('del:'+gid)) return;          // first click arms the button, second deletes
      deleteGoal(gid); closeModal(); render(); toast('Deleted — ⌘Z to undo.'); return;
    case 'finish':
      saveGoalFields(g); finishGoal(g); save(); disarm(); closeModal(); render();
      toast('Done — it moves to Completed, not into thin air.'); return;
    case 'convert': saveGoalFields(g); closeModal(); openConvert(g); return;
    case 'thread-add': saveGoalFields(g);
      g.threads.push(newThread({name:'Thread '+(g.threads.length+1), rel:'parallel'})); break;
    case 'thread-del':
      if(g.threads.length<2){ toast('A goal needs at least one thread.'); return; }
      if(!armConfirm('thread-del:'+t.id)) return;
      g.threads=g.threads.filter(x=>x.id!==t.id); break;
    case 'complete':{ const s=t.steps.find(x=>x.id===btn.dataset.s);
      const r=completeStep(g,t,s); refreshGoal(gid); render();
      if(r.needsDefine&&r.reason!=='branch') openDefineNext(g,t);
      return; }
    // scheduling opens an inline row rather than two chained browser prompts
    case 'sched': saveGoalFields(g); GEROW={kind:'sched', id:btn.dataset.s}; refreshGoal(gid); return;
    case 'sched-cancel': GEROW=null; refreshGoal(gid); return;
    case 'sched-save':{
      const s=t.steps.find(x=>x.id===btn.dataset.s); if(!s){GEROW=null;break;}
      const d=$('.schd').value; if(!d){ toast('Pick a date.'); return; }
      if($('.schall').checked){ const ev=CAL.anchor(g,t,s,d,0,1440); ev.allDay=true; }
      else { const p=($('.schtm').value||'19:00').split(':'); CAL.anchor(g,t,s,d,+p[0]*60 + +(p[1]||0),45); }
      touchThread(t); GEROW=null;
      { const L=loadState(d); if(L.over) toast(fmtDate(d)+' is now '+hrs(L.mins)+' against a '+hrs(L.budget)+' day.'); }
      break; }

    case 'block': saveGoalFields(g); GEROW={kind:'block', id:t.id}; refreshGoal(gid); return;
    case 'block-cancel': GEROW=null; refreshGoal(gid); return;
    case 'block-save':{
      const who=($('.blockwho')||{value:''}).value.trim();
      t.status='blocked'; t.blockedOn=who||'someone'; t.blockedSince=new Date().toISOString();
      logIt('blocked',{goalId:g.id,threadId:t.id,text:t.blockedOn}); GEROW=null; break; }
    case 'unblock': t.status='active'; t.blockedOn=''; t.blockedSince=null; touchThread(t); break;
    case 'fire': g.threads.forEach(x=>{if(x.status==='dormant'){x.status='active';touchThread(x);}});
      { const th=g.threads[0]; if(th&&!currentStep(th)) th.steps.push(newStep('First move on '+shortName(g),{auto:true})); }
      g.gates=(g.gates||[]).filter(x=>x.kind!=='trigger'); break;
    case 'branch-add':{
      const c=($(`.brif[data-t="${t.id}"]`)||{value:''}).value.trim();
      const nx=($(`.brthen[data-t="${t.id}"]`)||{value:''}).value.trim();
      if(!c||!nx){ toast('Both halves of the branch, please.'); return; }
      t.branches.push({condition:c,next:nx}); t.rel='conditional'; break; }
    case 'branch-del': t.branches.splice(+btn.dataset.i,1); break;
    case 'backlog-del': g.backlog.splice(+btn.dataset.i,1); break;
    case 'backlog-up':   if(!moveItem(g.backlog,+btn.dataset.i,-1)) return; break;
    case 'backlog-down': if(!moveItem(g.backlog,+btn.dataset.i, 1)) return; break;

    /* --- subtasks --- */
    case 'sub-del':{
      const f=findStep(btn.dataset.s); if(!f) return;
      f.step.subs=subs(f.step).filter(x=>x.id!==btn.dataset.sub); break; }
    case 'sub-up': case 'sub-down':{
      const f=findStep(btn.dataset.s); if(!f) return;
      if(!moveItem(f.step.subs, +btn.dataset.i, a==='sub-up'?-1:1)) return; break; }
    case 'sub-toggle':{
      // routed through toggleSub so the last tick closes the step the normal way
      const r=toggleSub(g.id, btn.dataset.t, btn.dataset.s, btn.dataset.sub);
      refreshGoal(gid); render();
      if(r.completed){
        if(r.needsDefine && r.reason!=='branch') openDefineNext(g, threadById(gid,btn.dataset.t));
        else toast('Last one — step closed.'+(r.next?' Next: '+r.next.title:''));
      }
      return; }
  }
  disarm(); save(); refreshGoal(gid); render();
}

  mk('Standup',-1,9,30,{every:1,until:addDays(today(),45)});
  mk('Team retro',4,16,45,{every:14,until:null});
  mk('1:1 with Marcus',0,13,30); mk('Deep work block',0,15,90);
  mk('Dentist',1,11,60);
  mk('Sprint review',2,14,60);

  const anchor=(g,ti,dayOff,h,dur)=>{ const t=g.threads[ti]; const s=currentStep(t);
    if(s) CAL.anchor(g,t,s,addDays(today(),dayOff),h*60,dur); };
  anchor(cka,0,0,19,90);          // domain 4 drills tonight
  anchor(cka,1,38,10,180);        // the exam itself
  anchor(pl,0,2,20,60);           // terraform staging
  anchor(job,1,1,10,30);          // Northwind
  // guitar, cooking, docs, savings, decision deliberately left unscheduled + quiet

  /* --- log history so follow-through and streaks are real --- */
  const L=(kind,g,t,d,text)=>DB.log.push({id:uid(),ts:ago(d),kind,goalId:g.id,threadId:t.id,text,dateKey:addDays(today(),-d)});
  L('planned',cka,ckaT,7,'Domain 2 drills'); L('done',cka,ckaT,6,'Domain 2 drills');
  L('planned',cka,ckaT,2,'Domain 3 drills'); L('done',cka,ckaT,1,'Domain 3 drills');
  L('planned',gtr,gt,10,'session'); L('done',gtr,gt,9,'session');
  L('planned',gtr,gt,7,'session');  L('done',gtr,gt,6,'session');
  L('planned',gtr,gt,4,'session');  // planned, never done — the pattern the app is meant to expose
  L('planned',pl,pInfra,4,'chart split'); L('done',pl,pInfra,3,'chart split');
  L('planned',cook,ck,21,'cook'); L('done',cook,ck,20,'cook');
  L('planned',job,jb,6,'batch'); L('done',job,jb,5,'batch');

  /* --- weekly budget: one category wired to the car savings goal --- */
  DB.meta.budget={ weekly:1200, cats:[
    {id:uid(), name:'Rent + bills',   amount:620, goalId:null},
    {id:uid(), name:'Groceries',      amount:180, goalId:null},
    {id:uid(), name:'Car fund',       amount:150, goalId:car.id},
    {id:uid(), name:'Going out',      amount:110, goalId:null}
  ]};
  save();
}

/* ===================== [SECTION: BOOT] ===================== */
load();
if(!DB.goals.length) seed();

$('#zoombar').onclick=e=>{ const b=e.target.closest('[data-z]'); if(!b)return;
  DB.meta.zoom=b.dataset.z; save(); render(); };

const cap=$('#capture');
cap.addEventListener('input',()=>captureHint(cap.value));
cap.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&cap.value.trim()){ doCapture(cap.value.trim()); cap.value=''; captureHint(''); }
  if(e.key==='Escape'){ cap.value=''; captureHint(''); cap.blur(); }
});

$('#btnCheckin').onclick=()=>startCheckin();
$('#btnUndo').onclick=()=>undo();
$('#btnRedo').onclick=()=>redo();

$('#btnMenu').onclick=e=>{
  e.stopPropagation();
  const old=$('.menu'); if(old){old.remove();return;}
  const m=el(`<div class="menu">
    <button data-m="prefs">Settings</button>
    <button data-m="checkin">Run check-in now</button>
    <hr>
    <button data-m="export">Export JSON</button>
    <button data-m="import">Import JSON</button>
    <hr>
    <button data-m="reseed">Reload demo data</button>
    <button data-m="wipe" style="color:var(--bad)">Erase everything</button></div>`);
  document.body.appendChild(m);
  m.onclick=ev=>{
    const a=ev.target.dataset.m; m.remove();
    if(a==='prefs') openPrefs();
    if(a==='checkin') startCheckin();
    if(a==='export') exportJSON();
    if(a==='import') importJSON();
    if(a==='reseed') openConfirm({title:'Reload demo data', yes:'Replace everything', danger:true,
      body:'This replaces your goals, events and history with the demo set. <b>⌘Z undoes it.</b>',
      onYes:()=>{ checkpoint('loading the demo data'); seed(); render(); toast('Demo data loaded — ⌘Z to undo.'); }});
    if(a==='wipe') openConfirm({title:'Erase everything', yes:'Erase it all', danger:true,
      body:'Every goal, event and log entry goes. <b>⌘Z undoes it</b>, but only while this tab stays open — export first if you want it back later.',
      onYes:()=>{ checkpoint('erasing everything'); DB=blankDB(); DB.meta.cursor=today(); save(); render(); toast('Erased — ⌘Z to undo.'); }});
  };
};
document.addEventListener('click',()=>{ const m=$('.menu'); if(m)m.remove(); });

document.addEventListener('keydown',e=>{
  // inside a text field, leave Cmd/Ctrl+Z to the browser's own text undo
  if(e.target && e.target.matches && e.target.matches('input,textarea,select')) return;
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(e.key==='1'){DB.meta.zoom='day';save();render();}
  if(e.key==='2'){DB.meta.zoom='week';save();render();}
  if(e.key==='3'){DB.meta.zoom='quarter';save();render();}
  if(e.key==='4'){DB.meta.zoom='list';save();render();}
  if(e.key==='t'){DB.meta.cursor=today();save();render();}
  if(e.key==='/'){e.preventDefault();cap.focus();}
  if(e.key==='c'&&!$('.scrim')) startCheckin();
  if(e.key==='Escape'&&$('.scrim')){ closeModal(); CK=null; render(); }
});

render();
wireDrag();          // once — #view outlives every render
/* nudge: if the check-in is due, say so once on load rather than waiting to be noticed */
if(checkinDue()) setTimeout(()=>toast('Weekly check-in is due — press c'),700);
</script>
</body>
</html>
