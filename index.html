function gReadPrefs(){
  const m=gmeta(), a=$('#pfGId'), b=$('#pfGCal');
  if(a) m.clientId=String(a.value||'').trim();
  if(b){
    const cal=String(b.value||'').trim()||'primary';
    if(cal!==m.calendarId){ m.calendarId=cal; gCursorSet({token:null}); }
  }
}

/* --- scheduling ---------------------------------------------------------- */
let GTIMER=null, GWIRED=false;
function gTick(){ if(!document.hidden) gSync({reason:'poll'}).catch(gNote); }
function gWake(){ if(!document.hidden) gSync({reason:'focus'}).catch(gNote); }
function gOnline(){ gFlush().then(()=>gSync({reason:'online'})).catch(gNote); }
function gNote(err){ GERR=(err&&err.message)||String(err); try{ renderSignals(); }catch(_){} }

function gStart(){
  if(!gOn()) return;
  if(!GWIRED){
    window.addEventListener('focus', gWake);
    document.addEventListener('visibilitychange', gWake);
    window.addEventListener('online', gOnline);
    GWIRED=true;
  }
  if(!GTIMER) GTIMER=setInterval(gTick, G_POLL);
}
function gStop(){ if(GTIMER){ clearInterval(GTIMER); GTIMER=null; } }

/* --- the ribbon's own chips ---------------------------------------------
   These aren't goal-scoped, so they don't belong in signals() and must not be
   snoozeable: a queued write is a fact about the app, not a nag about a thread. */
function gChips(){
  if(!gOn()) return [];
  const out=[];
  const n=gPending();
  if(n) out.push({cls:'', act:'gsync', text:n+' change'+(n>1?'s':'')+' waiting to sync'});
  if(GSTATE==='stale') out.push({cls:'hard', act:'gconnect', text:'Google access expired &mdash; reconnect'});
  else if(GERR && !n) out.push({cls:'mute', act:'gsync', text:'Calendar sync: '+esc(GERR)});
  return out;
}


/* ===================== [SECTION: BUDGET] =====================
   A weekly pot of money split across categories. Allocation, not a ledger — there's
   no per-week history and no record of what was actually spent. The one place it
   touches the rest of the app is the optional link from a category to a
   threshold-type goal, which is what stops this being a calculator bolted onto the
   side: money you've allocated is a claim on a goal, and the goal can say whether
   the claim is big enough to land on time. */
const BUDGET_COLOURS=['#6ea8fe','#4ec9a0','#e8b04b','#ef5f5f','#b48ef0','#4dc4d6','#e88ab0','#8fb46a'];
const budget = ()=> (DB.meta.budget = DB.meta.budget || {weekly:0, cats:[]});
const catColour = i => BUDGET_COLOURS[i % BUDGET_COLOURS.length];

function budgetState(){
  const b=budget();
  const cats=b.cats||[];
  const allocated=cats.reduce((n,c)=>n+(+c.amount||0),0);
  const weekly=+b.weekly||0;
  // with no budget set, blocks show the relative split; with one, they show share of it
  const basis = weekly>0 ? Math.max(weekly, allocated) : allocated;
  return {
    weekly, allocated, basis,
    left: weekly-allocated,
    over: weekly>0 && allocated>weekly,
    unset: weekly<=0,
    pct: c => basis>0 ? (+c.amount||0)/basis*100 : 0,
    share: c => weekly>0 ? (+c.amount||0)/weekly*100 : (allocated>0?(+c.amount||0)/allocated*100:0)
  };
}
/* threshold goals are the only ones with a money target, so they're the only ones
   worth linking; everything else would just be a label */
const fundableGoals = ()=> liveGoals().filter(g=>g.type==='threshold');

function catProjection(c){
  const g = c.goalId && goalById(c.goalId);
  // only threshold goals measure in money — a link left behind by a retype, or pointing
  // at a deleted goal, degrades to no projection rather than reading someone else's units
  if(!g || g.type!=='threshold' || !g.smart || !g.smart.target) return null;
  const remaining = Math.max(0, g.smart.target - (+g.smart.current||0));
  const out={goal:g, remaining};
  if(remaining<=0){ out.done=true; return out; }
  const amt=+c.amount||0;
  if(amt>0){
    out.weeks = Math.ceil(remaining/amt);
    out.date  = addDays(today(), out.weeks*7);
    if(g.smart.deadline && !g.smart.deadlineSoft) out.lateDays = daysBetween(g.smart.deadline, out.date);
  }
  if(g.smart.deadline){
    const wks = Math.max(1, Math.ceil(Math.max(0,daysBetween(today(), g.smart.deadline))/7));
    out.needed = Math.ceil(remaining/wks);
  }
  return out;
}
/* the payoff of the link: bank this week's allocation against the goal and let the
   normal cyclical machinery produce (and re-book) the next contribution */
function logContribution(catId){
  const c=(budget().cats||[]).find(x=>x.id===catId); if(!c) return;
  const g=c.goalId && goalById(c.goalId); if(!g) return;
  const amt=+c.amount||0; if(amt<=0){ toast('Give the category an amount first.'); return; }
  checkpoint('that contribution');
  g.smart.current = (+g.smart.current||0) + amt;
  const t=g.threads.find(x=>x.status!=='done') || g.threads[0];
  const s=t && currentStep(t);
  if(s) completeStep(g,t,s); else save();
  render();
  const p=catProjection(c);
  toast(money(amt)+' logged — '+shortName(g)+' at '+money(g.smart.current)+' of '+money(g.smart.target)
        +(p&&p.done?' · target reached':''));
}

/* ---------- capacity ----------
   loadOn() was already being computed and then only used to break ties. A day has
   a ceiling; the point of saying so is that the calendar can refuse to lie to you. */
const dayBudget = ()=> Math.max(30, DB.meta.dayBudgetMins||240);
function loadState(k){
  const mins=CAL.loadOn(k), budget=dayBudget();
  return {mins, budget, pct:Math.round(mins/budget*100), over:mins>budget, free:Math.max(0,budget-mins)};
}
const hrs = m => (Math.round(m/60*10)/10)+'h';
function loadBar(k,opts={}){
  const L=loadState(k);
  if(!L.mins && !opts.always) return '';
  return `<div class="loadbar ${L.over?'over':L.pct>=80?'near':''}" title="${hrs(L.mins)} of a ${hrs(L.budget)} day">
    <i style="width:${Math.min(100,L.pct)}%"></i></div>`;
}

/* --- export / import --- */
function exportJSON(){
  /* Foreign Google rows are a cache, not your data: they re-derive on the next
     sync, and an export you mail to yourself shouldn't carry your work calendar
     inside it. Ply-owned rows stay — they carry the step link. */
  const out=Object.assign({app:'ply', schema:SCHEMA, exportedAt:new Date().toISOString()}, DB,
    {events: DB.events.filter(e=>!e.gcal || !!e.stepId)});
  const blob = new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='ply-'+today()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importJSON(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      let d; try{ d=JSON.parse(r.result); }catch(e){ toast('That file is not valid JSON.'); return; }
      const m=migrate(d);
      if(!m.ok){ toast(m.msg); return; }
      checkpoint('that import');
      DB=d; save(); render();
      toast(m.from<SCHEMA ? 'Imported and upgraded from schema '+m.from+'.' : 'Imported.');
    };
    r.readAsText(f); };
  inp.click();
}

/* ===================== [SECTION: CLASSIFY] ===================== */
/* Type specs. `gate` = a field that must be explicit; if it's missing the goal is
   still saved immediately and the question is QUEUED into the next check-in —
   capture never blocks. `cadence` = default silence window in days. */
const TYPE = {
  deadline:   {label:'Deadline',    gate:'deadline', cadence:4,  rel:'sequential', color:'deadline',
               metric:'progress toward a fixed date', hint:'Metric climbs toward a fixed date.'},
  habit:      {label:'Habit',       gate:null,       cadence:3,  rel:'cyclical',   color:'habit',
               metric:'streak / sessions', hint:'No finish line. Next step is always the next session.'},
  milestone:  {label:'Milestone',   gate:null,       cadence:10, rel:'sequential', color:'milestone',
               metric:'features shipped', hint:'Completing a step pulls the next off the backlog.'},
  threshold:  {label:'Threshold',   gate:null,       cadence:14, rel:'cyclical',   color:'threshold',
               metric:'cumulative total', hint:'Next step is this period\u2019s contribution.', review:true},
  maintenance:{label:'Maintenance', gate:null,       cadence:7,  rel:'cyclical',   color:'maintenance',
               metric:'staying in range', hint:'A gap itself surfaces the goal \u2014 not just the check-in.'},
  pipeline:   {label:'Pipeline',    gate:null,       cadence:7,  rel:'parallel',   color:'pipeline',
               metric:'volume + conversion', hint:'Stages: applied \u2192 screen \u2192 interview \u2192 offer.'},
  contingent: {label:'Contingent',  gate:'trigger',  cadence:0,  rel:'sequential', color:'contingent',
               metric:'dormant until trigger', hint:'Silent until the trigger fires. Never nags before then.'},
  decision:   {label:'Decision',    gate:'decision', cadence:14, rel:'sequential', color:'decision',
               metric:'resolved / not', hint:'Next step is research or decide. Resolves once, then closes or converts.'},
  task:       {label:'Task',        gate:null,       cadence:0,  rel:'sequential', color:'milestone',
               metric:null, hint:'No goal wrapper \u2014 just an item in the matrix.'}
};
const PIPELINE_STAGES = ['sourced','applied','screen','interview','offer'];

/* ---------- lightweight natural-date extraction ---------- */
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const DOWS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function parseWhen(text){
  const s=' '+text.toLowerCase()+' ';
  let m;
  if((m=s.match(/\b(\d{4})-(\d{2})-(\d{2})\b/)))
    return {key:`${m[1]}-${m[2]}-${m[3]}`, matched:m[0]};
  if((m=s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){
    let y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):parseKey(today()).getFullYear();
    const d=new Date(y,+m[1]-1,+m[2]); if(!m[3]&&dkey(d)<today())d.setFullYear(y+1);
    return {key:dkey(d), matched:m[0]};
  }
  if((m=s.match(new RegExp('\\b('+MONTHS.join('|')+')[a-z]*\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b')))){
    const y=parseKey(today()).getFullYear(); const d=new Date(y,MONTHS.indexOf(m[1]),+m[2]);
    if(dkey(d)<today())d.setFullYear(y+1);
    return {key:dkey(d), matched:m[0]};
  }
  if((m=s.match(/\bin\s+(\d{1,3})\s*(day|week|month)s?\b/))){
    const n=+m[1], mult=m[2]==='day'?1:m[2]==='week'?7:30;
    return {key:addDays(today(),n*mult), matched:m[0]};
  }
  if((m=s.match(/\bnext\s+(week|month)\b/)))
    return {key:addDays(today(), m[1]==='week'?7:30), matched:m[0]};
  if((m=s.match(new RegExp('\\b(?:by|on|this|next)\\s+('+DOWS.join('|')+')\\b')))){
    const want=DOWS.indexOf(m[1]); const d=parseKey(today());
    let delta=(want-d.getDay()+7)%7; if(delta===0)delta=7;
    return {key:addDays(today(),delta), matched:m[0]};
  }
  if(/\btomorrow\b/.test(s)) return {key:addDays(today(),1), matched:'tomorrow'};
  if(/\btoday\b/.test(s))    return {key:today(), matched:'today'};
  return null;
}
function parseClock(text){
  const m=text.toLowerCase().match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
  if(!m) return null;
  let h=+m[1]%12; if(m[3]==='pm')h+=12;
  return {min:h*60+(+(m[2]||0)), matched:m[0]};
}
function parseMoney(text){
  const m=text.match(/\$\s?([\d,]+(?:\.\d+)?)\s*(k|m)?/i);
  if(m) return Math.round(parseFloat(m[1].replace(/,/g,''))*(/k/i.test(m[2]||'')?1000:/m/i.test(m[2]||'')?1e6:1));
  const k=text.match(/\b(\d+(?:\.\d+)?)\s?k\b/i);
  return k?Math.round(parseFloat(k[1])*1000):null;
}

/* ---------- the classifier ---------- */
const RULES = [
  {t:'contingent', re:/\bif\b.*\b(comes? through|happens|works out|goes through|closes|lands)\b|\bcontingent\b|\bonce (?:we|i|they|it)\b.*\b(close|sell|move|get)\b|\bin case\b|\bpending whether\b/i, w:9},
  {t:'decision',   re:/\bshould i\b|\bwhether (?:to|or)\b|\bdecide (?:whether|if|between|on)\b|\bfigure out (?:if|whether|which)\b|\blook into\b|\bresearch\b|\bcompare\b.*\bvs\b|\bopen question\b/i, w:8},
  {t:'threshold',  re:/\bsav(?:e|ing) (?:up )?(?:for|toward)\b|\bput aside\b|\bset aside\b|\bpay (?:off|down)\b|\bbuild (?:up )?(?:an? )?(?:emergency )?fund\b|\$[\d,]/i, w:8},
  {t:'pipeline',   re:/\bappl(?:y|ications?|ying)\b|\binterviews?\b|\brecruiters?\b|\bjob (?:search|hunt)\b|\boutreach\b|\breach out to\b|\bcold (?:email|call)\b|\bsubmit .* to\b|\bpitch(?:es|ing)? \b/i, w:7},
  {t:'maintenance',re:/\bstay on top of\b|\bmaintain\b|\bkeep (?:it |the |my )?\w+ (?:clean|tidy|up to date|current)\b|\bconsistency\b|\bdon'?t let\b|\blog\b|\bstay in touch\b|\bkeep up with\b/i, w:6},
  {t:'habit',      re:/\bpractic(?:e|ing)\b|\bconsistently\b|\bevery ?day\b|\bdaily\b|\b(?:each|every) (?:week|morning|night|evening)\b|\bx ?\/ ?week\b|\b\d+ ?(?:times|x) a week\b|\broutine\b|\bhabit\b|\bwork ?out\b|\brun(?:ning)? \d/i, w:6},
  {t:'deadline',   re:/\bexam\b|\bcert(?:ification|ified)?\b|\bretake\b|\bdeadline\b|\bdue\b|\bby (?:the )?(?:end of|eod)\b|\btest on\b|\bsit (?:the|for)\b/i, w:6},
  {t:'milestone',  re:/\bship\b|\bbuild\b|\bimplement\b|\blaunch\b|\bdeploy\b|\brefactor\b|\bmigrate\b|\bmvp\b|\bv\d\b|\bfinish (?:the|my|building)\b|\bstand up\b|\bwrite (?:the|a) (?:api|service|module|docs?)\b/i, w:5}
];
const ACTION_VERBS=/^(get|buy|call|email|text|pick up|drop off|send|book|schedule|order|return|renew|cancel|pay|fix|clean|mail|print|sign|register|replace|refill|water|charge)\b/i;

/* ---------- learned corrections ----------
   The confirm-type gate was already collecting the right answer and then throwing it
   away on clearGate(). Keeping it is the difference between a fixed regex table and
   something that fits one person's vocabulary after a month. Nothing here overrides
   the rules outright — a correction is just another scorer, weighted by how often
   it has been repeated. */
const STOPWORDS=new Set(('a an the to for of and or my me i in on at with by is it that this these those then '+
  'than get got do doing done make made new some any all up down out off over about into from as be been '+
  'next last week day days month year every each more less very just now again still keep').split(' '));

function termsOf(text){
  return [...new Set(String(text||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/)
    .filter(w=>w.length>2 && !STOPWORDS.has(w)))];
}
/* Similarity has to be symmetric. Scoring hits against the stored entry alone means
   a lesson from a long phrase can never be matched by a short capture; scoring
   against the smaller set alone means one incidental shared word drags in a long
   lesson ("the board meeting" matching "reconcile the quarterly numbers before the
   board meeting"), and a one-word lesson hijacks everything containing that word.
   Dice penalises both directions at once. */
function overlap(a,b){
  const B=new Set(b);
  const hits=a.filter(t=>B.has(t)).length;
  return {hits, dice: (2*hits)/Math.max(1, a.length+b.length), a:a.length, b:b.length};
}
/* two shared terms, or a one-word lesson meeting a phrase short enough for it to mean something */
const matches = o => o.dice>=0.6 && (o.hits>=2 || Math.min(o.a,o.b)===1);

function learnType(text,type){
  if(!TYPE[type]) return;
  const terms=termsOf(text); if(!terms.length) return;
  const L=DB.meta.learned=DB.meta.learned||[];
  // same type, largely the same words = one lesson reinforced, not a duplicate
  const hit=L.find(e=>e.type===type && overlap(e.terms,terms).dice>=0.6);
  if(hit){ hit.terms=[...new Set(hit.terms.concat(terms))].slice(0,14); hit.n++; }
  else L.push({terms:terms.slice(0,14), type, n:1});
  // only a near-identical phrase erodes an earlier lesson — otherwise teaching "guitar"
  // would silently wipe what you'd already taught about "practice guitar"
  for(const e of L) if(e.type!==type && overlap(e.terms,terms).dice>=0.8) e.n=Math.max(0,e.n-1);
  DB.meta.learned=L.filter(e=>e.n>0).slice(-200);
}
/* Capped at 8 — below the heaviest rule (9) on purpose. A correction should tilt a
   close call, not overrule an unambiguous phrase. */
function learnedScore(text){
  const terms=termsOf(text); const out={};
  if(!terms.length) return out;
  for(const e of (DB.meta.learned||[])){
    const o=overlap(e.terms,terms);
    if(!matches(o)) continue;
    const cur = out[e.type] || (out[e.type]={score:0, dice:0});
    cur.score = Math.min(8, cur.score + 3 + o.dice*4 + Math.min(2,e.n));
    cur.dice  = Math.max(cur.dice, o.dice);
  }
  return out;
}

function classify(text, opts={}){
  const s=(text||'').trim(); const words=s.split(/\s+/).filter(Boolean);
  const when=parseWhen(s);
  const scores={};
  for(const r of RULES) if(r.re.test(s)) scores[r.t]=(scores[r.t]||0)+r.w;

  // corrections you've already made, scored alongside the rules
  const learned=learnedScore(s);
  for(const t in learned) scores[t]=(scores[t]||0)+learned[t].score;

  // known project names strongly imply milestone
  const proj=(DB&&DB.meta.projects||[]).find(p=>p&&new RegExp('\\b'+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(s));
  if(proj) scores.milestone=(scores.milestone||0)+7;

  // an explicit date pushes toward deadline unless it already reads as a habit
  if(when && !scores.habit && !scores.maintenance) scores.deadline=(scores.deadline||0)+4;

  // short single action with no date/recurrence language = plain task
  const plain = words.length<=6 && !when && Object.keys(scores).length===0;
  if(plain || (ACTION_VERBS.test(s) && words.length<=8 && !when)) scores.task=(scores.task||0)+6;

  let type = Object.keys(scores).sort((a,b)=>scores[b]-scores[a])[0]
          || (words.length<=6 ? 'task' : 'milestone');
  if(opts.force) type=opts.force;

  const spec=TYPE[type];
  // "taught" means near-identical to something you corrected — the case where being
  // asked again is the actual annoyance. A loose match still scores, but still asks.
  const taught = !!learned[type] && learned[type].dice>=0.8;
  const out={ type, project:proj||null, when, clock:parseClock(s), money:parseMoney(s),
              scores, gates:[], learned:taught };
  // gated types: queue the question, never block capture
  if(spec.gate==='deadline' && !when)
    out.gates.push({id:uid(),kind:'deadline',q:'What is the hard date for "'+s+'"?'});
  if(spec.gate==='trigger')
    out.gates.push({id:uid(),kind:'trigger',q:'What condition activates "'+s+'"? Until then it stays dormant.'});
  if(spec.gate==='decision' && !opts.force)
    out.gates.push({id:uid(),kind:'decision',q:'Is "'+s+'" a decision to research, or a goal to execute?'});
  // once you've taught it this shape of phrase, it stops asking
  if(spec.review && !taught)
    out.gates.push({id:uid(),kind:'confirm-type',q:'Filed "'+s+'" as '+spec.label.toLowerCase()+'-type. Right call?'});
  return out;
}

/* ===================== [SECTION: ENGINE] ===================== */
function shortName(g){
  return g.title.replace(/^(practice|keep up with|stay on top of|work on|save (?:up )?for|learn)\s+/i,'')
                .replace(/\s+(every ?day|daily|consistently|weekly)\b.*$/i,'').trim() || g.title;
}
const cadenceOf = g => (g.cadenceDays!=null ? g.cadenceDays : TYPE[g.type].cadence);

/* ---- build a goal from a captured phrase + classification ---- */
function buildGoalFrom(text, cls){
  const spec=TYPE[cls.type];
  const g=newGoal({title:text.trim(), type:cls.type, gates:cls.gates.slice()});
  g.smart.outcome = text.trim();
  g.smart.metricName = spec.metric||'';
  if(cls.when) g.smart.deadline = cls.when.key;
  if(cls.type==='habit'||cls.type==='maintenance') g.smart.deadlineSoft=true;
  if(cls.money){ g.smart.target=cls.money; g.smart.metricUnit='$'; g.smart.metricName='amount saved'; }
  if(cls.type==='pipeline'){ g.stages=PIPELINE_STAGES.slice(); }
  if(cls.type==='milestone' && cls.project) g.notes='Project: '+cls.project;

  const t=newThread({rel:spec.rel, name: cls.type==='pipeline'?'Pipeline':'Main'});
  g.threads.push(t);

  // contingent goals stay dormant until the trigger fires; nothing is scheduled
  if(cls.type==='contingent'){ t.status='dormant'; return g; }

  const first = firstStepFor(g,t,cls);
  if(first) t.steps.push(first);
  return g;
}

function firstStepFor(g,t,cls){
  switch(g.type){
    case 'habit':       return newStep('Next session: '+shortName(g),{auto:true,quadrant:'q2'});
    case 'maintenance': return newStep('Next '+shortName(g),{auto:true,quadrant:'q2'});
    case 'threshold':   return newStep('This period’s contribution'+(g.smart.target?' toward '+money(g.smart.target):''),{auto:true,quadrant:'q2'});
    case 'pipeline':    return newStep('Send this week’s batch',{auto:true,quadrant:'q2'});
    case 'decision':    return newStep('Research / decide: '+shortName(g),{auto:true,quadrant:'q2'});
    case 'milestone':   return newStep(g.backlog.length ? g.backlog.shift()
                          : 'Break '+shortName(g)+' into a backlog',{auto:true,quadrant:'q2'});
    case 'task':        return newStep(g.title,{quadrant: cls&&cls.when?'q1':'q3'});
    // a deadline goal's first move is always the same: work out the path to the date.
    // every step after that has to be defined deliberately (see autoNextTitle).
    case 'deadline':    return newStep('Map the steps back from '+(g.smart.deadline?fmtDate(g.smart.deadline):'the deadline'),{auto:true,quadrant:'q2'});
    default:            return null;
  }
}

/* ===================== [SECTION: SUBTASKS] =====================
   Exactly one level: goal -> thread -> step -> sub. Unbounded nesting would mean
   every renderer, currentStep() and the whole item stream have to recurse, and the
   matrix would fill with items that aren't really commitments. A sub is a checklist
   line under a step — it never becomes a card, never gets its own calendar slot,
   and never competes to be the thread's next move. The step stays the unit of work.
   ------------------------------------------------------------------ */
const subs = s => (s && Array.isArray(s.subs)) ? s.subs : [];
function subProgress(s){
  const a=subs(s); const done=a.filter(x=>x.done).length;
  return {done, total:a.length, frac: a.length?done/a.length:0, any:a.length>0};
}
/* undone first, but stable within each half so a deliberate order survives */
function sortSubs(s){
  if(!s||!Array.isArray(s.subs)) return;
  const open=s.subs.filter(x=>!x.done), shut=s.subs.filter(x=>x.done);
  s.subs=open.concat(shut);
}
function addSub(g,t,s,title){
  if(!title || !String(title).trim()) return null;
  if(!Array.isArray(s.subs)) s.subs=[];
  const sub=newSub(title); s.subs.push(sub); sortSubs(s); touchThread(t); save();
  return sub;
}
function moveItem(arr,i,dir){
  const j=i+dir;
  if(i<0||i>=arr.length||j<0||j>=arr.length) return false;
  const [x]=arr.splice(i,1); arr.splice(j,0,x); return true;
}
/* Ticking the last one finishes the step through the normal path, so the successor
   is generated, logged and re-booked exactly as it would be by any other route. */
function toggleSub(gid,tid,sid,subId){
  const f=findStep(sid); if(!f) return {};
  const {goal,thread,step}=f;
  const sub=subs(step).find(x=>x.id===subId); if(!sub) return {};
  checkpoint(sub.done?'unticking that subtask':'ticking that subtask');
  sub.done=!sub.done; sub.doneAt=sub.done?new Date().toISOString():null;
  sortSubs(step); touchThread(thread);
  const p=subProgress(step);
  if(sub.done && p.total && p.done===p.total && !step.done){
    const r=completeStep(goal,thread,step);
    save(); return {completed:true, ...r};
  }
  save(); return {completed:false};
}
/* Dropping a subtask on the calendar can't schedule the sub — a sub has no slot, by
   design — so it schedules the parent step and moves that sub to the front of the
   list. The gesture means "this is the bit I'm doing then", and the checklist order
   is where that intent lives. */
function floatSub(step,subId){
  const a=subs(step); const i=a.findIndex(x=>x.id===subId);
  if(i<0) return false;
  const [x]=a.splice(i,1); a.unshift(x); sortSubs(step); return true;
}

/* An unfinished sub is still work; dropping it on the floor because its parent got
   ticked is how a checklist quietly loses things. It rides forward instead. */
function carrySubs(prev,next){
  const open=subs(prev).filter(x=>!x.done);
  if(!open.length || !next) return 0;
  next.subs=(next.subs||[]).concat(open.map(x=>newSub(x.title)));
  prev.subs=subs(prev).filter(x=>x.done);
  return open.length;
}

/* ---- the rule: completing a step must produce the next one ---- */
function completeStep(g,t,s,opts={}){
  s.done=true; s.doneAt=new Date().toISOString();
  if(opts.outcome) s.outcome=opts.outcome;
  touchThread(t);
  logIt('done',{goalId:g.id,threadId:t.id,stepId:s.id,text:s.title,dateKey:today()});
  if(s.eventId){ const e=eventById(s.eventId); if(e) e.done=true; }

  if(g.type==='task'){ finishGoal(g,'task done'); save(); return {next:null,needsDefine:false}; }
  if(g.type==='decision'){ t.status='done'; g.gates.push({id:uid(),kind:'resolve-decision',
      q:'"'+g.title+'" — what did you land on? Convert it into a goal, or close it out.'}); save(); return {next:null,needsDefine:false}; }

  // conditional: which way did it resolve?
  if(t.rel==='conditional' && t.branches.length && !opts.branch){
    t.needsBranch=true; save(); return {next:null,needsDefine:true,reason:'branch'};
  }
  let title=null;
  if(opts.branch){ title=opts.branch.next; t.needsBranch=false; }
  else title = autoNextTitle(g,t,s);

  if(!title){ save(); return {next:null,needsDefine:true,reason:'define'}; }
  const ns=newStep(title,{auto:true,quadrant:s.quadrant});
  const carried=carrySubs(s,ns);          // unfinished subtasks ride forward
  t.steps.push(ns);

  /* A cyclical goal that was on the calendar goes straight back on it, same slot,
     one cadence later. Without this a daily habit is a scheduling chore forever —
     which is the friction that makes people stop using the thing. */
  if(TYPE[g.type].rel==='cyclical' && s.eventId){
    const prev=eventById(s.eventId);
    if(prev){
      const step=Math.max(1, cadenceOf(g)||7);
      let nk=addDays(prev.dateKey, step);
      if(nk<=today()) nk=addDays(today(), step);          // don't re-book something already past
      const ev=CAL.anchor(g,t,ns,nk,prev.start,prev.dur);
      if(prev.allDay){ ev.allDay=true; ev.start=0; ev.dur=1440; }
      ns.autoScheduled=true;
    }
  }
  save();
  return {next:ns,needsDefine:false,carried};
}

function autoNextTitle(g,t,prev){
  switch(g.type){
    case 'habit':       return 'Next session: '+shortName(g);
    case 'maintenance': return 'Next '+shortName(g);
    case 'threshold':   return 'This period’s contribution'+(g.smart.target?' toward '+money(g.smart.target):'');
    case 'pipeline':{
      const i=(g.stages||PIPELINE_STAGES).indexOf(t.stage||'');
      if(t.stage && i>-1 && i<(g.stages||PIPELINE_STAGES).length-1){
        t.stage=(g.stages||PIPELINE_STAGES)[i+1];
        return 'Advance to '+t.stage+': '+t.name;
      }
      return 'Send this week’s batch';
    }
    case 'milestone':   return g.backlog.length ? g.backlog.shift() : null;
    default:            return null;   // deadline & anything bespoke: define it deliberately
  }
}
function money(n){ return '$'+Number(n).toLocaleString(); }

/* ---- item stream: current steps + tasks, in one shape the views can render ---- */
function activeItems(){ return pass('items', _activeItems); }
function _activeItems(){
  const out=[];
  for(const g of liveGoals()){
    for(const t of g.threads){
      if(t.status==='dormant'||t.status==='done') continue;
      const s=currentStep(t); if(!s) continue;
      const ev = s.eventId?eventById(s.eventId):null;
      out.push({goal:g, thread:t, step:s, ev, dateKey:ev?ev.dateKey:null, start:ev?ev.start:null,
                quadrant:s.quadrant, blocked:t.status==='blocked'});
    }
  }
  return out;
}
function itemsOn(k){ return activeItems().filter(i=>i.dateKey===k); }
function unscheduledItems(){ return activeItems().filter(i=>!i.dateKey && !i.blocked); }
function overdueItems(){ const t=today(); return activeItems().filter(i=>i.dateKey && i.dateKey<t); }

/* ---- silence-as-signal: any thread quiet past its cadence surfaces itself ---- */
function daysQuiet(t){
  const last=t.lastMovement||t.createdAt||new Date().toISOString();
  return Math.max(0, daysBetween(dkey(new Date(last)), today()));
}
/* ---- neglect should make this quieter, not louder ----------------------
   Nagging that hasn't worked in three full cadences isn't going to start working;
   all it does is grow the ribbon until the ribbon itself gets ignored, which takes
   the signals that *do* matter down with it. Past that point a thread goes quiet:
   it stops emitting, drops off the check-in agenda, and collapses into a single
   "gone quiet" chip. Any movement brings it back on its own, because this is
   computed from lastMovement rather than stored — there's no flag to get stuck. */
const HUSH_AT=3;
const quietLimit = g => (g.type==='decision' ? cadenceOf(g)*2 : cadenceOf(g));
function hushed(g,t){
  if(t.status==='blocked'||t.status==='dormant'||t.status==='done') return false;
  const lim=quietLimit(g);
  return lim>0 && daysQuiet(t) > lim*HUSH_AT;
}
const GATE_SHORT={ deadline:'Needs a hard date', trigger:'Needs a trigger condition',
  decision:'A decision, or a goal?', 'confirm-type':'Confirm the type',
  'resolve-decision':'Decision needs resolving' };

function signals(){ return pass('signals', _signals); }
function _signals(){
  const out=[]; const T=today();
  for(const g of liveGoals()){
    // gates used to be answerable only inside the check-in; they surface here now
    for(const gate of (g.gates||[]))
      out.push({sev:'warn',kind:'gate',goal:g,thread:g.threads[0],gate,
        days:g.threads[0]?daysQuiet(g.threads[0]):0, text:GATE_SHORT[gate.kind]||'Question waiting'});

    for(const t of g.threads){
      if(t.status==='dormant'||t.status==='done') continue;
      const cad=cadenceOf(g);
      const q=daysQuiet(t);
      if(t.status==='blocked'){
        const bd = t.blockedSince ? daysBetween(dkey(new Date(t.blockedSince)),T) : q;
        if(bd>=7) out.push({sev:'warn',kind:'blocked',goal:g,thread:t,days:bd,
          text:'Blocked '+bd+'d — waiting on '+(t.blockedOn||'someone')});
        continue;
      }
      if(hushed(g,t)){
        out.push({sev:'mute',kind:'hushed',goal:g,thread:t,days:q,
          text:'Gone quiet after '+q+'d — no longer nagging'});
        continue;                                   // and nothing else from this thread
      }
      if(t.needsBranch) out.push({sev:'hard',kind:'branch',goal:g,thread:t,days:q,
        text:'Branch unresolved — which way did it go?'});
      const s=currentStep(t);
      if(!s) out.push({sev:'hard',kind:'nostep',goal:g,thread:t,days:q, text:'No next step defined'});
      else if(!s.eventId && g.type!=='task') out.push({sev:'warn',kind:'unscheduled',goal:g,thread:t,days:q,
        text:'Next step not on the calendar'});
      else if(s.eventId){ const e=eventById(s.eventId);
        if(e && e.dateKey<T) out.push({sev:'hard',kind:'slipped',goal:g,thread:t,days:daysBetween(e.dateKey,T),
          text:'Slipped '+daysBetween(e.dateKey,T)+'d past its slot'}); }
      // decisions get a long leash and only nudge at 2x cadence
      const limit = quietLimit(g);
      if(limit>0 && q>limit) out.push({sev:q>limit*2?'hard':'warn',kind:'quiet',goal:g,thread:t,days:q,
        text:'No movement in '+q+'d'});
    }
    if(g.type==='deadline' && g.smart.deadline){
      const left=daysBetween(T,g.smart.deadline);
      if(left>=0 && left<=14) out.push({sev:left<=5?'hard':'warn',kind:'deadline',goal:g,thread:g.threads[0],days:left,
        text:left===0?'Due today':(left+'d to deadline')});
      if(left<0) out.push({sev:'hard',kind:'deadline',goal:g,thread:g.threads[0],days:left,text:'Deadline passed '+Math.abs(left)+'d ago'});
    }
  }
  // strongest first, then most overdue — minus anything explicitly snoozed
  const muted=new Set((DB.meta.snoozed||[]).filter(x=>x.until>today()).map(x=>x.k));
  for(const s of out) s.key=sigKey(s);
  return out.filter(s=>!muted.has(s.key))
            .sort((a,b)=>SEV_RANK[a.sev]-SEV_RANK[b.sev] || b.days-a.days);
}
const SEV_RANK={hard:0, warn:1, mute:2};
function sigKey(s){ return s.kind+':'+(s.gate?s.gate.id:(s.thread?s.thread.id:s.goal.id)); }

/* Snoozing mutes the ribbon only. checkinAgenda() doesn't consult signals(), so a
   snoozed thread still gets asked about at the weekly check-in — muting the nag
   is not the same as deciding, and only the check-in is allowed to close things. */
function snoozeSignals(keys,label){
  checkpoint(label||'snooze');
  const until=addDays(today(),7);
  DB.meta.snoozed=(DB.meta.snoozed||[]).filter(x=>!keys.includes(x.k));
  for(const k of keys) DB.meta.snoozed.push({k,until});
  SIGOPEN=null; save(); render();
  toast((keys.length>1?keys.length+' signals':'Signal')+' snoozed 7d — the check-in still asks.');
}

/* ---- gates queued for the check-in ---- */
function openGates(){
  const out=[];
  for(const g of liveGoals()) for(const gate of (g.gates||[])) out.push({goal:g,gate});
  return out;
}
function clearGate(g,gateId){ g.gates=(g.gates||[]).filter(x=>x.id!==gateId); save(); }

/* ---- check-in cadence ---- */
function lastDowKey(dow){
  const d=parseKey(today()); const back=(d.getDay()-dow+7)%7;
  return addDays(today(),-back);
}
function checkinDue(){
  const m=DB.meta;
  if(!m.lastCheckin) return true;
  if(m.checkinMode==='elapsed') return daysBetween(m.lastCheckin,today())>=m.checkinEveryDays;
  return m.lastCheckin < lastDowKey(m.checkinDow);
}
/* everything the check-in will walk through */
function checkinAgenda(){
  const since = DB.meta.lastCheckin || addDays(today(),-7);
  const moved = new Set(DB.log.filter(l=>l.kind==='done' && (l.dateKey||'')>=since).map(l=>l.threadId));
  const quiet=[], blocked=[], nostep=[], unsched=[], branch=[], hush=[];
  for(const g of liveGoals()){
    for(const t of g.threads){
      if(t.status==='done'||g.type==='task') continue;
      if(t.status==='dormant') continue;                 // contingent: stays silent, by design
      if(t.status==='blocked'){ blocked.push({goal:g,thread:t}); continue; }
      // gone quiet past 3x cadence: off the agenda too, or the queue just grows
      if(hushed(g,t)){ hush.push({goal:g,thread:t,days:daysQuiet(t)}); continue; }
      if(t.needsBranch){ branch.push({goal:g,thread:t}); continue; }
      const s=currentStep(t);
      if(!s){ nostep.push({goal:g,thread:t}); continue; }
      if(!moved.has(t.id)) quiet.push({goal:g,thread:t,step:s,days:daysQuiet(t)});
      if(!s.eventId) unsched.push({goal:g,thread:t,step:s});
    }
  }
  return {gates:openGates(), quiet, blocked, nostep, unsched, branch, hush, since};
}

/* ---- follow-through: planned vs actually done ---- */
function followThrough(goalId,days=28){
  const from=addDays(today(),-days);
  const L=DB.log.filter(l=>(l.dateKey||dkey(new Date(l.ts)))>=from && (!goalId||l.goalId===goalId));
  const planned=L.filter(l=>l.kind==='planned').length;
  const done=L.filter(l=>l.kind==='done').length;
  return {planned,done,rate:planned?clamp(Math.round(done/planned*100),0,100):(done?100:0)};
}
function streak(goalId){
  const days=new Set(DB.log.filter(l=>l.goalId===goalId&&l.kind==='done').map(l=>l.dateKey||dkey(new Date(l.ts))));
  let n=0,k=today();
  if(!days.has(k)) k=addDays(k,-1);
  while(days.has(k)){ n++; k=addDays(k,-1); }
  return n;
}

/* ===================== [SECTION: VIEWS] ===================== */
const QUAD = {
  q1:{n:'Do now',    ax:'Urgent + Important',       c:'var(--q1)'},
  q2:{n:'Schedule',  ax:'Important, not urgent',    c:'var(--q2)'},
  q3:{n:'Offload',   ax:'Urgent, not important',    c:'var(--q3)'},
  q4:{n:'Defer',     ax:'Neither',                  c:'var(--q4)'}
};
const ZOOMS=['day','week','quarter','list'];
let lastZoomIdx=0;

/* ---------- keeping your place across a re-render ----------
   Every mutation replaces #view wholesale. When the new content is a different height
   — a row completed, a type filtered out, a checklist expanded — the browser clamps
   the scroll and you land back at the top, having just acted on something halfway
   down. Capture and restore instead. Focus goes the same way: an inline input that
   was mid-edit is a different DOM node afterwards, so re-find it by what identifies
   it and put the caret back. */
function captureView(){
  const m=$('main'); const a=document.activeElement;
  const st={top:m?m.scrollTop:0, sel:null, start:null, end:null};
  if(a && a!==document.body && $('#view') && $('#view').contains(a)){
    const bits=[];
    if(a.className) bits.push('.'+String(a.className).trim().split(/\s+/).join('.'));
    for(const k of ['new','s','t','sub','i','cat','goal','step']) if(a.dataset && a.dataset[k]!=null)
      bits.push(`[data-${k}="${CSS.escape?CSS.escape(a.dataset[k]):a.dataset[k]}"]`);
    if(bits.length){
      st.sel=bits.join('');
      if(a.selectionStart!=null){ st.start=a.selectionStart; st.end=a.selectionEnd; }
    }
  }
  return st;
}
function restoreView(st){
  const m=$('main'); if(m && st.top) m.scrollTop=st.top;
  if(!st.sel) return;
  let el=null; try{ el=$(st.sel,$('#view')); }catch(_){ el=null; }
  if(!el || el===document.activeElement) return;
  el.focus();
  if(st.start!=null && el.setSelectionRange){ try{ el.setSelectionRange(st.start,st.end); }catch(_){} }
}

function render(){
  PASS={};                       // one computation of the shared reads, this pass only
  try{ renderBody(); }finally{ PASS=null; }
}
function renderBody(){
  const keep=captureView();
  const z=DB.meta.zoom;
  $$('#zoombar button').forEach(b=>b.classList.toggle('on',b.dataset.z===z));
  const idx=ZOOMS.indexOf(z);
  const dir = idx>lastZoomIdx ? 'zout' : idx<lastZoomIdx ? 'zin' : '';
  lastZoomIdx=idx;
  const v=$('#view');
  v.className=dir;
  v.innerHTML = z==='day'?viewDay(): z==='week'?viewWeek(): z==='list'?viewList(): viewQuarter();
  renderSignals();
  const due=checkinDue(); const b=$('#checkinBadge');
  const ag=checkinAgenda(); const n=ag.gates.length+ag.quiet.length+ag.nostep.length+ag.branch.length;
  b.classList.toggle('hidden', !due);
  if(due) b.textContent = n?('due · '+n):'due';
  $('#btnCheckin').classList.toggle('primary', due);
  paintUndo();
  wireView();
  restoreView(keep);
}

/* ---------- signal ribbon ----------
   A wall of chips gets ignored, and an ignored ribbon defeats the whole premise.
   So: one chip per *kind*, not per thread. Kinds with several threads behind them
   collapse to a count and expand on click; the ribbon itself never exceeds SIG_MAX. */
const SIG_KIND={
  branch:      'unresolved branch',
  nostep:      'no next step defined',
  unscheduled: 'next step not on the calendar',
  slipped:     'slipped past its slot',
  quiet:       'no recent movement',
  blocked:     'blocked, still waiting',
  deadline:    'deadline closing in',
  gate:        'waiting on an answer',
  hushed:      'gone quiet — not nagging'
};
const SIG_MAX=5;
let SIGOPEN=null, SIGALL=false, SIGFIX=null;

/* ---------- resolving a signal where you found it ----------
   The check-in used to be the only door to four things: answering a gate, resolving
   a branch, giving a dead thread a next step, and putting a loose step on the
   calendar. That made a weekly ritual load-bearing for the whole app. The ribbon
   already knows exactly which threads need which of those, so it can just ask.
   Markup is local; every action below calls the same engine functions the check-in
   calls, so there is one implementation of each rule. */
const FIXABLE=new Set(['gate','nostep','unscheduled','slipped','branch','blocked','hushed']);

function sigResolverHTML(s){
  const g=s.goal, t=s.thread;
  const head=`<div class="fixhead"><b>${esc(shortName(g))}</b>
    <span class="muted">${esc(s.text)}</span>
    <span class="spacer" style="flex:1"></span>
    <button class="btn ghost sm" data-fix="cancel">&times;</button></div>`;
  let body='';

  if(s.kind==='gate'){
    const k=s.gate.kind;
    if(k==='deadline') body=`<div class="fixrow">
      <input type="date" id="fxDate" value="${g.smart.deadline||addDays(today(),14)}">
      <button class="btn primary sm" data-fix="gate-deadline">Set date</button></div>`;
    else if(k==='trigger') body=`<div class="fixrow">
      <input type="text" id="fxTrig" placeholder="What has to happen first?" value="${esc(g.trigger||'')}">
      <button class="btn sm" data-fix="gate-fire">Already fired</button>
      <button class="btn primary sm" data-fix="gate-trigger">Save</button></div>`;
    else if(k==='decision') body=`<div class="fixrow">
      <button class="btn sm" data-fix="gate-isgoal">It's a goal</button>
      <button class="btn primary sm" data-fix="gate-isdecision">It's a decision</button></div>`;
    else if(k==='confirm-type') body=`<div class="fixrow">
      <select id="fxType">${Object.keys(TYPE).map(x=>
        `<option value="${x}" ${x===g.type?'selected':''}>${TYPE[x].label}</option>`).join('')}</select>
      <button class="btn primary sm" data-fix="gate-type">Confirm</button></div>
      <div class="tiny muted">${esc(TYPE[g.type].hint)}</div>`;
    else body=`<div class="fixrow"><button class="btn sm" data-fix="open">Open the goal</button></div>`;
  }
  else if(s.kind==='nostep'){
    body=`<div class="fixrow">
      <input type="text" id="fxStep" placeholder="What's the next move?" value="${esc(autoNextTitle(g,t,null)||'')}">
      <select id="fxQuad">${Object.keys(QUAD).map(q=>
        `<option value="${q}" ${q==='q2'?'selected':''}>${QUAD[q].n}</option>`).join('')}</select>
      <button class="btn primary sm" data-fix="add-step">Add</button></div>`;
  }
  else if(s.kind==='unscheduled'||s.kind==='slipped'){
    const st=currentStep(t);
    body=`<div class="fixrow">
      <span class="tiny muted" style="flex:1;min-width:0">${esc(st?st.title:'')}</span>
      <input type="date" id="fxWhen" value="${suggestDay({goal:g,quadrant:st?st.quadrant:'q2'},45)}">
      <input type="time" id="fxTime" value="${suggestTime({goal:g,quadrant:st?st.quadrant:'q2'})}">
      <button class="btn primary sm" data-fix="schedule">Schedule</button></div>
      <div class="tiny muted" id="fxLoad"></div>`;
  }
  else if(s.kind==='branch'){
    body=`<div class="fixrow">${(t.branches||[]).map((b,i)=>
      `<button class="btn sm" data-fix="branch" data-i="${i}">${esc(b.condition)}</button>`).join('')
      ||'<span class="tiny muted">No branches defined — open the goal.</span>'}</div>`;
  }
  else if(s.kind==='blocked'){
    body=`<div class="fixrow">
      <span class="tiny muted" style="flex:1;min-width:0">Waiting on ${esc(t.blockedOn||'someone')}</span>
      <button class="btn primary sm" data-fix="unblock">It's unblocked</button></div>`;
  }
  else if(s.kind==='hushed'){
    body=`<div class="fixrow">
      <span class="tiny muted" style="flex:1;min-width:0">Stopped nagging after ${s.days}d. Reviving puts it back in rotation.</span>
      <button class="btn sm" data-fix="drop">Drop the goal</button>
      <button class="btn primary sm" data-fix="revive">Revive</button></div>`;
  }
  return `<div class="sigfix" data-key="${esc(s.key)}">${head}${body}</div>`;
}

function sigFixAct(act,btn){
  const s=signals().find(x=>x.key===SIGFIX);
  if(act==='cancel'||!s){ SIGFIX=null; renderSignals(); return; }
  const g=s.goal, t=s.thread;
  if(act==='open'){ SIGFIX=null; openGoal(g.id); return; }
  checkpoint('that fix');

  switch(act){
    case 'gate-deadline':{
      const d=$('#fxDate').value; if(!d){toast('Pick a date.');return;}
      g.smart.deadline=d; g.smart.deadlineSoft=false; clearGate(g,s.gate.id); break; }
    case 'gate-trigger':{
      const v=$('#fxTrig').value.trim(); if(!v){toast('Describe the trigger.');return;}
      g.trigger=v; g.threads.forEach(x=>x.status='dormant'); clearGate(g,s.gate.id); break; }
    case 'gate-fire':
      g.threads.forEach(x=>{ if(x.status==='dormant'){x.status='active'; touchThread(x);} });
      { const th=g.threads[0]; if(th&&!currentStep(th)) th.steps.push(newStep('First move on '+shortName(g),{auto:true})); }
      clearGate(g,s.gate.id); break;
    case 'gate-isdecision':
      g.type='decision'; learnType(g.title,'decision'); clearGate(g,s.gate.id);
      { const th=g.threads[0]; if(th&&!currentStep(th)) th.steps.push(newStep('Research / decide: '+shortName(g),{auto:true})); }
      break;
    case 'gate-isgoal':
      clearGate(g,s.gate.id); g.type='milestone';
      g.gates.push({id:uid(),kind:'confirm-type',q:'What kind of goal is "'+g.title+'"?'}); break;
    case 'gate-type':{
      const v=$('#fxType').value; g.type=v; learnType(g.title,v);
      if(TYPE[v].gate==='deadline'&&!g.smart.deadline)
        g.gates.push({id:uid(),kind:'deadline',q:'What is the hard date for "'+g.title+'"?'});
      g.threads.forEach(x=>{ if(!x.steps.length){const st=firstStepFor(g,x,null); if(st)x.steps.push(st);} });
      clearGate(g,s.gate.id); break; }
    case 'add-step':{
      const v=$('#fxStep').value.trim(); if(!v){toast('Name the step.');return;}
      t.steps.push(newStep(v,{quadrant:$('#fxQuad').value})); touchThread(t); break; }
    case 'schedule':{
      const st=currentStep(t); if(!st){toast('Nothing to schedule.');return;}
      const d=$('#fxWhen').value; if(!d){toast('Pick a date.');return;}
      const tm=($('#fxTime').value||'19:00').split(':');
      CAL.anchor(g,t,st,d,+tm[0]*60 + +tm[1],45); touchThread(t); break; }
    case 'branch':{
      const b=(t.branches||[])[+btn.dataset.i]; if(!b) return;
      t.needsBranch=false;
      t.steps.push(newStep(b.next,{auto:true})); touchThread(t); break; }
    case 'unblock':
      t.status='active'; t.blockedOn=''; t.blockedSince=null; touchThread(t); break;
    case 'revive':
      touchThread(t); break;                          // movement is what un-hushes it
    case 'drop':
      // nothing else is open, so this one can afford a real dialog
      SIGFIX=null; renderSignals();
      openConfirm({title:'Drop this goal', yes:'Drop it', danger:true,
        body:`<b>${esc(g.title)}</b> goes, along with its threads and calendar slots. <b>⌘Z undoes it.</b>`,
        onYes:()=>{ checkpoint('dropping that goal'); deleteGoal(g.id); render(); toast('Dropped — ⌘Z to undo.'); }});
      return;
  }
  SIGFIX=null; save(); render();
  toast(act==='revive'?'Back in rotation.':act==='drop'?'Dropped.':'Done — no check-in needed.');
}

function renderSignals(){
  const sig=signals(); const r=$('#signals');
  r.classList.toggle('empty', sig.length===0);
  if(!sig.length){ r.innerHTML=''; SIGOPEN=null; return; }

  const byKind={}, groups=[];
  for(const s of sig){
    let gr=byKind[s.kind];
    if(!gr){ gr=byKind[s.kind]={kind:s.kind, sev:s.sev, items:[]}; groups.push(gr); }
    gr.items.push(s);
    if(SEV_RANK[s.sev]<SEV_RANK[gr.sev]) gr.sev=s.sev;
  }
  groups.sort((a,b)=>SEV_RANK[a.sev]-SEV_RANK[b.sev] || b.items.length-a.items.length);
  if(SIGOPEN && !byKind[SIGOPEN]) SIGOPEN=null;
  const fix = SIGFIX && sig.find(s=>s.key===SIGFIX);
  if(SIGFIX && !fix) SIGFIX=null;

  const shown=SIGALL?groups:groups.slice(0,SIG_MAX), rest=SIGALL?[]:groups.slice(SIG_MAX);
  const chips=shown.map(gr=>{
    const keys=gr.items.map(i=>i.key).join('|');
    const zz=`<span class="zz" data-snooze="${keys}" title="Snooze 7 days">&#215;</span>`;
    const cls=gr.sev==='hard'?'hard':gr.sev==='mute'?'mute':'';
    if(gr.items.length===1){
      const s=gr.items[0];
      const fixable=FIXABLE.has(s.kind);
      return `<div class="sig ${cls} ${SIGFIX===s.key?'open':''}" data-sig="${esc(s.key)}" data-goal="${s.goal.id}">
        <b>${esc(shortName(s.goal))}</b> ${esc(s.text)}${fixable?'<span class="fixmark">fix</span>':''}${zz}</div>`;
    }
    const open=SIGOPEN===gr.kind;
    return `<div class="sig ${cls} ${open?'open':''}" data-grp="${gr.kind}">
      <b>${gr.items.length} ${gr.kind==='gate'?'question'+(gr.items.length>1?'s':''):'threads'}</b> ${esc(SIG_KIND[gr.kind]||gr.kind)}
      <span class="caret">${open?'&#9650;':'&#9660;'}</span>${zz}</div>`;
  }).join('');

  const more = rest.length
    ? `<div class="sig more" data-sigmore="1">+${rest.reduce((n,g)=>n+g.items.length,0)} more</div>`
    : (SIGALL && groups.length>SIG_MAX ? `<div class="sig more" data-sigmore="1">show less</div>` : '');

  let panel='';
  if(SIGOPEN && byKind[SIGOPEN] && byKind[SIGOPEN].items.length>1){
    const items=byKind[SIGOPEN].items;
    panel=`<div class="sigopen">${items.map(s=>
      `<div class="srow ${SIGFIX===s.key?'on':''}" data-sig="${esc(s.key)}" data-goal="${s.goal.id}">
         <b>${esc(shortName(s.goal))}</b><span class="t">${esc(s.text)}</span>
         ${FIXABLE.has(s.kind)?'<span class="fixmark">fix</span>':''}
         <span class="zz" data-snooze="${s.key}" title="Snooze 7 days">snooze</span></div>`).join('')}
      <div class="sfoot"><span class="zz" data-snooze="${items.map(i=>i.key).join('|')}">Snooze all ${items.length} for 7 days</span></div></div>`;
  }
  // the resolver sits under the ribbon so it reads as an answer to the chip above it
  const fixPanel = fix ? sigResolverHTML(fix) : '';
  r.innerHTML=`<div class="sigrow">${chips}${more}</div>${panel}${fixPanel}`;
  if(fix){ const f=$('#fxStep')||$('#fxTrig')||$('#fxDate')||$('#fxWhen'); if(f) setTimeout(()=>f.focus(),20); }
}

/* ---------- shared card ---------- */
const CARDSUBS=new Set();          // step ids whose checklist is expanded on the card
function itemCard(i,opts={}){
  const g=i.goal, s=i.step, t=i.thread;
  const slip = i.dateKey && i.dateKey<today() && !s.done;
  const meta=[];
  if(g.type!=='task') meta.push(`<span class="goaltag"><span class="dot" style="background:${QUAD[i.quadrant].c}"></span>${esc(shortName(g))}</span>`);
  if(t.name && t.name!=='Main' && g.threads.length>1) meta.push(`<span class="pill">${esc(t.name)}</span>`);
  if(i.ev) meta.push(`<span class="pill mono">${i.ev.allDay?'all day':fmtTime(i.ev.start)}</span>`);
  else if(g.type!=='task') meta.push(`<span class="pill" style="border-color:#5a4a24;color:#e8c98a">unscheduled</span>`);
  if(slip) meta.push(`<span class="pill" style="border-color:#5a2b2b;color:#f0a6a6">slipped ${daysBetween(i.dateKey,today())}d</span>`);
  if(i.blocked) meta.push(`<span class="pill" style="border-color:#5a4a24;color:#e8c98a">waiting on ${esc(t.blockedOn||'?')}</span>`);
  if(s.auto) meta.push(`<span class="pill tiny">auto</span>`);
  if(s.autoScheduled) meta.push(`<span class="pill tiny" title="re-booked by cadence when you completed the last one">&#8635; auto-booked</span>`);
  const sp=subProgress(s);
  if(sp.any) meta.push(`<span class="pill tiny subpill ${sp.done===sp.total?'full':''}" data-act="subs" data-step="${s.id}"
     title="${CARDSUBS.has(s.id)?'Hide':'Show'} subtasks">${sp.done}/${sp.total} ${CARDSUBS.has(s.id)?'&#9650;':'&#9660;'}</span>`);
  return `<div class="card ${s.done?'done':''}" data-step="${s.id}" data-thread="${t.id}" data-goal="${g.id}">
    <div class="qbar" style="background:${QUAD[i.quadrant].c}"></div>
    <div class="chk ${s.done?'on':''}" data-act="toggle">${s.done?'&#10003;':''}</div>
    <div class="body">
      <div class="ttl">${esc(s.title)}</div>
      <div class="meta">${meta.join('')}</div>
      ${ sp.any && CARDSUBS.has(s.id) ? `<div class="cardsubs">${subs(s).map(x=>
        `<div class="subline ${x.done?'done':''}" data-step="${s.id}" data-sub="${x.id}" data-thread="${t.id}" data-goal="${g.id}">
           <span class="subchk ${x.done?'on':''}" data-act="sub" data-step="${s.id}" data-sub="${x.id}"
             role="checkbox" aria-checked="${x.done}" tabindex="0">${x.done?'&#10003;':''}</span>
           <span class="x">${esc(x.title)}</span><span class="grip subgrip" title="Drag onto the calendar to schedule this step">&#8942;&#8942;</span></div>`).join('')}</div>` : '' }
    </div>
    <div class="grip" title="Drag to another quadrant">&#8942;&#8942;</div></div>`;
}

/* ---------- the horizontal day strip ----------
   Shared by Day and List. In List it doubles as a drop target: a row dragged onto it
   is scheduled at the time it lands on, which is the shortest path there is from
   "this exists" to "this is on the calendar" — the rule the whole app turns on. */
const CAL_S=6*60, CAL_E=22*60, CAL_SPAN=CAL_E-CAL_S;
const calPos = m => clamp((m-CAL_S)/CAL_SPAN*100,0,100);
/* x-fraction of the track -> a minute, snapped to the quarter hour */
const calMinAt = f => clamp(Math.round((CAL_S + clamp(f,0,1)*CAL_SPAN)/15)*15, CAL_S, CAL_E-15);

function dayStripHTML(k,{drop=false}={}){
  const evs=CAL.on(k);
  const timed=evs.filter(e=>!e.allDay), allday=evs.filter(e=>e.allDay);
  let ticks=''; for(let h=6;h<=22;h+=2){
    ticks+=`<div class="hr" style="left:${calPos(h*60)}%"></div><div class="hrlbl" style="left:${calPos(h*60)}%">${fmtTime(h*60)}</div>`;}
  const lanes=timed.map(e=>{
    const l=calPos(e.start), w=Math.max(3,calPos(e.start+e.dur)-l);
    return `<div class="${e.stepId?'ev step':'ev'}" data-ev="${e.id}" style="left:${l}%;width:${w}%">${
      e.recur?'&#8635; ':''}${esc(e.title)}</div>`;}).join('');
  const now = k===today() ? `<div class="now" style="left:${calPos(nowMin())}%"></div>` : '';
  const L=loadState(k);
  return `<div class="strip">
    <div class="lbl"><span>Calendar</span>
      <span class="tiny ${L.over?'overtxt':'muted'}">${hrs(L.mins)} of a ${hrs(L.budget)} day${
        L.over?' — over by '+hrs(L.mins-L.budget):''}</span></div>
    ${loadBar(k,{always:true})}
    <div class="track${drop?' droppable':''}"${drop?' data-caldrop="1"':''}>${ticks}${lanes}${now}<div class="dropline"></div></div>
    ${allday.length?`<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">${allday.map(e=>
      `<span class="evchip ${e.stepId?'step':''}" data-ev="${e.id}">${e.recur?'&#8635; ':''}${esc(e.title)}</span>`).join('')}</div>`:''}
  </div>`;
}

/* ================= DAY ================= */
function viewDay(){
  const k=DB.meta.cursor;
  const isToday = k===today();
  let items = itemsOn(k);
  if(isToday){
    items = items.concat(overdueItems());
    // plain tasks with no slot always live in the matrix — they have nowhere else to be
    items = items.concat(activeItems().filter(i=>!i.dateKey && i.goal.type==='task'));
  }
  const seen=new Set(); items=items.filter(i=>!seen.has(i.step.id)&&seen.add(i.step.id));

  const quads = Object.keys(QUAD).map(q=>{
    const list=items.filter(i=>i.quadrant===q);
    return `<div class="quad" data-quad="${q}">
      <h3><span class="dot" style="background:${QUAD[q].c}"></span>${QUAD[q].n}
        <span class="sub">${QUAD[q].ax}</span><span class="n">${list.length}</span></h3>
      <div class="items">${ list.length?list.map(i=>itemCard(i)).join('')
        :'<div class="empty">nothing here</div>' }</div></div>`;}).join('');

  const tray = unscheduledItems();
  const trayHtml = tray.length ? `<div class="strip" style="margin-top:14px">
      <div class="lbl"><span>Not on the calendar yet &mdash; ${tray.length} next step${tray.length>1?'s':''}</span>
        <span class="tiny muted">if it isn't scheduled, it isn't real</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px">
        ${tray.map(i=>itemCard(i)).join('')}</div></div>` : '';

  return `<div class="viewhead">
      <h2>${isToday?'Today':fmtDate(k)}</h2>
      <span class="sub">${fmtFull(k)}</span>
      <div class="spacer" style="flex:1"></div>
      <div class="nav">
        <button class="btn sm" data-nav="-1">&larr;</button>
        <button class="btn sm" data-nav="0">Today</button>
        <button class="btn sm" data-nav="1">&rarr;</button>
        <button class="btn sm" data-act="newEvent">+ Event</button>
      </div></div>
    ${dayStripHTML(k,{drop:true})}
    <div class="axis"><div>&larr; urgent</div><div>not urgent &rarr;</div></div>
    <div class="matrix">${quads}</div>
    ${trayHtml}`;
}

/* ================= LIST =================
   Day, Week and Quarter are all altitudes over a calendar. This one isn't — it's the
   flat answer to "what have I actually got on", one row per goal, filtered by type.
   It reads the same state as everything else and adds no new concepts: the row shows
   the goal's live step, its slot and its checklist, so anything you can see here you
   can act on here. */
const listHidden = ()=> new Set((DB.meta.listHidden||[]).filter(x=>!!TYPE[x]));

/* what a goal is waiting on, in one phrase — the same conditions signals() uses */
function goalState(g){
  const live=g.threads.filter(t=>t.status!=='done');
  const blocked=live.find(t=>t.status==='blocked');
  // a blocked thread still has a step — it just can't move. Report both.
  if(blocked) return {k:'blocked', sev:'warn', text:'waiting on '+(blocked.blockedOn||'someone'),
                      thread:blocked, step:currentStep(blocked)};
  if(live.length && live.every(t=>t.status==='dormant'))
    return {k:'dormant', sev:'mute', text:g.trigger?('until '+g.trigger):'dormant'};
  const t=live.find(x=>x.status!=='dormant');
  if(!t) return {k:'dormant', sev:'mute', text:'dormant'};
  if(t.needsBranch) return {k:'branch', sev:'hard', text:'branch unresolved', thread:t};
  const s=currentStep(t);
  if(!s) return {k:'nostep', sev:'hard', text:'no next step', thread:t};
  if(hushed(g,t)) return {k:'hushed', sev:'mute', text:'gone quiet', thread:t, step:s};
  const ev=s.eventId?eventById(s.eventId):null;
  if(!ev && g.type!=='task') return {k:'unscheduled', sev:'warn', text:'unscheduled', thread:t, step:s};
  if(ev && ev.dateKey<today()) return {k:'slipped', sev:'hard', text:'slipped '+daysBetween(ev.dateKey,today())+'d', thread:t, step:s, ev};
  return {k:'ok', sev:'ok', text:ev?relDays(daysBetween(today(),ev.dateKey)):'', thread:t, step:s, ev};
}
const STATE_ORDER={hard:0, warn:1, ok:2, mute:3};

function viewList(){
  const hidden=listHidden();
  const archive=!!DB.meta.listDone;
  const all= archive ? doneGoals() : liveGoals();
  const counts={}; for(const g of all) counts[g.type]=(counts[g.type]||0)+1;

  const rows = archive
    ? all.filter(g=>!hidden.has(g.type)).map(g=>({g, st:null}))
    : all.filter(g=>!hidden.has(g.type))
        .map(g=>({g, st:goalState(g)}))
        .sort((a,b)=> STATE_ORDER[a.st.sev]-STATE_ORDER[b.st.sev]
          || (a.st.ev?a.st.ev.dateKey:'9999').localeCompare(b.st.ev?b.st.ev.dateKey:'9999')
          || a.g.title.localeCompare(b.g.title));

  const toggles=Object.keys(TYPE).map(k=>{
    const n=counts[k]||0, off=hidden.has(k);
    // reuse the quarter view's band palette so a type looks the same wherever it appears
    return `<button class="ltog ${TYPE[k].color||''} ${off?'off':''} ${n?'':'empty'}" data-ltype="${k}"
      aria-pressed="${!off}" title="${off?'Show':'Hide'} ${TYPE[k].label.toLowerCase()}">
      <span class="sw"></span>${TYPE[k].label}<span class="n">${n}</span></button>`;
  }).join('');

  const attention = archive ? 0 : rows.filter(r=>r.st.sev==='hard'||r.st.sev==='warn').length;

  const archiveBody = rows.map(({g})=>{
    const steps=g.threads.reduce((n,t)=>n+t.steps.filter(s=>s.done).length,0);
    return `<div class="lrow mute" data-goal="${g.id}">
      <span></span>
      <span class="ltype">${TYPE[g.type].label}</span>
      <span class="lttl done">${esc(g.title)}</span>
      <span class="lstep">${steps} step${steps===1?'':'s'} done${g.why?' · '+esc(g.why):''}</span>
      <span class="lstate">${g.doneAt?fmtDateY(dkey(new Date(g.doneAt))):'—'}</span>
      <button class="btn sm" data-reopen="${g.id}">reopen</button>
    </div>`;}).join('');

  const body = archive
    ? (rows.length ? archiveBody
       : `<div class="lempty">${hidden.size?'Every type is switched off.'
          :'Nothing finished yet. Completed goals are kept here rather than disappearing.'}</div>`)
    : rows.length ? rows.map(({g,st})=>{
    const s=st.step, p=s?subProgress(s):{any:false};
    const open=s&&CARDSUBS.has(s.id);
    // only a row with a live step can be dragged — there'd be nothing to schedule
    const drag = s ? ` data-step="${s.id}" data-thread="${st.thread.id}"` : '';
    return `<div class="lrow ${st.sev} ${s?'draggable':''}" data-goal="${g.id}"${drag}>
      ${ s ? '<span class="grip" title="Drag onto the calendar strip to schedule">&#8942;&#8942;</span>' : '<span></span>' }
      <span class="ltype">${TYPE[g.type].label}</span>
      <span class="lttl">${esc(g.title)}</span>
      <span class="lstep">${ s ? esc(s.title)
        : st.k==='dormant' ? '<span class="muted">&mdash;</span>'
        : '<span class="overtxt">needs a next step</span>' }</span>
      <span class="lstate ${st.sev}">${esc(st.text)}</span>
      ${ p.any ? `<span class="pill tiny subpill ${p.done===p.total?'full':''}" data-act="subs" data-step="${s.id}"
           title="${open?'Hide':'Show'} subtasks">${p.done}/${p.total} ${open?'&#9650;':'&#9660;'}</span>`
        : '<span></span>' }
      ${ open ? `<div class="lsubs">${subs(s).map(x=>
          `<div class="subline ${x.done?'done':''}" data-step="${s.id}" data-sub="${x.id}" data-thread="${st.thread.id}" data-goal="${g.id}">
             <span class="subchk ${x.done?'on':''}" data-act="sub" data-step="${s.id}" data-sub="${x.id}"
               data-goal="${g.id}" data-thread="${st.thread.id}" role="checkbox" aria-checked="${x.done}" tabindex="0">${x.done?'&#10003;':''}</span>
             <span class="x">${esc(x.title)}</span><span class="grip subgrip" title="Drag onto the calendar to schedule this step">&#8942;&#8942;</span></div>`).join('')}</div>` : '' }
    </div>`;
  }).join('')
  : `<div class="lempty">${hidden.size?'Every type is switched off.':'Nothing active. Capture something.'}</div>`;

  const k=DB.meta.cursor;
  const nDone=DB.goals.filter(g=>g.status==='done').length;
  return `<div class="viewhead">
      <h2>${archive?'Completed':'Everything'}</h2>
      <span class="sub">${rows.length} of ${all.length} goal${all.length===1?'':'s'}${
        attention?` &middot; <span class="overtxt">${attention} need${attention===1?'s':''} attention</span>`:''}</span>
      <div class="spacer" style="flex:1"></div>
      <div class="nav">${hidden.size?'<button class="btn sm" data-ltype="*">Show all types</button>':''}
        ${archive?'':`<button class="btn sm" data-nav="-1">&larr;</button>
        <button class="btn sm" data-nav="0">Today</button>
        <button class="btn sm" data-nav="1">&rarr;</button>`}
      </div>
    </div>
    ${ archive ? '' : `<div class="lbl striplbl"><span>${k===today()?'Today':fmtFull(k)}</span>
      <span class="tiny muted">drag a row onto the strip to schedule it</span></div>
    ${dayStripHTML(k,{drop:true})}` }
    <div class="ltogs">${toggles}
      <button class="ltog done ${archive?'':'off'}" data-listdone="1" aria-pressed="${archive}"
        title="${archive?'Back to live goals':'Show completed goals'}">
        <span class="sw"></span>${archive?'Live goals':'Completed'}<span class="n">${archive?liveGoals().length:nDone}</span></button>
    </div>
    <div class="lrows">${body}</div>`;
}

/* ================= WEEK ================= */
function viewWeek(){
  const ws=startOfWeek(DB.meta.cursor);
  const cols=[];
  for(let i=0;i<7;i++){
    const k=addDays(ws,i);
    const evs=CAL.on(k);
    const timed=evs.filter(e=>!e.allDay);
    const untimedItems = itemsOn(k).filter(i=>!i.ev||i.ev.allDay);
    const untimedEvents = evs.filter(e=>e.allDay && !e.stepId);
    const load=CAL.loadOn(k);
    cols.push(`<div class="daycol ${k===today()?'today':''}" data-day="${k}" data-daydrop="1">
      <h4><span>${fmtDay(k)}</span><span class="d">${parseKey(k).getDate()}</span></h4>
      <div class="sect">
        <div class="sl">Calendar${load?' · '+hrs(load):''}${loadState(k).over?' <span class="overtxt">over</span>':''}</div>
        ${loadBar(k)}
        ${ timed.length ? timed.map(e=>`<div class="evchip ${e.stepId?'step':''}" data-ev="${e.id}">
             <span class="t">${fmtTime(e.start)}</span>${e.recur?'&#8635; ':''}${esc(e.title)}</div>`).join('')
          : '<div class="overflow">&mdash;</div>' }
      </div>
      <div class="sect">
        <div class="sl">Tasks</div>
        ${ (untimedItems.length+untimedEvents.length) ? [
             ...untimedItems.map(i=>`<div class="tchip ${i.step.done?'done':''}" data-step="${i.step.id}" data-thread="${i.thread.id}" data-goal="${i.goal.id}">
                 <span class="dot" style="background:${QUAD[i.quadrant].c}"></span><span class="x">${esc(i.step.title)}</span></div>`),
             ...untimedEvents.map(e=>`<div class="tchip" data-ev="${e.id}"><span class="dot" style="background:var(--accent)"></span><span class="x">${esc(e.title)}</span></div>`)
           ].join('') : '<div class="overflow">&mdash;</div>' }
      </div></div>`);
  }
  const tray=unscheduledItems();
  return `<div class="viewhead">
      <h2>Week of ${fmtDate(ws)}</h2>
      <span class="sub">${Math.round(CAL.loadWeek(ws)/60*10)/10}h booked across the week</span>
      <div class="spacer" style="flex:1"></div>
      <div class="nav">
        <button class="btn sm" data-nav="-7">&larr;</button>
        <button class="btn sm" data-nav="0">This week</button>
        <button class="btn sm" data-nav="7">&rarr;</button>
      </div></div>
    <div class="weekgrid">${cols.join('')}</div>
    ${ tray.length?`<div class="strip" style="margin-top:14px">
        <div class="lbl"><span>Unscheduled next steps &mdash; ${tray.length}</span></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px">
          ${tray.map(i=>itemCard(i)).join('')}</div></div>`:'' }
    ${viewBudget()}`;
}

/* ---------------- weekly money budget ---------------- */
function budgetBarHTML(){
  const B=budgetState(), cats=budget().cats||[];
  const segs=cats.map((c,i)=>{
    const w=B.pct(c);
    if(w<=0) return '';
    return `<i data-cat="${c.id}" style="width:${w}%;background:${catColour(i)}"
       title="${esc(c.name)} — ${money(+c.amount||0)}${B.weekly>0?' · '+Math.round(B.share(c))+'% of the budget':''}"></i>`;
  }).join('');
  const restW = B.basis>0 ? Math.max(0,(B.basis-B.allocated)/B.basis*100) : 100;
  const rest = restW>0.01 ? `<i class="rest" style="width:${restW}%"></i>` : '';
  // when allocation exceeds the budget, the bar scales to the allocation and the
  // budget becomes a line across it — showing the overshoot rather than clipping it
  const line = B.over ? `<u style="left:${B.weekly/B.basis*100}%"></u>` : '';
  return `<div class="bbar ${B.over?'over':''}">${segs}${rest}${line}</div>`;
}
function budgetSummaryHTML(){
  const B=budgetState();
  if(B.unset) return `<span class="tiny muted">Set a weekly amount to see each category as a share of it.</span>`;
  return `<span class="tiny ${B.over?'overtxt':'muted'}">${money(B.allocated)} allocated of ${money(B.weekly)}
    &middot; ${B.over?money(-B.left)+' over':money(B.left)+' unallocated'}</span>`;
}
function viewBudget(){
  const b=budget(), B=budgetState(), cats=b.cats||[];
  const fundable=fundableGoals();

  const rows = cats.map((c,i)=>{
    const p=catProjection(c);
    let note='';
    if(c.goalId && !p) note=`<span class="bnote warn">linked goal has no money target</span>`;
    else if(p && p.done) note=`<span class="bnote good">target reached</span>`;
    else if(p && p.weeks) note=`<span class="bnote">${money(+c.amount)}/wk clears ${money(p.remaining)} in
        ${p.weeks} week${p.weeks>1?'s':''} &middot; ${fmtDateY(p.date)}${
        p.lateDays>0?` <span class="overtxt">${p.lateDays}d past the deadline</span>`:
        p.lateDays!=null?' <span class="good">before the deadline</span>':''}</span>`;
    else if(p && p.needed) note=`<span class="bnote">needs ${money(p.needed)}/wk to hit the deadline</span>`;
    else if(p) note=`<span class="bnote">${money(p.remaining)} still to go</span>`;

    return `<div class="brow" data-cat="${c.id}">
      <span class="bsw" style="background:${catColour(i)}"></span>
      <input class="bname" type="text" value="${esc(c.name)}" placeholder="Category" aria-label="Category name">
      <div class="bamtwrap"><span>$</span><input class="bamt" type="number" min="0" step="1"
        value="${+c.amount||0}" aria-label="Amount for ${esc(c.name)}"></div>
      <span class="bpct">${B.weekly>0||B.allocated>0?Math.round(B.share(c))+'%':'—'}</span>
      <select class="bgoal" aria-label="Link to a goal">
        <option value="">— no goal —</option>
        ${fundable.map(g=>`<option value="${g.id}" ${g.id===c.goalId?'selected':''}>${esc(shortName(g))}</option>`).join('')}
      </select>
      ${c.goalId&&p&&!p.done?`<button class="btn sm" data-bud="log" data-cat="${c.id}" title="Add this to the goal and close out its current contribution step">Log</button>`:''}
      <button class="btn ghost sm bdel" data-bud="del" data-cat="${c.id}" title="Remove category">&times;</button>
      ${note}
    </div>`;
  }).join('');

  return `<div class="strip budget" style="margin-top:14px">
    <div class="lbl">
      <span>Weekly budget</span>
      <span class="bsum">${budgetSummaryHTML()}</span>
      <span class="spacer" style="flex:1"></span>
      <span class="bwrap tiny">Budget <span>$</span><input class="bweekly" type="number" min="0" step="1"
        value="${B.weekly||''}" placeholder="0" aria-label="Weekly budget"></span>
    </div>
    ${budgetBarHTML()}
    <div class="brows">${rows||'<div class="tiny muted" style="padding:6px 2px">No categories yet.</div>'}</div>
    <button class="btn sm" data-bud="add" style="margin-top:8px">+ Category</button>
    ${cats.length&&fundable.length?'':`<div class="tiny muted" style="margin-top:8px">${
      fundable.length?'':'Threshold-type goals (a money target) can be linked to a category once you have one.'}</div>`}
  </div>`;
}
/* Live feedback while typing, without re-rendering the view out from under the caret.
   Only the bar, the running total and the percentages change on input; the DB write
   happens on change (blur), so one edit is one undo step. */
function paintBudget(){
  const v=$('#view'); if(!v) return;
  const wrap=$('.budget',v); if(!wrap) return;
  const weekly=+($('.bweekly',wrap)||{}).value||0;
  const live=$$('.brow',wrap).map(r=>({
    id:r.dataset.cat,
    name:$('.bname',r).value,
    amount:+$('.bamt',r).value||0,
    goalId:($('.bgoal',r)||{}).value||null
  }));
  const allocated=live.reduce((n,c)=>n+c.amount,0);
  const basis = weekly>0 ? Math.max(weekly,allocated) : allocated;
  const over = weekly>0 && allocated>weekly;

  const bar=$('.bbar',wrap);
  bar.classList.toggle('over',over);
  const restW = basis>0 ? Math.max(0,(basis-allocated)/basis*100) : 100;
  bar.innerHTML = live.map((c,i)=> c.amount>0
      ? `<i data-cat="${c.id}" style="width:${c.amount/basis*100}%;background:${catColour(i)}"></i>` : '').join('')
    + (restW>0.01?`<i class="rest" style="width:${restW}%"></i>`:'')
    + (over?`<u style="left:${weekly/basis*100}%"></u>`:'');

  $('.bsum',wrap).innerHTML = weekly>0
    ? `<span class="tiny ${over?'overtxt':'muted'}">${money(allocated)} allocated of ${money(weekly)}
       &middot; ${over?money(allocated-weekly)+' over':money(weekly-allocated)+' unallocated'}</span>`
    : `<span class="tiny muted">Set a weekly amount to see each category as a share of it.</span>`;

  $$('.brow',wrap).forEach((r,i)=>{
    const denom = weekly>0?weekly:allocated;
    $('.bpct',r).textContent = denom>0 ? Math.round(live[i].amount/denom*100)+'%' : '—';
  });
}
/* Fold the panel's DOM back into the DB. Deliberately does NOT save() — callers that
   also mutate (add/remove a category) must do their mutation first, or the save here
   would commit the pending undo checkpoint before the real change had happened, and
   the action would silently not be undoable. */
function commitBudget(){
  const wrap=$('.budget',$('#view')); if(!wrap) return;
  const b=budget();
  b.weekly = +($('.bweekly',wrap)||{}).value||0;
  b.cats = $$('.brow',wrap).map(r=>({
    id:r.dataset.cat||uid(),
    name:$('.bname',r).value.trim()||'Untitled',
    amount:+$('.bamt',r).value||0,
    goalId:($('.bgoal',r)||{}).value||null
  }));
}
function budAct(a,btn){
  const b=budget();
  if(a==='add'){
    checkpoint('that new category');
    commitBudget();                                  // keep whatever was typed but not yet blurred
    b.cats.push({id:uid(), name:'', amount:0, goalId:null});
    save(); render();
    const rows=$$('.brow'); const last=rows[rows.length-1];
    if(last) $('.bname',last).focus();
    return;
  }
  if(a==='del'){
    checkpoint('removing that category');
    commitBudget();
    b.cats=(b.cats||[]).filter(c=>c.id!==btn.dataset.cat);
    save(); render(); return;
  }
  // the amount input has already blurred (and so committed) by the time this click lands
  if(a==='log'){ logContribution(btn.dataset.cat); return; }
}

/* ================= QUARTER ================= */
function quarterRange(k){
  const d=parseKey(k); const qStart=new Date(d.getFullYear(), Math.floor(d.getMonth()/3)*3, 1);
  const from=startOfWeek(dkey(qStart));
  return {from, to:addDays(from, 13*7-1), weeks:13};
}
function viewQuarter(){
  const {from,to,weeks}=quarterRange(DB.meta.cursor);
  const total=daysBetween(from,to)+1;
  const x = k => clamp(daysBetween(from,k)/total*100,0,100);

  // week density
  const loads=[]; for(let w=0;w<weeks;w++){ const ws=addDays(from,w*7); loads.push({ws,mins:CAL.loadWeek(ws)}); }
  const max=Math.max(600, ...loads.map(l=>l.mins));
  const bars=loads.map((l,i)=>{
    const h=Math.round(l.mins/max*100);
    const cls = l.mins>max*.75?'hot': l.mins>max*.5?'heavy':'';
    const cur = today()>=l.ws && today()<addDays(l.ws,7) ? 'cur':'';
    return `<div class="dbar ${cls} ${cur}" data-jump="${l.ws}" title="${Math.round(l.mins/60*10)/10}h booked">
      <div class="b" style="height:${Math.max(2,h)}%"></div><div class="wk">${parseKey(l.ws).getMonth()+1}/${parseKey(l.ws).getDate()}</div></div>`;
  }).join('');

  let ticks='',grid='';
  for(let w=0;w<weeks;w+=2){ const k=addDays(from,w*7);
    ticks+=`<span style="left:${x(k)}%">${fmtDate(k)}</span>`;
    grid+=`<div class="grid" style="left:${x(k)}%"></div>`; }

  const rows = liveGoals().filter(g=>g.type!=='task').map(g=>{
    const spec=TYPE[g.type];
    // band window
    let s=dkey(new Date(g.createdAt)); if(s<from)s=from;
    let e = g.smart.deadline || null;
    if(!e){ e = (g.type==='habit'||g.type==='maintenance'||g.type==='pipeline'||g.type==='contingent') ? to : addDays(s,56); }
    if(e>to)e=to; if(e<s)e=s;
    const left=x(s), w=Math.max(2,x(e)-left);
    const prog = g.smart.target ? clamp((g.smart.current||0)/g.smart.target*100,0,100)
               : (g.type==='milestone'? clamp((doneCount(g)+partialCount(g))/(doneCount(g)+g.backlog.length+1)*100,0,100) : 0);

    // next step across threads
    const act=g.threads.filter(t=>t.status!=='done');
    const nexts=act.map(t=>{
      const st=currentStep(t);
      if(t.status==='blocked') return `<b>waiting on ${esc(t.blockedOn||'?')}</b>`;
      if(t.status==='dormant') return `<b>dormant</b> until ${esc(g.trigger||'trigger undefined')}`;
      if(!st) return `<b style="color:var(--bad)">no next step</b>`;
      const ev=st.eventId?eventById(st.eventId):null;
      return `<b>${esc(st.title)}</b>${ev?` <span class="mono tiny">${fmtDate(ev.dateKey)}</span>`:` <span class="tiny" style="color:var(--warn)">unscheduled</span>`}`;
    });
    const dots = g.threads.flatMap(t=>t.steps.filter(st=>st.eventId).map(st=>eventById(st.eventId)))
      .filter(ev=>ev&&ev.dateKey>=from&&ev.dateKey<=to)
      .map(ev=>`<div class="stepdot" style="left:${x(ev.dateKey)}%;${ev.done?'background:var(--dim2)':''}"></div>`).join('');
    const dl = g.smart.deadline&&g.smart.deadline>=from&&g.smart.deadline<=to
      ? `<div class="today-line" style="left:${x(g.smart.deadline)}%;background:var(--warn);opacity:.55"></div>`:'';

    return `<div class="rmrow">
      <div class="rmleft" data-goal="${g.id}">
        <div class="n"><span class="dot" style="background:${QUAD[bestQuadrant(g)].c}"></span>${esc(shortName(g))}
          <span class="pill">${spec.label}</span></div>
        ${nexts.map(n=>`<div class="ns"><span class="muted">&rsaquo;</span><span>${n}</span></div>`).join('')}
      </div>
      <div class="rmtrack">${grid}
        <div class="band ${spec.color}" data-goal="${g.id}" style="left:${left}%;width:${w}%">
          ${prog?`<div class="prog" style="width:${prog}%"></div>`:''}
          <span style="position:relative">${g.smart.target?money(g.smart.current||0)+' / '+money(g.smart.target)
            : g.smart.deadline?fmtDate(g.smart.deadline):spec.label}</span></div>
        ${dots}${dl}
        ${today()>=from&&today()<=to?`<div class="today-line" style="left:${x(today())}%"></div>`:''}
      </div></div>`;
  }).join('');

  return `<div class="viewhead">
      <h2>Quarter</h2><span class="sub">${fmtDate(from)} &ndash; ${fmtDate(to)}</span>
      <div class="spacer" style="flex:1"></div>
      <div class="nav">
        <button class="btn sm" data-nav="-91">&larr;</button>
        <button class="btn sm" data-nav="0">Now</button>
        <button class="btn sm" data-nav="91">&rarr;</button>
      </div></div>
    <div class="qwrap">
      <div class="density">
        <div class="lbl tiny muted" style="text-transform:uppercase;letter-spacing:.06em">How booked each week already is</div>
        <div class="dbars">${bars}</div>
      </div>
      <div class="roadmap">
        <div class="rmhead"><div class="l">Goal &amp; current next step</div><div class="rmticks">${ticks}</div></div>
        ${rows || '<div style="padding:24px;text-align:center" class="muted">No goals yet. Capture one up top.</div>'}
      </div>
    </div>`;
}
function doneCount(g){ return g.threads.reduce((n,t)=>n+t.steps.filter(s=>s.done).length,0); }
/* a half-ticked checklist is real progress; count it as a fraction of a step so the
   quarter bar moves as subtasks close rather than jumping only when a step does */
function partialCount(g){
  return g.threads.reduce((n,t)=>{
    const s=currentStep(t); const p=s?subProgress(s):null;
    return n + (p&&p.any ? p.frac : 0);
  },0);
}
function bestQuadrant(g){
  const s=g.threads.map(currentStep).filter(Boolean);
  for(const q of ['q1','q2','q3','q4']) if(s.some(x=>x.quadrant===q)) return q;
  return 'q4';
}

/* ===================== [SECTION: CHECKIN] ===================== */
/* A guided flow, not a dashboard. It walks you card by card and will not let a
   thread stay silent: every quiet/blocked/stepless thread has to be answered. */
let CK=null;
let CKROW=null;   // an inline field open on the current wizard card, in place of a prompt

/* A ritual survives when its cost is known and small. An unbounded queue means the
   session is 3 cards one week and 30 the next, and the 30-card week is the one that
   doesn't happen. Cap the debt cards; the rest are still in the ribbon, still
   resolvable inline, and still here next week. */
const CK_MAX=6;

function startCheckin(){
  const ag=checkinAgenda();
  const debt=[];
  ag.gates .forEach(x=>debt.push({t:'gate',    goal:x.goal, gate:x.gate}));
  ag.branch.forEach(x=>debt.push({t:'branch',  goal:x.goal, thread:x.thread}));
  ag.nostep.forEach(x=>debt.push({t:'nostep',  goal:x.goal, thread:x.thread}));
  ag.blocked.forEach(x=>debt.push({t:'blocked',goal:x.goal, thread:x.thread}));
  ag.quiet .forEach(x=>debt.push({t:'quiet',   goal:x.goal, thread:x.thread, step:x.step, days:x.days}));

  const shown=debt.slice(0,CK_MAX), deferred=debt.length-shown.length;
  const q=[{t:'intro',ag,deferred,total:debt.length}, ...shown, {t:'schedule'}, {t:'done'}];

  // resume where you left off, but only within the same day — after that the queue
  // has moved on and picking up at card 4 of a different list would be nonsense
  const p=DB.meta.checkinProgress;
  const resume = p && p.dateKey===today() && p.i>0 && p.i<q.length ? p : null;
