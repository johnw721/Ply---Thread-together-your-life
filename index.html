<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ply &mdash; thread your next move</title>
<style>
:root{
  --bg:#0e1014; --panel:#161920; --panel2:#1c2028; --panel3:#232833;
  --line:#2a303c; --line2:#39404f;
  --text:#e7eaf1; --dim:#9aa3b5; --dim2:#868fa3;   /* both clear 4.5:1 on every surface */
  --faint:#636c7e;                                 /* decoration only — never load-bearing text */
  --accent:#6ea8fe; --accent-dim:#2b3d5c;
  --q1:#ef5f5f; --q2:#4ec9a0; --q3:#e8b04b; --q4:#7f8899;
  --q1-bg:#2a1719; --q2-bg:#12251f; --q3-bg:#28211296; --q4-bg:#1b1e25;
  --warn:#e8b04b; --bad:#ef5f5f; --good:#4ec9a0;
  --r:10px; --r2:6px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2b313d;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- primitives ---------- */
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:6px 11px;color:var(--text);transition:.12s}
.btn:hover{background:var(--panel3);border-color:var(--line2)}
.btn.primary{background:var(--accent);color:#0b1220;border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:none;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{color:var(--text);background:var(--panel2)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad);border-color:#3d2226}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);padding:7px 9px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
textarea{resize:vertical;min-height:60px}
label.fld{display:block;margin-bottom:10px}
label.fld > span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.row{display:flex;gap:10px}
.row > *{flex:1}
.muted{color:var(--dim)}
.tiny{font-size:11px}
.mono{font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11px;
  background:var(--panel3);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:99px;flex:none;display:inline-block}
.hidden{display:none !important}

/* ---------- top bar ---------- */
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:var(--panel);flex:none}
.brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .mk{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,var(--q2),var(--accent))}
.zoombar{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.zoombar button{padding:5px 14px;border-radius:6px;color:var(--dim);font-size:13px;font-weight:500}
.zoombar button.on{background:var(--panel3);color:var(--text);box-shadow:0 1px 0 #0006}
.capture{flex:1;max-width:520px;position:relative}
.capture input{padding-right:96px}
.capture .hint{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:11px}
.spacer{flex:1}

/* ---------- signal ribbon ---------- */
#signals{flex:none;display:block;padding:8px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(#171410,#14161b)}
#signals.empty{display:none}
.sigrow{display:flex;gap:8px;overflow-x:auto;align-items:center}
.sig{display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:99px;font-size:12px;white-space:nowrap;
  border:1px solid #4a3a1c;background:#241d10;color:#f0d3a0;cursor:pointer;flex:none}
.sig:hover{border-color:var(--warn)}
.sig.hard{border-color:#4d2429;background:#241416;color:#f3b7ba}
.sig.open{border-color:var(--warn);background:#2f2614}
.sig b{font-weight:600;color:#fff}
.sig .caret{color:var(--faint);font-size:10px}
.sig .zz{color:var(--dim);font-size:12px;line-height:1;opacity:.7}
.sig .zz:hover{opacity:1;color:var(--text)}
.sig.more{border-style:dashed;border-color:var(--line2);background:none;color:var(--dim)}
/* expanded group */
.sigopen{margin-top:8px;border:1px solid var(--line);border-radius:var(--r2);background:#0f1216;overflow:hidden}
.sigopen .srow{display:flex;align-items:center;gap:10px;padding:6px 10px;font-size:12px;cursor:pointer;
  border-top:1px solid var(--line)}
.sigopen .srow:first-child{border-top:none}
.sigopen .srow:hover{background:var(--panel2)}
.sigopen .srow b{font-weight:600;color:var(--text)}
.sigopen .srow .t{color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sigopen .srow .zz{color:var(--dim2);font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:99px;flex:none}
.sigopen .srow .zz:hover{color:var(--text);border-color:var(--line2)}
.sigopen .sfoot{display:flex;justify-content:flex-end;gap:8px;padding:6px 10px;border-top:1px solid var(--line);
  background:var(--panel);font-size:11.5px}
.sigopen .srow.on{background:var(--panel2)}
/* gone-quiet chips: present, but visually out of the way */
.sig.mute{border-color:var(--line);background:var(--panel);color:var(--dim)}
.sig.mute b{color:var(--dim)}
.sig.mute:hover{border-color:var(--line2)}
/* inline resolver */
.fixmark{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim2);
  border:1px solid var(--line2);border-radius:99px;padding:1px 6px}
.sig:hover .fixmark,.srow:hover .fixmark{color:var(--text);border-color:var(--accent)}
.sigfix{margin-top:8px;border:1px solid var(--accent-dim);border-radius:var(--r2);background:#0f1319;padding:9px 10px}
.fixhead{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:8px}
.fixhead b{color:var(--text)}
.fixrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.fixrow input[type=text]{flex:1;min-width:150px}
.fixrow input,.fixrow select{width:auto;padding:5px 8px;font-size:12.5px}
.fixrow .btn{flex:none}
.sigfix .tiny{margin-top:6px}
#btnUndo,#btnRedo{padding:5px 10px;font-size:15px;line-height:1}

/* ---------- drag handle + ghost ---------- */
.card .grip{flex:none;align-self:stretch;display:flex;align-items:center;color:var(--dim2);
  font-size:12px;letter-spacing:-3px;padding:0 4px 0 3px;margin:-9px -10px -9px 0;border-radius:0 var(--r) var(--r) 0;
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.card .grip:hover{color:var(--text);background:#ffffff08}
.card .grip:active{cursor:grabbing}
.card.dragging{opacity:.3}
body.dragging-on{cursor:grabbing;user-select:none;-webkit-user-select:none}
#dragGhost{position:fixed;z-index:300;pointer-events:none;margin:0;
  transform:translate(-50%,-50%) rotate(-1.5deg);box-shadow:0 14px 34px #000b;opacity:.95}
#dragGhost .grip{display:none}

/* ---------- capacity ---------- */
.loadbar{height:3px;border-radius:99px;background:#ffffff10;overflow:hidden;margin:5px 0}
.loadbar i{display:block;height:100%;background:var(--q2);border-radius:99px}
.loadbar.near i{background:var(--warn)}
.loadbar.over i{background:var(--bad)}
.overtxt{color:var(--bad)}
.learnlist{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:11.5px}
.learnlist>div{display:flex;gap:7px;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ---------- inline add rows, in place of prompt() ---------- */
.addrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.newin,.brif,.brthen,.blockwho,.schd,.schtm{background:none;border:1px dashed var(--line2);border-radius:5px;
  padding:3px 7px;font-size:12px;color:var(--text);width:auto;flex:1;min-width:110px;outline:none}
.newin::placeholder,.brif::placeholder,.brthen::placeholder,.blockwho::placeholder{color:var(--dim2)}
.newin:hover,.brif:hover,.brthen:hover,.blockwho:hover{border-color:var(--dim2)}
.newin:focus,.brif:focus,.brthen:focus,.blockwho:focus,.schd:focus,.schtm:focus{
  border-style:solid;border-color:var(--accent);background:var(--bg);box-shadow:0 0 0 2px var(--accent-dim)}
.schd,.schtm{flex:none;min-width:0;border-style:solid;border-color:var(--line)}
.addrow .btn{flex:none}
.sublist .addrow{margin-top:3px}
/* a button waiting for its second click */
.btn.armed{background:var(--bad);color:#180a0b;border-color:transparent;font-weight:600}
.btn.armed:hover{filter:brightness(1.08)}

/* ---------- list view ---------- */
.ltogs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ltog{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 9px;border-radius:99px;
  border:1px solid var(--line);background:var(--panel);color:var(--text)}
.ltog:hover{border-color:var(--line2)}
.ltog .sw{width:7px;height:7px;border-radius:99px;background:var(--dim2)}
.ltog.deadline .sw{background:#f2b9bd} .ltog.milestone .sw{background:#bcd8f2}
.ltog.habit .sw{background:#a9e5c8}    .ltog.threshold .sw{background:#efd7a1}
.ltog.pipeline .sw{background:#d3c4f2} .ltog.maintenance .sw{background:#a6dbe5}
.ltog.contingent .sw{background:#8b94a7}.ltog.decision .sw{background:#e2bce9}
.wkday{margin-bottom:9px}
.wkday:last-child{margin-bottom:0}
.wkd{display:flex;gap:8px;align-items:baseline;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dim2);border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:3px}
.wkd .tiny{margin-left:auto;text-transform:none;letter-spacing:0}
.ltog.done{margin-left:auto;border-color:var(--line2)}
.ltog.done .sw{background:var(--good)}
.lttl.done{text-decoration:line-through;text-decoration-color:var(--dim2)}
.lrow [data-reopen]{justify-self:end}
.ltog .n{color:var(--dim2);font-variant-numeric:tabular-nums}
.ltog.off{opacity:.45;background:none}
.ltog.off .sw{background:var(--dim2) !important}
.ltog.empty{opacity:.3}
.lrows{display:flex;flex-direction:column;gap:1px}
.lrow{display:grid;grid-template-columns:14px 92px minmax(110px,1.1fr) minmax(130px,1.4fr) 104px 60px;
  gap:10px;align-items:center;padding:7px 9px;border-radius:var(--r2);cursor:pointer;
  border:1px solid transparent;border-left:2px solid transparent;background:var(--panel)}
.lrow .grip{color:var(--dim2);font-size:12px;letter-spacing:-3px;cursor:grab;touch-action:none;
  user-select:none;-webkit-user-select:none;padding:0 2px}
.lrow .grip:hover{color:var(--text)}
.lrow.dragging{opacity:.3}
.striplbl{display:flex;justify-content:space-between;align-items:center;font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.striplbl .tiny{text-transform:none;letter-spacing:0}
/* where a dragged row would land */
.track.droppable.armed{box-shadow:inset 0 0 0 1px var(--accent)}
/* a week column lit up as a drop target */
.daycol.drop{outline:1.5px dashed var(--accent);outline-offset:-3px;background:var(--panel2)}
/* subtask lines drag too: the grip only appears when there's room for it */
.subline{position:relative}
.subgrip{opacity:0;color:var(--faint);font-size:12px;letter-spacing:-3px;padding:0 3px;
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;margin-left:auto}
.subline:hover .subgrip,.subgrip:focus-visible{opacity:1}
.subline.dragging{opacity:.3}
.dropline{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);display:none;pointer-events:none}
.dropline::after{content:attr(data-t);position:absolute;top:-17px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#0b1220;font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;white-space:nowrap}
.track.armed .dropline{display:block}
.lrow:hover{background:var(--panel2);border-color:var(--line)}
.lrow.hard{border-left-color:var(--bad)}
.lrow.warn{border-left-color:var(--warn)}
.lrow.mute{opacity:.55}
.lrow>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltype{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim2)}
.lttl{font-size:13px}
.lstep{font-size:12px;color:var(--dim)}
.lstate{font-size:11px;color:var(--dim2);text-align:right}
.lstate.hard{color:var(--bad)}
.lstate.warn{color:var(--warn)}
.lrow .subpill{justify-self:end}
.lsubs{grid-column:2/-1;display:flex;flex-direction:column;gap:2px;margin-top:5px;
  padding-left:10px;border-left:1px solid var(--line)}
.lempty{padding:26px;text-align:center;color:var(--dim2);font-size:13px}
@media (max-width:760px){
  .lrow{grid-template-columns:14px 1fr auto;gap:4px 8px}
  .lrow .grip{grid-row:1/3}
  .ltype{grid-row:1}.lstate{grid-row:1;text-align:right}
  .lttl{grid-column:2/-1}.lstep{grid-column:2/-1}
  .lrow .subpill{grid-column:2/-1;justify-self:start}
  .lsubs{grid-column:1/-1}
}

/* ---------- weekly money budget ---------- */
.budget .lbl{display:flex;align-items:center;gap:10px}
.bwrap{display:flex;align-items:center;gap:4px;text-transform:none;letter-spacing:0;color:var(--dim)}
.bwrap>span{color:var(--dim2)}
.bwrap input{width:96px;padding:4px 7px;font-size:12px;text-align:right}
.bbar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:#ffffff08;position:relative;margin-bottom:11px}
.bbar i{display:block;height:100%;transition:width .18s ease;cursor:pointer;border-right:1px solid var(--bg)}
.bbar i:hover{filter:brightness(1.2)}
.bbar i.rest{cursor:default;border:none;
  background:repeating-linear-gradient(135deg,#ffffff0d,#ffffff0d 5px,transparent 5px,transparent 10px)}
.bbar.over i.rest{display:none}
.bbar u{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);box-shadow:0 0 0 1px var(--bg)}
.brows{display:flex;flex-direction:column;gap:7px}
.brow{display:grid;grid-template-columns:10px minmax(90px,1fr) 104px 40px minmax(120px,190px) auto auto;
  gap:8px;align-items:center}
.bsw{width:10px;height:10px;border-radius:3px}
.brow input,.brow select{padding:5px 8px;font-size:12.5px}
.bamtwrap{display:flex;align-items:center;gap:3px}
.bamtwrap>span{color:var(--dim2);font-size:12px}
.bamtwrap input{width:100%;text-align:right}
.bpct{font-size:12px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.bnote{grid-column:2/-1;font-size:11px;color:var(--dim2);margin-top:-3px}
.bnote.warn{color:var(--warn)}
.good{color:var(--good)}
.bdel{font-size:15px;line-height:1;padding:3px 8px;color:var(--dim2)}
.bdel:hover{color:var(--bad)}
@media (max-width:760px){
  .brow{grid-template-columns:10px 1fr 92px 38px}
  .brow .bgoal{grid-column:2/-1}
  .brow .btn{grid-row:3}
  .bnote{grid-column:1/-1}
}

/* ---------- view frame ---------- */
main{flex:1;overflow:auto;position:relative}
#view{padding:16px;min-height:100%}
@keyframes zoomIn{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:none}}
@keyframes zoomOut{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:none}}
.zin{animation:zoomIn .22s cubic-bezier(.2,.7,.3,1)}
.zout{animation:zoomOut .22s cubic-bezier(.2,.7,.3,1)}
.viewhead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.viewhead h2{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.viewhead .sub{color:var(--dim);font-size:12px}
.nav{display:flex;gap:4px;align-items:center}

/* ---------- shared card language ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;
  display:flex;gap:8px;align-items:flex-start;transition:.12s;cursor:pointer;position:relative}
.card:hover{border-color:var(--line2);background:var(--panel2)}
.card .qbar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:var(--r) 0 0 var(--r)}
.card .body{flex:1;min-width:0}
.card .ttl{font-size:13px;line-height:1.3}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.card.done .ttl{text-decoration:line-through;color:var(--dim2)}
.chk{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line2);flex:none;margin-top:2px;
  display:grid;place-items:center;font-size:10px;color:#0b1220;transition:.12s}
.chk:hover{border-color:var(--q2)}
.chk.on{background:var(--q2);border-color:var(--q2)}
.goaltag{font-size:11px;color:var(--dim);display:inline-flex;align-items:center;gap:4px;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- DAY ---------- */
.strip{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:14px}
.strip .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center}
.track{position:relative;height:54px;background:var(--bg);border-radius:8px;border:1px solid var(--line);overflow:hidden}
.track .hr{position:absolute;top:0;bottom:0;border-left:1px solid #1e232c}
.track .hrlbl{position:absolute;bottom:2px;font-size:10px;color:var(--dim);transform:translateX(3px)}
.track .ev{position:absolute;top:6px;height:26px;background:var(--accent-dim);border:1px solid #40608f;border-radius:5px;
  font-size:11px;padding:3px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;color:#cfe0ff}
.track .ev:hover{background:#33507a}
.track .ev.step{background:#173427;border-color:#2f6a51;color:#a8e6c9}
.track .now{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:3;box-shadow:0 0 6px #ef5f5f80}

.matrix{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quad{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;
  min-height:190px;overflow:hidden}
.quad > h3{margin:0;padding:9px 11px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);letter-spacing:.01em}
.quad > h3 .n{margin-left:auto;color:var(--dim);font-weight:500;font-size:11px}
.quad > h3 .sub{color:var(--dim);font-weight:400;font-size:11px}
.quad .items{padding:8px;display:flex;flex-direction:column;gap:7px;flex:1;overflow:auto;max-height:44vh}
.quad .empty{color:var(--dim2);font-size:12px;padding:14px 4px;text-align:center}
.quad.drop{outline:1.5px dashed var(--accent);outline-offset:-4px}
.axis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.axis div{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim2);text-align:center}

/* ---------- WEEK ---------- */
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:start}
.daycol{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-height:320px;
  display:flex;flex-direction:column}
.daycol.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-dim)}
.daycol > h4{margin:0;padding:7px 9px;font-size:12px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:center;background:var(--panel2)}
.daycol > h4 .d{color:var(--dim);font-weight:400}
.daycol .sect{padding:7px;display:flex;flex-direction:column;gap:5px}
.daycol .sect + .sect{border-top:1px dashed var(--line)}
.sect .sl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);margin-bottom:1px}
.evchip{background:var(--accent-dim);border:1px solid #3c5a86;border-radius:5px;padding:4px 6px;font-size:11px;
  cursor:pointer;line-height:1.25}
.evchip:hover{background:#33507a}
.evchip.step{background:#163224;border-color:#2f6a51}
.evchip .t{font-family:var(--mono);font-size:11px;color:#a9c0e2;display:block}
.evchip.step .t{color:#8fd4b0}
.tchip{display:flex;gap:6px;align-items:flex-start;font-size:11.5px;padding:3px 5px;border-radius:5px;cursor:pointer;
  border:1px solid transparent;line-height:1.3}
.tchip:hover{background:var(--panel2);border-color:var(--line)}
.tchip .dot{margin-top:5px}
.tchip.done span.x{text-decoration:line-through;color:var(--dim2)}
.overflow{font-size:11px;color:var(--dim2);padding:2px 5px}

/* ---------- QUARTER ---------- */
.qwrap{display:flex;flex-direction:column;gap:14px}
.density{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.dbars{display:flex;gap:4px;align-items:flex-end;height:56px;margin-top:8px}
.dbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;cursor:pointer}
.dbar .b{width:100%;background:var(--accent-dim);border-radius:3px 3px 0 0;min-height:2px;transition:.12s}
.dbar:hover .b{background:var(--accent)}
.dbar .wk{font-size:10px;color:var(--dim);font-family:var(--mono)}
.dbar.cur .b{background:var(--accent)}
.dbar.heavy .b{background:#8a5a2b}
.dbar.hot .b{background:#a8452f}

.roadmap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rmhead{display:grid;grid-template-columns:290px 1fr;border-bottom:1px solid var(--line);background:var(--panel2)}
.rmhead .l{padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.rmticks{position:relative;height:100%}
.rmticks span{position:absolute;top:8px;font-size:11px;color:var(--dim2);transform:translateX(-50%);white-space:nowrap}
.rmrow{display:grid;grid-template-columns:290px 1fr;border-bottom:1px solid var(--line)}
.rmrow:last-child{border-bottom:none}
.rmrow:hover{background:#171b23}
.rmleft{padding:9px 12px;border-right:1px solid var(--line);cursor:pointer}
.rmleft .n{font-size:13px;font-weight:550;display:flex;align-items:center;gap:7px}
.rmleft .ns{font-size:11.5px;color:var(--dim);margin-top:4px;display:flex;gap:5px;align-items:flex-start}
.rmleft .ns b{font-weight:500;color:#b9c2d4}
.rmtrack{position:relative;min-height:56px}
.rmtrack .grid{position:absolute;top:0;bottom:0;border-left:1px solid #1c212a}
.band{position:absolute;top:12px;height:22px;border-radius:6px;display:flex;align-items:center;padding:0 8px;
  font-size:11px;overflow:hidden;white-space:nowrap;cursor:pointer;border:1px solid}
.band.deadline{background:#2c1d1f;border-color:#6c3339;color:#f2b9bd}
.band.milestone{background:#1a2733;border-color:#3a5f80;color:#bcd8f2}
.band.habit{background:#152a22;border-color:#2f6a51;color:#a9e5c8}
.band.threshold{background:#2a2415;border-color:#71592a;color:#efd7a1}
.band.pipeline{background:#241d31;border-color:#5b4785;color:#d3c4f2}
.band.maintenance{background:#16252a;border-color:#2f5f6a;color:#a6dbe5}
.band.contingent{background:#1c1f26;border-color:#39404f;color:#8b94a7;border-style:dashed}
.band.decision{background:#251c26;border-color:#6b4271;color:#e2bce9;border-style:dashed}
.band .prog{position:absolute;left:0;top:0;bottom:0;background:#ffffff14}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.7;z-index:2}
.stepdot{position:absolute;width:9px;height:9px;border-radius:99px;background:var(--q2);border:2px solid var(--panel);
  top:41px;transform:translateX(-50%);z-index:3}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:24px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(680px,100%);
  max-height:min(86vh,900px);display:flex;flex-direction:column;box-shadow:0 24px 70px #000b;animation:zoomIn .16s}
.modal.wide{width:min(860px,100%)}
.modal > h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px;display:flex;
  align-items:center;gap:10px}
.modal > h3 .x{margin-left:auto}
.mbody{padding:16px 18px;overflow:auto;flex:1}
.mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--panel2);
  border-radius:0 0 14px 14px}
.mfoot .spacer{flex:1}
.sec{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;background:var(--panel2)}
.sec > h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);
  display:flex;align-items:center;gap:8px}
.sec > h4 .spacer{flex:1}

/* thread cards in editor */
.thread{border:1px solid var(--line);border-radius:var(--r2);padding:10px;background:var(--panel);margin-bottom:9px}
.thread.blocked{border-color:#5a4a24;background:#1d1a13}
.thread.dormant{opacity:.6}
.thread .th{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.thread .th .nm{font-weight:600;font-size:13px}
.steplist{display:flex;flex-direction:column;gap:4px;margin-top:7px}
/* ---------- subtasks, inline rename, reorder ---------- */
input.edit{flex:1;min-width:0;background:none;border:1px solid transparent;border-radius:5px;
  padding:2px 5px;font-size:12px;width:auto;color:inherit}
input.edit:hover{border-color:var(--line)}
input.edit:focus{background:var(--bg);border-color:var(--accent);box-shadow:none}
.btn.ord{padding:2px 6px;font-size:10px;line-height:1.3;color:var(--dim2)}
.btn.ord:not(:disabled):hover{color:var(--text)}
.sublist{margin:2px 0 4px 16px;padding-left:9px;border-left:1px solid var(--line)}
.subline{display:flex;gap:7px;align-items:center;font-size:12px;padding:1px 0}
.subline.done .x,.subline.done input.edit{text-decoration:line-through;color:var(--dim2)}
.subchk{width:13px;height:13px;flex:none;border:1px solid var(--line2);border-radius:4px;cursor:pointer;
  display:grid;place-items:center;font-size:10px;color:var(--bg);line-height:1}
.subchk:hover{border-color:var(--q2)}
.subchk.on{background:var(--q2);border-color:var(--q2)}
.subchk:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.subfoot{display:flex;gap:9px;align-items:center;margin-top:5px}
.cardsubs{margin-top:6px;padding-top:5px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.cardsubs .subline{font-size:11.5px}
.cardsubs .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subpill{cursor:pointer;border-color:var(--line2)}
.subpill:hover{border-color:var(--accent);color:var(--text)}
.subpill.full{border-color:#2f6a51;color:var(--good)}
.stepline{display:flex;gap:7px;align-items:center;font-size:12px;padding:3px 5px;border-radius:5px}
.stepline.cur{background:#12251f;border:1px solid #2f6a51}
.stepline.hist{color:var(--dim2)}
.stepline .st{font-family:var(--mono);font-size:11px;color:var(--dim2)}

/* check-in wizard */
.wiz{display:flex;flex-direction:column;height:100%}
.wizsteps{display:flex;gap:6px;padding:12px 18px 0}
.wizsteps .s{flex:1;height:3px;border-radius:2px;background:var(--line)}
.wizsteps .s.on{background:var(--accent)}
.wizsteps .s.done{background:var(--q2)}
.wizq{font-size:15px;font-weight:600;margin:0 0 4px}
.wizsub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
.subject{border:1px solid var(--line2);border-radius:var(--r);padding:12px;background:var(--panel2);margin-bottom:12px}
.subject .sh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.subject .sh .g{font-size:12px;color:var(--dim)}
.subject .sn{font-size:14px;font-weight:600}
.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.choices .btn{flex:none}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat .k{font-size:26px;font-weight:650;letter-spacing:-.02em}
.stat .kl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.barmini{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.barmini i{display:block;height:100%;background:var(--q2)}

/* menu */
.menu{position:absolute;right:14px;top:48px;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);
  padding:5px;z-index:60;box-shadow:0 14px 40px #000a;min-width:190px}
.menu button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;font-size:13px}
.menu button:hover{background:var(--panel3)}
.menu hr{border:none;border-top:1px solid var(--line);margin:5px 2px}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--line2);
  padding:9px 15px;border-radius:99px;z-index:200;opacity:0;transition:.2s;pointer-events:none;font-size:13px}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
/* ---------- keyboard focus ----------
   The app is keyboard-first and had exactly one :focus-visible rule. Everything
   interactive gets the same ring, and :focus-visible means a mouse click never
   shows it — so this costs nothing visually while making Tab usable. */
.btn:focus-visible,.zoombar button:focus-visible,.sig:focus-visible,.ltog:focus-visible,
.card:focus-visible,.lrow:focus-visible,.subchk:focus-visible,.grip:focus-visible,
.menu button:focus-visible,.evchip:focus-visible,.tchip:focus-visible,
[data-act]:focus-visible,[data-ge]:focus-visible,[data-ck]:focus-visible,[data-ui]:focus-visible,
[data-bud]:focus-visible,[data-fix]:focus-visible,[data-snooze]:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r2)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
.modal:focus{outline:none}

/* ---------- coarse pointers ----------
   The reorder arrows computed to ~13px tall and the list grip had no vertical
   padding at all: fine for a mouse, unhittable with a thumb. Grow the *target*
   without growing the ink — padding and a pseudo-element do the work, so nothing
   about the desktop layout changes. Only applied where the pointer really is coarse. */
@media (pointer:coarse){
  .btn{padding:10px 14px}
  .btn.sm{padding:8px 12px}
  .btn.ord{padding:9px 11px;font-size:11px}
  .bdel{padding:9px 12px}
  .subchk{width:20px;height:20px;font-size:12px}
  .chk{width:22px;height:22px}
  .lrow .grip,.card .grip{padding:12px 8px;font-size:15px;letter-spacing:-2px}
  .subgrip{opacity:.7;padding:10px 6px;font-size:14px}
  .sig{padding:8px 13px;font-size:12.5px}
  .sig .zz{font-size:16px;padding:0 4px}
  .ltog{padding:8px 12px;font-size:12.5px}
  .subpill{padding:4px 9px}
  .newin,.brif,.brthen,.blockwho{padding:9px 10px;font-size:13px}
  .brow input,.brow select{padding:9px;font-size:13px}
  .zoombar button{padding:9px 16px}
  /* anything that must stay visually small gets an invisible thumb-sized hit area */
  .sigopen .srow .zz,.stepdot{position:relative}
  .sigopen .srow .zz::after,.stepdot::after{content:"";position:absolute;inset:-12px}
}

@media (max-width:1100px){
  .weekgrid{grid-template-columns:repeat(4,1fr)}
  .rmhead,.rmrow{grid-template-columns:200px 1fr}
}
#btnCheckin .short{display:none}

@media (max-width:760px){
  .matrix{grid-template-columns:1fr}.weekgrid{grid-template-columns:1fr}
  /* the header carried brand + 4 zoom buttons + capture + undo/redo + a long
     check-in label + menu. That does not fit a phone, so: capture and the zoom bar
     each take a full row, and the check-in label shortens. */
  header{flex-wrap:wrap;gap:8px;padding:9px 12px}
  .capture{order:9;max-width:none;flex-basis:100%}
  .zoombar{order:10;flex-basis:100%}
  .zoombar button{flex:1;padding:9px 4px;text-align:center}
  header .spacer{display:none}
  #btnCheckin{margin-left:auto}
  #btnCheckin .long{display:none}
  #btnCheckin .short{display:inline}
  .viewhead{flex-wrap:wrap}
  .viewhead .nav{width:100%;display:flex;gap:6px}
  .viewhead .nav .btn{flex:1}
  .ltogs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  .ltog{flex:none}
  .fixrow{gap:6px}
  .fixrow input[type=date],.fixrow input[type=time]{flex:1;min-width:0}
}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="mk"></span>Ply</div>
  <div class="zoombar" id="zoombar">
    <button data-z="day">Day</button>
    <button data-z="week">Week</button>
    <button data-z="quarter">Quarter</button>
    <button data-z="list">List</button>
  </div>
  <div class="capture">
    <input id="capture" type="text" placeholder="Capture a goal or task&hellip;  (Enter)" autocomplete="off">
    <span class="hint muted tiny" id="captureHint"></span>
  </div>
  <div class="spacer"></div>
  <button class="btn ghost" id="btnUndo" title="Nothing to undo" disabled>&#8634;</button>
  <button class="btn ghost" id="btnRedo" title="Nothing to redo" disabled>&#8635;</button>
  <button class="btn" id="btnCheckin"><span class="long">Weekly check-in</span><span class="short">Check-in</span> <span id="checkinBadge" class="pill hidden"></span></button>
  <button class="btn ghost" id="btnMenu">&#8942;</button>
</header>

<div id="signals" class="empty"></div>

<main><div id="view"></div></main>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
/* =========================================================================
   PLY — thread your next move
   A ply is a strand twisted into a thread, a single move in a game tree, and the
   verb for working at something steadily. All three are the app.

   Single-file. No build step, no network, no dependencies. Data in localStorage.

   Architecture:
     STORE     persistence + mutation + undo-free simple state
     CLASSIFY  phrase -> goal type (auto / gated)
     ENGINE    next-step generation, silence detection, gates, scheduling
     VIEWS     day / week / quarter renderers (shared card language)
     CHECKIN   guided weekly review wizard
     UI        capture bar, goal editor, modals
   ========================================================================= */

/* ===================== [SECTION: UTIL] ===================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DAY_MS = 864e5;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}

// --- dates: everything internal is ISO. Day keys are 'YYYY-MM-DD' in LOCAL time.
function dkey(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function parseKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function today(){return dkey(new Date());}
function addDays(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d);}
function daysBetween(a,b){return Math.round((parseKey(b)-parseKey(a))/DAY_MS);}
function startOfWeek(k){const d=parseKey(k);d.setDate(d.getDate()-d.getDay());return dkey(d);} // Sunday
function fmtDay(k){return parseKey(k).toLocaleDateString(undefined,{weekday:'short'});}
function fmtDate(k){return parseKey(k).toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function fmtFull(k){return parseKey(k).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
/* same as fmtDate, but carries the year when it isn't this one — "Apr 26" is
   ambiguous for a date nine months out, which is exactly where projections land */
function fmtDateY(k){
  const d=parseKey(k);
  return d.getFullYear()===new Date().getFullYear() ? fmtDate(k)
    : d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function fmtTime(mins){const h=Math.floor(mins/60),m=mins%60;const ap=h<12?'am':'pm';const hh=h%12===0?12:h%12;
  return hh+(m?':'+String(m).padStart(2,'0'):'')+ap;}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function relDays(n){ if(n===0)return'today'; if(n===1)return'tomorrow'; if(n===-1)return'yesterday';
  return n>0?('in '+n+'d'):(Math.abs(n)+'d ago'); }

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1900);}

/* ===================== [SECTION: STORE] ===================== */
const KEY='ply.v1';
const LEGACY_KEY='thread.v1';   // the app was called Thread until it wasn't
let DB = null;
let MEMONLY = false;   // set if localStorage is unavailable (sandboxed preview)

const SCHEMA=7;   // bump whenever the shape changes; migrate() has to grow a step to match

function blankDB(){
  return {
    v:1, schema:SCHEMA,
    goals:[],
    events:[],              // calendar events, incl. step anchors
    log:[],                 // follow-through log
    meta:{
      lastCheckin:null,     // dateKey
      checkinDow:0,         // 0=Sun ... 6=Sat  (fixed-day cadence; see prefs)
      checkinMode:'day',    // 'day' = fixed weekday | 'elapsed' = every N days
      checkinEveryDays:7,
      checkinProgress:null, // {dateKey,i,touched} — resume a half-finished session
      projects:['Plumbline'],// known project names, feeds milestone auto-classify
      snoozed:[],           // [{k:'<kind>:<threadId>', until:dateKey}] — muted ribbon signals
      learned:[],           // [{terms:[],type,n}] — type corrections the classifier reuses
      dayBudgetMins:240,    // what a realistic day holds; drives the load bars + scheduling
      listHidden:[],        // goal types toggled off in the List view
      listDone:false,       // show the completed archive instead of live goals
      budget:{              // weekly money, split across categories (allocation, not a ledger)
        weekly:0,
        cats:[]             // [{id,name,amount,goalId}] — goalId may point at a threshold goal
      },
      zoom:'day',
      cursor:null,          // dateKey the views are centred on
      google:{              // the Google Calendar provider's settings (see the GOOGLE section)
        enabled:false,      // false = local provider, which is also the offline cache
        clientId:'',        // overrides the build-time default; public by design, not a secret
        calendarId:'primary',
        account:null        // the signed-in address, for Settings to name
      },
      gqueue:[]             // writes waiting on the network: [{id,op,localId,gcalId,at,tries}]
    }
  };
}

/* ---------- schema + migration ----------
   `if(!d.goals) throw 0` was the whole of the old import validation, so a file from
   a newer build would half-load and quietly lose whatever it didn't understand.
   Everything entering the app — localStorage or an imported file — comes through here. */
function migrate(d){
  if(!d || typeof d!=='object' || !Array.isArray(d.goals))
    return {ok:false, msg:'That file is not a Ply export.'};
  const from = d.schema || d.v || 1;
  if(from > SCHEMA)
    return {ok:false, msg:'That export is from a newer version of Ply (schema '+from+'). Update before importing it.'};

  // fill in anything added since the file was written
  const b=blankDB();
  for(const k in b) if(!(k in d)) d[k]=b[k];
  d.meta=d.meta||{};
  for(const k in b.meta) if(!(k in d.meta)) d.meta[k]=b.meta[k];

  if(from < 2){                                   // 1 -> 2: repeating events, snoozes, learned types
    d.events=(d.events||[]).map(e=>Object.assign({recur:null,skips:[]},e));
    d.meta.snoozed=d.meta.snoozed||[];
    d.meta.learned=d.meta.learned||[];
  }
  if(from < 3){                                   // 2 -> 3: the weekly money budget
    d.meta.budget = d.meta.budget || {weekly:0, cats:[]};
  }
  if(from < 4){                                   // 3 -> 4: subtasks under a step
    for(const g of d.goals) for(const t of (g.threads||[])) for(const s of (t.steps||[]))
      if(!Array.isArray(s.subs)) s.subs=[];
  }
  if(from < 6){                                   // 5 -> 6: completed goals are kept, not hidden
    for(const g of d.goals) if(!('doneAt' in g)) g.doneAt = g.status==='done' ? (g.createdAt||null) : null;
  }
  if(from < 7){                                   // 6 -> 7: Google Calendar mirror rows
    for(const e of (d.events||[])) if(!('gcal' in e)) e.gcal=null;
    d.meta.google = d.meta.google || b.meta.google;
    d.meta.gqueue = d.meta.gqueue || [];
  }

  /* The mirror fields have to hold whatever the file claimed: a row with a broken
     gcal object would be treated as remote and then fail every write against it. */
  for(const e of (d.events||[])){
    const g=e.gcal;
    e.gcal = (g && typeof g==='object' && (g.id===null||typeof g.id==='string'))
      ? {id:g.id||null, etag:g.etag||null, updated:g.updated||null, cal:g.cal||'primary',
         own:!!g.own, status:g.status==='cancelled'?'cancelled':'confirmed',
         link:typeof g.link==='string'?g.link:null, pending:!!g.pending}
      : null;
    if(!e.gcal && e.src==='google') e.src='manual';   // a remote row with no remote id isn't one
  }
  d.meta.google = (d.meta.google && typeof d.meta.google==='object') ? d.meta.google : b.meta.google;
  d.meta.google = {
    enabled:!!d.meta.google.enabled,
    clientId:String(d.meta.google.clientId||''),
    calendarId:String(d.meta.google.calendarId||'primary'),
    account:d.meta.google.account?String(d.meta.google.account):null
  };
  d.meta.gqueue = (Array.isArray(d.meta.gqueue)?d.meta.gqueue:[])
    .filter(x=>x && typeof x==='object' && ['create','patch','delete'].includes(x.op) && x.localId)
    .map(x=>({id:x.id||uid(), op:x.op, localId:String(x.localId), gcalId:x.gcalId||null,
              at:x.at||new Date().toISOString(), tries:+x.tries||0}));
  d.meta.listDone = !!d.meta.listDone;

  // only real type names may hide a row; anything else would silently blank the list
  d.meta.listHidden = (Array.isArray(d.meta.listHidden)?d.meta.listHidden:[]).filter(x=>!!TYPE[x]);

  // a step without a usable subs array would break every reader below
  for(const g of d.goals) for(const t of (g.threads||[])) for(const s of (t.steps||[]))
    s.subs = (Array.isArray(s.subs)?s.subs:[]).filter(x=>x&&typeof x==='object')
      .map(x=>({id:x.id||uid(), title:String(x.title||'Untitled'), done:!!x.done, doneAt:x.doneAt||null}));
  // shapes that must hold whatever the file claimed
  d.meta.budget = d.meta.budget || {weekly:0, cats:[]};
  d.meta.budget.weekly = +d.meta.budget.weekly || 0;
  d.meta.budget.cats = (d.meta.budget.cats||[]).filter(c=>c&&typeof c==='object')
    .map(c=>({id:c.id||uid(), name:String(c.name||'Untitled'), amount:+c.amount||0, goalId:c.goalId||null}));

  delete d.app; delete d.exportedAt;              // envelope fields, not state — don't let them accumulate
  d.schema=SCHEMA;
  return {ok:true, from};
}

function load(){
  let adopted=false;
  try{
    let raw = localStorage.getItem(KEY);
    if(raw==null){
      // data saved when this was called Thread. Read it, keep it, and leave the old
      // key alone — an orphaned backup costs nothing and a lost history costs plenty.
      const old = localStorage.getItem(LEGACY_KEY);
      if(old!=null){ raw=old; adopted=true; }
    }
    DB = raw ? JSON.parse(raw) : null;
  }catch(e){ MEMONLY=true; DB=null; }
  if(!DB) DB = blankDB();
  const m=migrate(DB);
  if(!m.ok){ DB=blankDB(); toast('Stored data could not be read — starting clean.'); }
  if(!DB.meta.cursor) DB.meta.cursor = today();
  DB.meta.snoozed = (DB.meta.snoozed||[]).filter(x=>x && x.until > today());   // expired snoozes drop off
  if(adopted){ save(); toast('Carried your data over from Thread.'); }
  return DB;
}
/* ---------- per-render memo ----------
   activeItems() ran 4–8 times in a single render and eventById() linear-scanned
   DB.events for every step in the quarter view. Both are pure reads, and the DB
   cannot change during render()'s synchronous body — so compute once there.

   PASS is null everywhere else on purpose. A cache that outlived the render would
   hand stale answers to anything that mutated the DB and then read back without
   saving, which is a bug waiting to happen rather than a speed-up worth having. */
let PASS=null;
const pass=(k,fn)=> PASS ? ((k in PASS) ? PASS[k] : (PASS[k]=fn())) : fn();

function save(){
  commitCheckpoint();
  if(MEMONLY) return;
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ MEMONLY=true; toast('Storage unavailable — session only. Use Export to keep data.'); }
}

/* ---------- undo / redo ----------
   Whole-DB snapshots. checkpoint() is called at the top of a user action; it only
   lands on the stack if the action actually changed something, so cancelled
   prompts and no-op clicks never leave a dead entry. Commit is deferred to the
   next tick so one action that saves several times is still one undo step. */
const UNDO=[], REDO=[], UNDO_MAX=25;
let PENDING=null;

function checkpoint(label){
  if(!DB || PENDING) return;                       // nested calls join the outer action
  PENDING={json:JSON.stringify(DB), label:label||'that change'};
  setTimeout(commitCheckpoint,0);
}
function commitCheckpoint(){
  if(!PENDING) return;
  const p=PENDING; PENDING=null;
  if(JSON.stringify(DB)===p.json) return;          // nothing happened — don't stack a no-op
  UNDO.push(p); if(UNDO.length>UNDO_MAX) UNDO.shift();
  REDO.length=0;
  paintUndo();
}
/* view state is this tab's business, not the snapshot's — keep it across a restore */
function restoreSnapshot(json){
  const view={zoom:DB.meta.zoom, cursor:DB.meta.cursor};
  DB=JSON.parse(json);
  DB.meta.zoom=view.zoom; DB.meta.cursor=view.cursor;
  PENDING=null;
  save(); closeModal(); CK=null; SIGOPEN=null; render();
}
function undo(){
  if($('.scrim')){ toast('Close this first, then undo.'); return; }
  if(!UNDO.length){ toast('Nothing to undo.'); return; }
  const e=UNDO.pop();
  REDO.push({json:JSON.stringify(DB), label:e.label});
  restoreSnapshot(e.json);
  toast('Undone: '+e.label);
}
function redo(){
  if($('.scrim')){ toast('Close this first, then redo.'); return; }
  if(!REDO.length){ toast('Nothing to redo.'); return; }
  const e=REDO.pop();
  UNDO.push({json:JSON.stringify(DB), label:e.label});
  restoreSnapshot(e.json);
  toast('Redone: '+e.label);
}
function paintUndo(){
  const u=$('#btnUndo'), r=$('#btnRedo'); if(!u) return;
  u.disabled=!UNDO.length; r.disabled=!REDO.length;
  u.title = UNDO.length ? 'Undo '+UNDO[UNDO.length-1].label : 'Nothing to undo';
  r.title = REDO.length ? 'Redo '+REDO[REDO.length-1].label : 'Nothing to redo';
}

/* ---------- other tabs ----------
   Two tabs each hold their own DB; without this the last save() silently wins.
   The storage event only fires in *other* tabs, so there's no echo to guard against. */
let EXTERNAL=null;
function adoptExternal(d){
  const view={zoom:DB.meta.zoom, cursor:DB.meta.cursor};
  DB=d; DB.meta.zoom=view.zoom; DB.meta.cursor=view.cursor;
  UNDO.length=0; REDO.length=0; PENDING=null;   // our snapshots describe a history that no longer exists
  paintUndo(); SIGOPEN=null; render();          // no save() — that would bounce the write back
  toast('Refreshed — another tab changed something.');
}
window.addEventListener('storage', e=>{
  if(e.key!==KEY || !e.newValue) return;
  let d; try{ d=JSON.parse(e.newValue); }catch(_){ return; }
  if(!migrate(d).ok) return;
  if($('.scrim')){ EXTERNAL=d; toast('Another tab made changes — refreshing when you close this.'); return; }
  adoptExternal(d);
});

/* --- accessors --- */
const goals      = ()=>DB.goals;
const liveGoals  = ()=>DB.goals.filter(g=>g.status==='active');
/* Finished goals used to vanish from every view, which made completing something
   indistinguishable from deleting it — in an app whose whole point is follow-through.
   They're kept and shown, newest first. */
const doneGoals  = ()=>DB.goals.filter(g=>g.status==='done')
                    .sort((a,b)=>String(b.doneAt||'').localeCompare(String(a.doneAt||'')));
function finishGoal(g,why){
  g.status='done'; g.doneAt=new Date().toISOString();
  g.threads.forEach(t=>{ if(t.status!=='done') t.status='done'; });
  logIt('closed',{goalId:g.id, text:why||'completed'});
}
function reopenGoal(g){
  g.status='active'; g.doneAt=null;
  g.threads.forEach(t=>{ if(t.status==='done') t.status='active'; });
  // a reopened goal must not come back dead — that's the rule everywhere else
  const t=g.threads[0];
  if(t && !currentStep(t)){ const s=firstStepFor(g,t,null); t.steps.push(s||newStep('Next move on '+shortName(g),{auto:true})); }
  touchThread(t||{});
  logIt('reopened',{goalId:g.id, text:g.title});
}
const goalById   = id=>DB.goals.find(g=>g.id===id);
function threadById(gid,tid){const g=goalById(gid);return g&&g.threads.find(t=>t.id===tid);}
function findThread(tid){for(const g of DB.goals){const t=g.threads.find(x=>x.id===tid);if(t)return{goal:g,thread:t};}return null;}
const eventIndex = ()=> pass('evmap',()=>{ const m=new Map(); for(const e of DB.events) m.set(e.id,e); return m; });
function eventById(id){
  if(!id) return null;
  const i=String(id).indexOf('@');
  if(i<0) return (PASS ? eventIndex().get(id) : DB.events.find(e=>e.id===id)) || null;
  const m=masterEvent(id);
  return m ? occurrenceOf(m, String(id).slice(i+1)) : null;
}
function currentStep(t){ return t.steps.find(s=>!s.done) || null; }
function lastDoneStep(t){ const d=t.steps.filter(s=>s.done); return d[d.length-1]||null; }

/* --- factories --- */
function newGoal(o={}){
  return Object.assign({
    id:uid(), title:'', type:'task', status:'active', doneAt:null,
    why:'',                                  // the reason — carried on decision→goal conversion
    notes:'',
    smart:{ outcome:'', metricName:'', metricUnit:'', target:null, current:0, deadline:null, deadlineSoft:false },
    trigger:'',                              // contingent-type
    stages:null,                             // pipeline-type
    backlog:[],                              // milestone-type
    cadenceDays:null,                        // silence-as-signal window; null = type default
    gates:[],                                // queued clarifying questions -> resolved in check-in
    threads:[],
    createdAt:new Date().toISOString(),
    origin:null                              // {fromGoalId, kind:'decision'} on conversion
  }, o);
}
function newThread(o={}){
  return Object.assign({
    id:uid(), name:'Main', rel:'sequential',
    status:'active',                         // active | blocked | dormant | done
    blockedOn:'', blockedSince:null,
    branches:[],                             // conditional: [{condition, next}]
    steps:[], lastMovement:new Date().toISOString()
  },o);
}
function newStep(title,o={}){
  return Object.assign({
    id:uid(), title, quadrant:'q2', done:false, doneAt:null,
    eventId:null, outcome:null, createdAt:new Date().toISOString(), auto:false,
    subs:[]            // one level of checklist under a step — see the SUBTASKS section
  },o);
}
function newSub(title){ return {id:uid(), title:String(title||'').trim(), done:false, doneAt:null}; }
function newEvent(o={}){
  return Object.assign({
    id:uid(), title:'', dateKey:today(), start:9*60, dur:60,
    src:'manual', goalId:null, threadId:null, stepId:null,
    recur:null,    // {every:<days>, until:<dateKey|null>} — manual events only, never step anchors
    skips:[],      // dateKeys of occurrences dropped out of the series
    /* the Google mirror. null on a purely local event; on a synced one it carries
       the remote id that makes undo, cross-tab sync and offline capacity work
       without the network being there. See the GOOGLE section. */
    gcal:null      // {id,etag,updated,cal,own,status,link,pending}
  },o);
}

/* --- log --- */
function logIt(kind, o={}){
  DB.log.push(Object.assign({id:uid(), ts:new Date().toISOString(), kind}, o));
  if(DB.log.length>4000) DB.log.splice(0, DB.log.length-4000);
}
function touchThread(t){ t.lastMovement = new Date().toISOString(); }

/* --- mutations --- */
function addGoal(g){ DB.goals.push(g); logIt('created',{goalId:g.id,text:g.title}); save(); return g; }
function deleteGoal(id){
  for(const e of DB.events) if(e.goalId===id && e.gcal && e.gcal.id) gEnqueue('delete',e);
  DB.events = DB.events.filter(e=>e.goalId!==id);
  DB.goals  = DB.goals.filter(g=>g.id!==id);
  save();
}
function addEvent(e){ DB.events.push(e); save(); return e; }
function removeEvent(id){
  const m=masterEvent(id); if(!m) return;
  /* every deletion path goes through here — the event modal, unanchoring, a goal
     being deleted — so this is the one place the remote delete has to be queued */
  if(m.gcal) gEnqueue('delete',m);
  if(m.stepId){ const f=findThread(m.threadId); if(f){const s=f.thread.steps.find(s=>s.id===m.stepId); if(s)s.eventId=null;} }
  DB.events = DB.events.filter(x=>x.id!==m.id); save();
}
/* drop a single occurrence out of a series without touching the rest */
function skipOccurrence(id){
  const m=masterEvent(id); if(!m||!m.recur||!m.recur.every) return;   // every:0 would loop forever below
  const i=String(id).indexOf('@'); const k = i<0 ? m.dateKey : String(id).slice(i+1);
  if(k===m.dateKey){                       // skipping the head: walk the series forward one step
    let nk=addDays(m.dateKey,m.recur.every);
    while((m.skips||[]).includes(nk)) nk=addDays(nk,m.recur.every);
    if(m.recur.until && nk>m.recur.until){ removeEvent(m.id); return; }
    m.dateKey=nk;
  } else {
    m.skips=(m.skips||[]).concat(k);
  }
  save();
}
/* --- repeating events ----------------------------------------------------
   One stored master per series; occurrences are generated at read time. Only
   manual events repeat — a step anchor is a single commitment by definition, and
   cyclical goals re-anchor themselves in completeStep() instead. That keeps
   activeItems()/signals() untouched: they only ever see real, stored events. */
function occursOn(e,k){
  if(!e.recur || !e.recur.every) return e.dateKey===k;
  if(k < e.dateKey) return false;
  if(e.recur.until && k > e.recur.until) return false;
  if(daysBetween(e.dateKey,k) % e.recur.every !== 0) return false;
  return !(e.skips||[]).includes(k);
}
/* the master's own date returns the real object, so mutations still stick */
function occurrenceOf(e,k){
  return e.dateKey===k ? e : Object.assign({},e,{id:e.id+'@'+k, dateKey:k, master:e.id, virtual:true});
}
function masterEvent(id){
  if(!id) return null;
  const i=String(id).indexOf('@');
  const key = i<0 ? String(id) : String(id).slice(0,i);
  return (PASS ? eventIndex().get(key) : DB.events.find(e=>e.id===key)) || null;
}
function eventsOn(k){
  return DB.events.filter(e=>occursOn(e,k)).map(e=>occurrenceOf(e,k)).sort((a,b)=>a.start-b.start);
}

/* --- calendar adapter seam ---------------------------------------------
   Views and the engine only ever talk to CAL, never to DB.events directly. Two
   providers live behind it: `local`, which is manual entry and is also the
   offline cache, and `google`, which syncs the same rows against a real
   calendar. Both answer through eventsOn(), which is the whole reason the
   Google provider needed no second read path — see the GOOGLE section.
------------------------------------------------------------------------ */
const CAL = {
  get provider(){ return gOn() ? 'google' : 'local'; },
  /* `writable` says Ply may schedule, not that the network is up. With a remote
     provider configured every write is accepted and queued; `online` is the
     separate question of whether it can be delivered right now. */
  get writable(){ return true; },
  get online(){ return this.provider==='local' || (GSTATE==='ready' && navigator.onLine!==false); },
  /* range read — no view calls it yet, but it's the shape a remote provider needs
     and it's covered by tests, so it stays as interface rather than being trimmed */
  list(fromKey,toKey){
    const out=[];
    for(let k=fromKey; k<=toKey; k=addDays(k,1)) out.push(...eventsOn(k));   // expands repeats
    return out;
  },
  on(k){ return eventsOn(k); },
  /* anchor a step to a slot; returns the local event, always synchronously —
     two callers mutate what comes back (the all-day flag), and the remote write
     is queued rather than awaited so scheduling never waits on a network. */
  anchor(goal,thread,step,dateKey,start,dur){
    const held = step.eventId ? masterEvent(step.eventId) : null;
    /* Re-anchoring moves the *same* Google event rather than deleting and
       remaking it, so it keeps its id, its reminders and anyone it was shared
       with. This is a deliberate local action, so it also wins over whatever
       time the remote currently holds — `pending` is what tells the next pull
       that this row is an intent, not a stale read. */
    if(held && held.gcal && held.gcal.id && held.gcal.status!=='cancelled' && this.provider==='google'){
      held.title=step.title; held.dateKey=dateKey; held.start=start; held.dur=dur||45;
      held.allDay=false; held.recur=null; held.skips=[];
      held.goalId=goal.id; held.threadId=thread.id; held.stepId=step.id;
      held.gcal.status='confirmed'; held.gcal.own=true;
      gEnqueue('patch',held); gFlush().catch(gNote);
      logIt('planned',{goalId:goal.id, threadId:thread.id, stepId:step.id, text:step.title, dateKey});
      save(); return held;
    }
    if(step.eventId) removeEvent(step.eventId);
    const ev = addEvent(newEvent({
      title:step.title, dateKey, start, dur:dur||45,
      goalId:goal.id, threadId:thread.id, stepId:step.id
    }));
    step.eventId = ev.id;
    if(this.provider==='google'){
      ev.src='google';
      ev.gcal={id:null, etag:null, updated:null, cal:gCal(), own:true, status:'confirmed', link:null, pending:true};
      gEnqueue('create',ev); gFlush().catch(gNote);
    }
    logIt('planned',{goalId:goal.id, threadId:thread.id, stepId:step.id, text:step.title, dateKey});
    save(); return ev;
  },
  /* removeEvent() queues the remote delete — it is the single choke point every
     deletion path already went through, so unanchoring needs nothing extra. */
  unanchor(step){
    if(step.eventId){ removeEvent(step.eventId); gFlush().catch(gNote); }
    step.eventId=null; save();
  },
  /* minutes booked in a given day — now including whatever the real calendar
     holds, which is the point of the integration. All-day items stay exempt, and
     so does an event Google no longer has (it's a tombstone, not a commitment). */
  loadOn(k){ return eventsOn(k).reduce((n,e)=>n+((e.allDay||gDead(e))?0:e.dur),0); },
  loadWeek(weekStartKey){ let n=0; for(let i=0;i<7;i++) n+=this.loadOn(addDays(weekStartKey,i)); return n; }
};

/* ===================== [SECTION: GOOGLE] =====================
   A second CAL provider. One decision drives everything else here: Google is a
   *sync source into DB.events*, not a read-through. Every remote event lands as a
   mirror row, so eventsOn() still answers every read, loadOn() still counts the
   real calendar, and undo, cross-tab adoption and the entire offline story keep
   working untouched. A read-through provider would have needed a parallel path
   through all three.

   Two API facts shaped the rest:

   * syncToken cannot be combined with timeMin/timeMax (nor q, orderBy, updatedMin
     or privateExtendedProperty). So the token-minting full sync is unbounded and
     the window is applied locally as rows are stored — Google's own "filter
     client-side" guidance. Every incremental pull after that is tiny.
   * The browser token model has no refresh tokens, and a silent renewal can be
     eaten by a popup blocker because it isn't a user gesture. So a background poll
     that meets a 401 retries once silently and then parks in `stale`, queues its
     writes and puts a click-to-reconnect chip in the ribbon, rather than
     pretending it can recover on its own.

   Sync bookkeeping (the sync token, the last-sync stamp) lives in its own
   localStorage key rather than in DB. It is per-browser cursor state, not user
   data: keeping it out of DB means a poll that finds nothing changed writes
   nothing, which is what stops a five-minute timer from firing `storage` in every
   other tab and wiping their undo stacks.
------------------------------------------------------------------------ */
const G_SCOPE = 'https://www.googleapis.com/auth/calendar.events email';
const G_GIS   = 'https://accounts.google.com/gsi/client';
const G_API   = 'https://www.googleapis.com/calendar/v3';
const G_WHO   = 'https://www.googleapis.com/oauth2/v3/userinfo';
const G_SYNCKEY = 'ply.gcal.sync';        // {token,last} — per-browser, never exported
const G_LOCKKEY = 'ply.gcal.leader';      // {tab,ts}
const G_BACK_DAYS = 30, G_FWD_DAYS = 180; // the cached window: a quarter view plus headroom
const G_POLL  = 5*60*1000;
const G_LEASE = 90*1000;
const G_MAXPAGES = 20;                    // a first sync past this falls back to windowed polling
const G_TAB = Math.random().toString(36).slice(2,10);

/* The build-time default. A Vite `define` replaces the bare identifier; with no
   build step the <meta> tag is the no-config path, and the Settings field
   overrides both. A browser client id is public by design — there is nothing
   here that would be a secret if someone read it out of localStorage. */
const G_BUILD_ID = (()=>{
  try{ if(typeof __PLY_GOOGLE_CLIENT_ID__!=='undefined') return String(__PLY_GOOGLE_CLIENT_ID__); }catch(_){}
  try{ const t=document.querySelector('meta[name="ply-google-client-id"]'); if(t) return String(t.content||''); }catch(_){}
  return '';
})();

const gmeta  = ()=> (DB.meta.google = DB.meta.google || {enabled:false, clientId:'', calendarId:'primary', account:null});
const gqueue = ()=> (DB.meta.gqueue = Array.isArray(DB.meta.gqueue) ? DB.meta.gqueue : []);
const gCal   = ()=> gmeta().calendarId || 'primary';
const gOn    = ()=> !!(DB && DB.meta && DB.meta.google && DB.meta.google.enabled);
const gClientId = ()=> String(gmeta().clientId || G_BUILD_ID || '').trim();
const gerr   = (kind,msg)=> Object.assign(new Error(msg||kind), {kind});

/* Google will not accept file:// (origin `null`) as an authorized JavaScript
   origin, so the offline single-file build cannot ever authenticate. Say so in
   Settings rather than letting the popup fail with a bare redirect_uri_mismatch. */
function gOriginOK(){
  try{
    if(location.protocol==='https:') return true;
    return location.protocol==='http:' && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  }catch(_){ return false; }
}

/* --- per-browser sync cursor --- */
function gCursor(){
  try{ return JSON.parse(localStorage.getItem(G_SYNCKEY)||'null') || {token:null,last:null}; }
  catch(_){ return {token:null,last:null}; }
}
function gCursorSet(o){
  try{ localStorage.setItem(G_SYNCKEY, JSON.stringify(Object.assign(gCursor(),o))); }catch(_){}
}

/* --- auth ---------------------------------------------------------------- */
let GTOK=null;          // {token,exp} — memory only, never persisted
let GSTATE='off';       // off | ready | stale | offline | error
let GIS=null;           // the GIS token client
let GPEND=null;         // in-flight token request, shared by concurrent callers
let GERR=null;
let GISLOAD=null;

function gLoadGIS(){
  try{ if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve(); }catch(_){}
  if(GISLOAD) return GISLOAD;
  return GISLOAD = new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=G_GIS; s.async=true; s.defer=true;
    s.onload=()=>res();
    s.onerror=()=>{ GISLOAD=null; rej(gerr('offline','Could not load Google sign-in.')); };
    document.head.appendChild(s);
  });
}

function gTokenClient(){
  const id=gClientId();
  if(!id) throw gerr('config','No Google client id yet — add one in Settings.');
  if(!GIS || GIS.__plyId!==id){
    GIS = google.accounts.oauth2.initTokenClient({client_id:id, scope:G_SCOPE, callback:()=>{}});
    GIS.__plyId = id;
  }
  return GIS;
}

/* mode: '' silent renewal | 'consent' the interactive grant */
function gRequestToken(mode){
  if(GPEND) return GPEND;
  GPEND = gLoadGIS().then(()=> new Promise((res,rej)=>{
    let settled=false;
    const c=gTokenClient();
    c.callback = r=>{
      if(settled) return; settled=true;
      if(r && r.access_token){
        GTOK={token:r.access_token, exp:Date.now()+((+r.expires_in||3600)*1000)-60000};
        GSTATE='ready'; GERR=null; res(GTOK);
      } else rej(gerr('auth',(r&&r.error_description)||'Google declined the token request.'));
    };
    c.error_callback = e=>{ if(settled) return; settled=true; rej(gerr('auth',(e&&e.message)||'Google sign-in was dismissed.')); };
    try{ c.requestAccessToken({prompt:mode||''}); }
    catch(e){ settled=true; rej(gerr('auth',e.message)); return; }
    /* a silent renewal has no user gesture behind it and can be swallowed whole by
       a popup blocker — never leave the caller hanging on a promise that won't settle */
    if(!mode) setTimeout(()=>{ if(!settled){ settled=true; rej(gerr('auth','Silent renewal did not come back.')); } },12000);
  }));
  const done=()=>{ GPEND=null; };
  GPEND.then(done,done);
  return GPEND;
}

async function gToken(){
  if(GTOK && GTOK.exp>Date.now()) return GTOK.token;
  const t=await gRequestToken('');
  return t.token;
}

async function gConnect(){
  if(!gOriginOK()) throw gerr('origin','Google needs an https or localhost origin — this page is '+location.protocol);
  if(!gClientId()) throw gerr('config','Add your OAuth client id in Settings first.');
  try{ await gRequestToken(gmeta().account ? '' : 'consent'); }
  catch(e){ if(!gmeta().account) throw e; await gRequestToken('consent'); }
  const m=gmeta();
  m.enabled=true;
  try{
    const r=await fetch(G_WHO,{headers:{Authorization:'Bearer '+GTOK.token}});
    if(r.ok){ const who=await r.json(); m.account=who.email||m.account||null; }
  }catch(_){ /* the email scope is a nicety; the calendar still works without it */ }
  save();
  gStart();
  await gSync({full:true, reason:'connect'});
  return m.account;
}

/* Disconnecting must not cost you your schedule: Ply-owned rows stay as ordinary
   local events with their step links intact, and only the foreign cache goes. */
function gDisconnect(){
  const tok = GTOK && GTOK.token;
  if(tok){ try{ google.accounts.oauth2.revoke(tok, ()=>{}); }catch(_){} }
  GTOK=null; GSTATE='off'; GERR=null;
  DB.events = DB.events.filter(e=>{
    if(!e.gcal) return true;
    if(e.stepId){ e.gcal=null; e.src='manual'; return true; }
    return false;
  });
  DB.meta.gqueue=[];
  const m=gmeta(); m.enabled=false; m.account=null;
  gCursorSet({token:null,last:null});
  gStop(); save();
}

/* --- the wire ------------------------------------------------------------ */
const gWait = ms => new Promise(r=>setTimeout(r,ms));

async function gapi(path,{method='GET',query=null,body=null,tries=0}={}){
  const tok=await gToken();
  const url=G_API+path+(query?('?'+new URLSearchParams(query)):'');
  let r;
  try{
    r=await fetch(url,{
      method,
      headers:Object.assign({Authorization:'Bearer '+tok}, body?{'Content-Type':'application/json'}:{}),
      body: body?JSON.stringify(body):undefined
    });
  }catch(_){
    if(GSTATE==='ready') GSTATE='offline';
    throw gerr('offline','No route to Google right now.');
  }
  if(r.status===401){
    GTOK=null;
    if(tries<1) return gapi(path,{method,query,body,tries:tries+1});
    GSTATE='stale'; throw gerr('auth','Google access expired — reconnect in Settings.');
  }
  if(r.status===410) throw gerr('gone','That sync token is no longer valid.');
  if(r.status===404) throw gerr('missing','That event is no longer in Google.');
  if(r.status===403 || r.status>=500){
    if(tries<3){ await gWait(400*Math.pow(2,tries)); return gapi(path,{method,query,body,tries:tries+1}); }
    throw gerr('api','Google refused the request ('+r.status+').');
  }
  if(!r.ok) throw gerr('api','Google returned '+r.status+'.');
  if(r.status===204) return null;
  try{ return await r.json(); }catch(_){ return null; }
}

/* --- mapping ------------------------------------------------------------- */
const G_TZ = (()=>{ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'; }catch(_){ return 'UTC'; } })();

function gISO(k,mins){
  const d=parseKey(k); d.setHours(0, Math.max(0,mins||0), 0, 0);   // Date normalises past midnight
  const p=n=>String(n).padStart(2,'0');
  const off=-d.getTimezoneOffset(), a=Math.abs(off);
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())+':00'
    +(off<0?'-':'+')+p(Math.floor(a/60))+':'+p(a%60);
}
function gReadTime(v){
  if(!v) return null;
  if(v.date) return {allDay:true, dateKey:v.date, start:0, at:parseKey(v.date).getTime()};
  const d=new Date(v.dateTime||'');
  if(isNaN(d.getTime())) return null;
  return {allDay:false, dateKey:dkey(d), start:d.getHours()*60+d.getMinutes(), at:d.getTime()};
}
/* A Google resource -> the fields a mirror row carries. Recurring series arrive
   already expanded (singleEvents=true), so every instance is its own row with
   recur:null — occurrenceOf() must never see one. A multi-day all-day event is
   mirrored on its first day only; Ply's model has no multi-day event, and all-day
   items are capacity-exempt anyway. */
function gToRow(ge, calId){
  const s=gReadTime(ge.start), e=gReadTime(ge.end);
  if(!s) return null;
  let dur;
  if(s.allDay) dur=1440;
  else if(e && !e.allDay) dur=Math.max(5, Math.round((e.at-s.at)/60000));
  else dur=60;
  const priv=(ge.extendedProperties&&ge.extendedProperties.private)||{};
  return {
    title:String(ge.summary||'(no title)'),
    dateKey:s.dateKey, start:s.start, dur, allDay:s.allDay,
    src:'google', recur:null, skips:[],
    goalId:priv.plyGoalId||null, threadId:priv.plyThreadId||null, stepId:priv.plyStepId||null,
    gcal:{id:ge.id, etag:ge.etag||null, updated:ge.updated||null, cal:calId,
          own:!!priv.plyStepId, status:ge.status||'confirmed',
          link:ge.htmlLink||null, pending:false}
  };
}
/* A mirror row -> the body Google wants. Built at flush time, never at enqueue
   time, because two callers mutate the event object after anchor() returns. */
function gFromRow(e){
  const body={summary:e.title||'Untitled'};
  if(e.allDay){ body.start={date:e.dateKey}; body.end={date:addDays(e.dateKey,1)}; }
  else{
    body.start={dateTime:gISO(e.dateKey,e.start), timeZone:G_TZ};
    body.end  ={dateTime:gISO(e.dateKey,e.start+(e.dur||45)), timeZone:G_TZ};
  }
  if(e.stepId) body.extendedProperties={private:{
    plyStepId:String(e.stepId), plyGoalId:String(e.goalId||''), plyThreadId:String(e.threadId||''), plyV:String(SCHEMA)}};
  return body;
}

/* --- the window ---------------------------------------------------------- */
const gWinFrom = ()=> addDays(today(), -G_BACK_DAYS);
const gWinTo   = ()=> addDays(today(),  G_FWD_DAYS);
const inWindow = k => k>=gWinFrom() && k<=gWinTo();
const gDead    = e => !!(e && e.gcal && e.gcal.status==='cancelled');

/* --- the offline queue --------------------------------------------------- */
const GDONE=new Set();   // jobs flushed this session — an undo must not resurrect them

function gEnqueue(op,row){
  if(!gOn() || !row) return 0;
  const q=gqueue(), lid=row.id;
  if(op==='delete'){
    const neverSent = q.some(x=>x.localId===lid && x.op==='create');
    DB.meta.gqueue = q.filter(x=>x.localId!==lid);        // every pending op for this row is moot
    if(neverSent) return DB.meta.gqueue.length;           // it never reached Google; nothing to delete
    DB.meta.gqueue.push({id:uid(), op:'delete', localId:lid,
      gcalId:(row.gcal&&row.gcal.id)||null, at:new Date().toISOString(), tries:0});
    return DB.meta.gqueue.length;
  }
  if(row.gcal) row.gcal.pending=true;
  if(q.some(x=>x.localId===lid)) return q.length;         // already queued; the payload is read at flush
  q.push({id:uid(), op, localId:lid, gcalId:(row.gcal&&row.gcal.id)||null,
          at:new Date().toISOString(), tries:0});
  return q.length;
}
const gPending = ()=> (DB&&DB.meta&&Array.isArray(DB.meta.gqueue)) ? DB.meta.gqueue.length : 0;

let GFLUSH=null;
function gFlush(){ return GFLUSH || (GFLUSH = gFlushRun().finally(()=>{GFLUSH=null;})); }

async function gFlushRun(){
  if(!gOn()) return 0;
  let done=0;
  while(gqueue().length){
    const job=gqueue()[0];
    if(GDONE.has(job.id)){ gqueue().shift(); continue; }
    const row = job.op==='delete' ? null : DB.events.find(e=>e.id===job.localId);
    try{
      if(job.op==='delete'){
        if(job.gcalId) await gapi('/calendars/'+encodeURIComponent(gCal())+'/events/'+encodeURIComponent(job.gcalId),{method:'DELETE'});
      } else if(!row){
        /* the row went away under us (undo, or the goal was deleted) — drop the job */
      } else if(job.op==='create' || !row.gcal || !row.gcal.id){
        const r=await gapi('/calendars/'+encodeURIComponent(gCal())+'/events',{method:'POST', body:gFromRow(row)});
        row.src='google';
        row.gcal=Object.assign(row.gcal||{}, {id:r&&r.id, etag:(r&&r.etag)||null, updated:(r&&r.updated)||null,
          cal:gCal(), own:!!row.stepId, status:(r&&r.status)||'confirmed', link:(r&&r.htmlLink)||null, pending:false});
      } else {
        const r=await gapi('/calendars/'+encodeURIComponent(gCal())+'/events/'+encodeURIComponent(row.gcal.id),
          {method:'PATCH', body:gFromRow(row)});
        Object.assign(row.gcal, {etag:(r&&r.etag)||null, updated:(r&&r.updated)||null,
          status:(r&&r.status)||'confirmed', link:(r&&r.htmlLink)||row.gcal.link||null, pending:false});
      }
      GDONE.add(job.id); gqueue().shift(); done++; save();
    }catch(err){
      /* already gone in Google is a finished delete, not a failure */
      if(err.kind==='missing' || (err.kind==='gone' && job.op==='delete')){
        GDONE.add(job.id); gqueue().shift();
        if(row&&row.gcal) row.gcal.pending=false;
        save(); continue;
      }
      /* nothing deliverable right now: stop, keep the order, try again on reconnect */
      if(err.kind==='offline'||err.kind==='auth'||err.kind==='config'||err.kind==='origin'){ GERR=err.message; break; }
      job.tries=(job.tries||0)+1;
      if(job.tries>=5){ GERR=err.message; gqueue().shift(); save(); continue; }
      break;
    }
  }
  if(!gqueue().length && GERR) GERR=null;   // nothing outstanding, nothing to report
  if(done) render();
  return done;
}

/* --- sync ---------------------------------------------------------------- */
/* One tab syncs. Without this every tab polls, and each poll's save() fires
   `storage` in the others, whose adoptExternal() throws their undo stack away. */
function gLease(){
  if(MEMONLY) return true;
  try{
    const now=Date.now();
    const cur=JSON.parse(localStorage.getItem(G_LOCKKEY)||'null');
    if(cur && cur.tab!==G_TAB && (now-cur.ts)<G_LEASE) return false;
    localStorage.setItem(G_LOCKKEY, JSON.stringify({tab:G_TAB, ts:now}));
    return true;
  }catch(_){ return true; }
}

let GSYNC=null;
function gSync(opts={}){
  if(!gOn()) return Promise.resolve({skipped:'off'});
  if(!gLease()) return Promise.resolve({skipped:'follower'});
  if(GSYNC) return GSYNC;
  GSYNC = gSyncRun(opts).finally(()=>{GSYNC=null;});
  return GSYNC;
}

async function gSyncRun({full=false, reason='poll'}={}){
  await gFlush();                                  // our own writes land before we read back
  const cal=encodeURIComponent(gCal());
  let token = full ? null : gCursor().token;
  let page=null, next=null, pages=0;
  const items=[];
  do{
    const q = token
      ? {syncToken:token, singleEvents:'true', showDeleted:'true', maxResults:'2500'}
      : {singleEvents:'true', showDeleted:'true', maxResults:'2500'};
    if(page) q.pageToken=page;
    let r;
    try{ r=await gapi('/calendars/'+cal+'/events',{query:q}); }
    catch(err){
      if(err.kind==='gone'){ gCursorSet({token:null}); return gSyncRun({full:true, reason:'410'}); }
      GERR=err.message; renderSignals(); throw err;
    }
    items.push(...(r.items||[]));
    page=r.nextPageToken||null;
    next=r.nextSyncToken||next;
    /* a calendar with a decade of history would page forever on the first sync.
       Stop, keep what we have, and carry on with full window pulls instead. */
    if(++pages>=G_MAXPAGES){ page=null; next=null; }
  } while(page);

  const n=gApply(items,{cal:gCal(), replace:!token});
  gCursorSet({token:next||null, last:new Date().toISOString()});
  GSTATE='ready'; GERR=null;
  if(n){ save(); render(); } else { renderSignals(); }
  return {n, seen:items.length, incremental:!!token, reason};
}

/* Returns how many local rows actually changed, so a quiet poll writes nothing. */
function gApply(items,{cal,replace}){
  let n=0;
  const seen=new Set();
  const byId=new Map();
  for(const e of DB.events) if(e.gcal && e.gcal.id) byId.set(e.gcal.id, e);

  for(const ge of items){
    if(!ge || !ge.id) continue;
    seen.add(ge.id);
    const cur=byId.get(ge.id);
    if(ge.status==='cancelled'){ n+=gCancel(cur)?1:0; continue; }
    const row=gToRow(ge,cal);
    if(!row){ n+=gCancel(cur)?1:0; continue; }
    if(!inWindow(row.dateKey)){ if(cur && !cur.stepId) n+=gDrop(cur)?1:0; continue; }
    if(!cur){ gAdopt(row); byId.set(ge.id, DB.events[DB.events.length-1]); n++; continue; }
    n+=gMerge(cur,row)?1:0;
  }

  if(replace){
    for(const e of DB.events.slice()){
      if(!e.gcal || !e.gcal.id || seen.has(e.gcal.id)) continue;   // a queued create has no id yet
      n += (inWindow(e.dateKey) ? gCancel(e) : gDrop(e)) ? 1 : 0;
    }
  }
  for(const e of DB.events.slice())
    if(e.gcal && !e.stepId && !inWindow(e.dateKey)) n+=gDrop(e)?1:0;
  return n;
}

/* Deleted in Google. A row that carries a step keeps its link and is tombstoned,
   so signals() raises "not on the calendar" instead of the app quietly
   unanchoring a commitment you never said you'd dropped. */
function gCancel(e){
  if(!e) return false;
  if(e.stepId){
    if(e.gcal && e.gcal.status==='cancelled') return false;
    e.gcal=Object.assign(e.gcal||{}, {status:'cancelled', pending:false});
    return true;
  }
  return gDrop(e);
}
function gDrop(e){
  if(!e) return false;
  const i=DB.events.indexOf(e);
  if(i<0) return false;
  DB.events.splice(i,1);
  return true;
}
function gAdopt(row){
  const ev=addEvent(newEvent(Object.assign({},row)));
  /* an event Ply created on another device comes home and finds its step */
  if(row.stepId){
    const f=findStep(row.stepId);
    if(f){
      const held = f.step.eventId ? masterEvent(f.step.eventId) : null;
      if(!held || gDead(held) || held===ev) f.step.eventId=ev.id;
    }
  }
  return ev;
}
/* Conflict rules: remote wins for time and title, Ply wins for the step link.
   "Remote wins" means a change Ply did not originate — a re-anchor we haven't
   delivered yet is a local intent, not a stale read, so `pending` holds it. */
function gMerge(cur,row){
  let changed=false;
  const pending = !!(cur.gcal && cur.gcal.pending);
  const newer = !cur.gcal || !cur.gcal.updated || !row.gcal.updated || row.gcal.updated > cur.gcal.updated;
  if(!pending && newer){
    for(const f of ['title','dateKey','start','dur','allDay'])
      if(cur[f]!==row[f]){ cur[f]=row[f]; changed=true; }
  }
  if(cur.stepId && !row.stepId){
    gEnqueue('patch',cur); changed=true;          // someone stripped our property — put it back
  } else if(!cur.stepId && row.stepId){
    cur.stepId=row.stepId; cur.goalId=row.goalId; cur.threadId=row.threadId; changed=true;
  }
  const g=cur.gcal||(cur.gcal={});
  if(g.status==='cancelled'){ g.status=row.gcal.status||'confirmed'; changed=true; }   // put back in Google
  g.etag=row.gcal.etag; g.updated=row.gcal.updated; g.link=row.gcal.link||g.link||null;
  g.own = g.own || row.gcal.own; g.cal = g.cal || row.gcal.cal;
  if(cur.src!=='google'){ cur.src='google'; changed=true; }
  return changed;
}

/* An event that lives in Google and isn't one of ours. Ply shows it and counts it
   against the day, but doesn't pretend to own it: it is edited where it was made. */
const gForeign = e => !!(e && e.gcal && !e.stepId);

/* Settings writes straight into meta. Changing the calendar invalidates the sync
   cursor — a token is scoped to the collection that minted it. */
